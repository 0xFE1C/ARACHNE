<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ARACHNE{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
{% if principal is defined and principal %}
<header class="top">
  <span class="brand">ARACHNE</span>
  <nav>
    <a href="/ui/">Dashboard</a>
    <a href="/ui/scans">Scans</a>
    <a href="/ui/posture">Posture</a>
    <a href="/ui/modules">Modules</a>
    <a href="/ui/feeds">Feeds</a>
    <a href="/ui/plugins">Plugins</a>
    <a href="/ui/quality">Quality</a>
    <a href="/ui/schedules">Schedules</a>
    <a href="/docs" target="_blank" rel="noopener">API</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted small">{{ principal.label }} · {{ principal.role }}</span>
  <form method="post" action="/ui/logout" class="inline"><button type="submit">Sign out</button></form>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
