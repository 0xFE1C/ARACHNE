# English (en) translation catalogue — ARACHNE's reference locale.
#
# This is committed data loaded through importlib.resources (see arachne/i18n/), the same
# way every other shipped corpus is loaded. The English values are byte-identical to the
# strings the renderers used to hold inline, so routing them through `translate(key)` leaves
# an English report unchanged (S14, extended in S26).
#
# Keys are dotted and namespaced by the layer that owns them:
#   report.section.*    the numbered headings of  (the renderer supplies the
#                       number and the leading `##`)
#   report.appendix.*   the lettered sub-headings of the appendix section
#   report.finding.*    the per-finding bold labels
#   report.severity.*   the severity ladder as a *label* ("findings — High")
#   report.label.*      cover and table labels
#   report.attack_path.* the attack-path table headers and the cheapest-break line
#
# A second locale is a sibling file, `templates/i18n/<locale>.yaml`, with the same keys; a
# missing key falls back to English rather than failing (see `Translator.translate`). A
# managed-data override may point a deployment at its own file (F-09-04).
#
# Scope of translation (stated so it is not mistaken for more): the catalogue covers the
# report's *structural labels* — headings, severity names, table headers, per-finding
# labels. Narrative prose (the executive-summary paragraphs, the explanatory sentence under
# each section) is generated text that ships in English; it is catalogue-able the same way
# but needs a translation pass, not a renderer change.
#
# `tests/unit/test_i18n.py` fails the build when a renderer names a `report.*` key that is
# not here, and when a locale's key set diverges from English.

version: "1.0"
locale: en

strings:
  # ---- numbered sections ------------------------------------------
  report.section.executive_summary: "Executive summary"
  report.section.scope: "Scope & methodology"
  report.section.assets: "Asset inventory"
  report.section.findings: "Findings"
  report.section.attack_paths: "Attack paths"
  report.section.low_confidence: "Low-confidence observations"
  report.section.patch_gap: "Patch-gap & exposure (M6)"
  report.section.appendix: "Appendix"
  # S28: the what-if annex (area SIM, REQ-SIM-004). Its own heading, placed after the
  # appendix, so a reader cannot mistake a simulated path for a finding.
  report.section.simulation: "Simulated scenarios (what-if)"
  report.simulation.disclosure: "Simulated — nothing here was observed on a target"
  report.simulation.hypotheses: "Hypothetical states injected"
  report.simulation.refusals: "Hypotheses that could not be applied"
  report.simulation.paths: "Resulting paths"
  report.simulation.change: "Proposed change"

  # ---- appendix sub-sections ---------------------------------------------------------
  # WP-14 (area PROOF, REQ-PROOF-017): the residue warning a non-clean attestation raises,
  # rendered directly under the executive summary. The statement that follows it is quoted
  # from the signed artefact and is deliberately *not* translated.
  report.residue.warning: "Residue: this scan did not restore everything it changed"
  report.residue.attestation: "Residue attestation"
  report.residue.signed: "signed with the deployment key"
  report.residue.unsigned: "UNSIGNED — no deployment key configured"

