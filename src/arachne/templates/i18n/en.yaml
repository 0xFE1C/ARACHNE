  # =====================================================================================
  # Web interface (REQ-UIX-008, WP-06).
  #
  # Every user-visible string of `templates/web/` lives here: the Jinja global `t(key)` reads
  # one, `tp(key, count)` reads its plural form (`<key>.one` / `<key>.other`), and the
  # `| number` / `| datetime` filters format counts and timestamps from the keys below. No
  # template carries a literal — `python -m arachne.i18n.audit` fails the build on one, and
  # on a key that is missing from any shipped locale.
  #
  # Keys are dotted and namespaced by the screen that owns them (`ui.<screen>.<part>`); the
  # shared vocabulary (`ui.common.*`, `ui.state.*`, `ui.table.*`, `ui.status.*`) is what keeps
  # "Status" or "No scans yet." from existing twice, in two spellings.
  # =====================================================================================

