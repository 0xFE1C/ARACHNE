# French (fr) translation catalogue — the second report language (S26, REQ-ECOS-005).
#
# A sibling of `en.yaml` with the same key set. `tests/unit/test_i18n.py` fails the build
# when the two diverge, so a key added to one must be added to the other — a missing French
# key would otherwise fall back to English silently, which reads as a half-translated report
# rather than a caught defect.
#
# Security vocabulary is translated with care: "remédiation" (remediation), "sévérité"
# (severity), "constat" (finding) and "périmètre" (scope) are the terms a French-speaking
# security team uses, not literal calques. Identifiers, check ids, CWE/CVE/CVSS values and
# asset names are never translated — they are data.
#
# Select it per report: `arachne report <scan> --locale fr`, `?locale=fr` on the API, or a
# project default (`arachne project locale <slug> fr`). The deployment default is
# `ARACHNE_REPORT_LOCALE`.

