  - id: net.rdp-without-nla
    title: "RDP does not require network-level authentication"
    check_ref: ["m2.rdp-vnc-detect", "research:ch02#25"]
    severity_if:
      - 'title matches "network-level authentication" -> high'
    confidence:
      - 'title matches "network-level authentication" -> 0.85'
    cwe: CWE-287
    remediation: remediation-catalog/rdp-nla.yaml
    narrative: net.rdp-without-nla
    tags: [rdp, authentication]

  - id: net.vnc-unauthenticated
    title: "VNC offers unauthenticated access"
    check_ref: ["m2.rdp-vnc-detect", "research:ch02#25"]
    severity_if:
      - 'title matches "unauthenticated access" -> critical'
    confidence:
      - 'title matches "unauthenticated access" -> 0.95'
    cwe: CWE-306
    remediation: remediation-catalog/vnc-authentication.yaml
    narrative: net.vnc-unauthenticated
    tags: [vnc, authentication]

  - id: net.vnc-legacy-password
    title: "VNC uses the legacy 8-byte DES password scheme"
    check_ref: ["m2.rdp-vnc-detect", "research:ch02#25"]
    severity_if:
      - 'title matches "legacy VNC password" -> medium'
    confidence:
      - 'title matches "legacy VNC password" -> 0.6'
    cwe: CWE-326
    remediation: remediation-catalog/vnc-authentication.yaml
    narrative: net.vnc-legacy-password
    tags: [vnc, crypto]

  # ----------------------------------------------------------------- M2 · TLS
  - id: net.tls-weak-protocols
    title: "TLS endpoint negotiates deprecated protocol versions"
    check_ref: ["m2.tls-deep-scan", "research:ch02#14"]
    conditions:
      weak_versions: {evidence.tls_certificate.weak_versions}
      trust_error: {evidence.tls_certificate.trust_error}
    severity_if:
      - "weak_versions -> high"
      - "trust_error -> medium"
    default_severity: medium
    confidence:
      - "weak_versions -> 0.9"
    default_confidence: 0.7
    cwe: CWE-327
    remediation: remediation-catalog/tls-configuration.yaml
    narrative: net.tls-weak-protocols
    tags: [tls, crypto]

  # ----------------------------------------------------------------- M2 · CVE correlation
  - id: net.vulnerable-component-version
    title: "Component version falls inside a known vulnerability range"
    check_ref: ["m2.cve-correlate", "research:ch02#29"]
    conditions:
      severe: {evidence.artifact.cvss >= 9.0}
      high: {evidence.artifact.cvss >= 7.0}
      epss_notable: {evidence.artifact.epss >= 0.1}
    severity_if:
      - "severe -> critical"
      - "high -> high"
    default_severity: medium
    confidence:
      - "high and epss_notable -> 0.9"
      - "high -> 0.8"
    default_confidence: 0.7
    cwe: CWE-1035
    remediation: remediation-catalog/patch-management.yaml
    narrative: net.vulnerable-component-version
    tags: [cve, patch]

  # ----------------------------------------------------------------- M3 · Web application
  # One rule per check family (S6), keyed on the machine-readable ``artifact`` payload the
  # check attaches beside the request/response evidence — so a rule reads an oracle's verdict
  # as a *fact* (``evidence.artifact.technique == "error-based"``) rather than re-deriving the
  # comparison from a body. Rules are ranked most-specific-first and the first whose
  # ``severity_if`` fires decides, which is why two rules may share a ``check_ref`` (the CORS
  # pair gates on ``reflected`` vs ``wildcard``).
  #
  # Severities follow the research's own framing: a confirmed injection whose response
  # *reproduced* is high; a structural observation with no payload (headers, CSRF token
  # absence, a hidden endpoint's existence) is low-to-medium because it is one control, not an
  # exploit.
  - id: web.injection-confirmed
    title: "SQL injection confirmed by a differential response"
    check_ref: ["m3.sqli-oracle", "research:ch03#1"]
    conditions:
      error_based: {evidence.artifact.technique == "error-based"}
      boolean_based: {evidence.artifact.technique == "boolean-based"}
      time_based: {evidence.artifact.technique == "time-based"}
      db_family_known: {evidence.artifact.db_family present}
    severity_if:
      - "error_based and db_family_known -> high"
      - "error_based -> high"
      - "boolean_based -> medium"
      - "time_based -> medium"
    confidence:
      - "error_based -> 0.85"
      - "time_based -> 0.7"
      - "boolean_based -> 0.6"
    cwe: CWE-89
    remediation: remediation-catalog/injection.yaml
    narrative: web.injection-confirmed
    tags: [injection, sqli]

  - id: web.xss-reflected
    title: "Reflected input reaches unencoded output"
    check_ref: ["m3.xss-oracle", "research:ch03#3"]
    conditions:
      html_context: {evidence.artifact.context == "html"}
      attribute_context: {evidence.artifact.context == "attribute"}
      script_context: {evidence.artifact.context == "script"}
    severity_if:
      - "html_context -> high"
      - "attribute_context -> medium"
      - "script_context -> medium"
    confidence:
      - "html_context -> 0.8"
      - "attribute_context -> 0.6"
      - "script_context -> 0.5"
    cwe: CWE-79
    remediation: remediation-catalog/output-encoding.yaml
    narrative: web.xss-reflected
    tags: [xss, injection]

  - id: web.csrf-missing-token
    title: "State-changing endpoint without an anti-CSRF control"
    check_ref: ["m3.csrf-audit", "research:ch03#4"]
    conditions:
      via_get: {evidence.artifact.reachable_via_get}
      no_token: {evidence.artifact.csrf_fields missing}
    severity_if:
      - "via_get -> medium"
      - "no_token -> medium"
    confidence:
      - "via_get -> 0.6"
      - "no_token -> 0.65"
    cwe: CWE-352
    remediation: remediation-catalog/csrf-tokens.yaml
    narrative: web.csrf-missing-token
    tags: [csrf]

  - id: web.upload-accepted
    title: "Upload validation accepts an executable extension"
    check_ref: ["m3.upload-audit", "research:ch03#10"]
    conditions:
      accepted: {evidence.artifact.verdict == "accepted"}
      bypassed_validator: {evidence.artifact.control_verdict == "rejected"}
    severity_if:
      - "accepted and bypassed_validator -> high"
      - "accepted -> high"
    confidence:
      - "accepted and bypassed_validator -> 0.85"
      - "accepted -> 0.8"
    cwe: CWE-434
    remediation: remediation-catalog/unrestricted-upload.yaml
    narrative: web.upload-accepted
    tags: [upload]

  - id: web.traversal-content-marker
    title: "Path traversal reads outside the web root"
    check_ref: ["m3.traversal-oracle", "research:ch03#11"]
    conditions:
      marker_file_known: {evidence.artifact.marker_file}
      posix_encoding: {evidence.artifact.encoding == "plain"}
    severity_if:
      - "marker_file_known -> high"
    confidence:
      - "marker_file_known and posix_encoding -> 0.85"
      - "marker_file_known -> 0.8"
    cwe: CWE-22
    remediation: remediation-catalog/path-traversal.yaml
    narrative: web.traversal-content-marker
    tags: [traversal, file]

  - id: web.open-redirect
    title: "Redirect target reflects an arbitrary host"
    check_ref: ["m3.open-redirect", "research:ch03#14"]
    severity_if:
      - "evidence.artifact.signal == 'open-redirect' -> medium"
    confidence:
      - "evidence.artifact.probe_host_reserved -> 0.85"
    default_confidence: 0.7
    cwe: CWE-601
    remediation: remediation-catalog/open-redirect.yaml
    narrative: web.open-redirect
    tags: [redirect]

  - id: web.idor-object-access
    title: "Object reference exposes other records"
    check_ref: ["m3.idor-oracle", "research:ch03#18"]
    conditions:
      cross_account: {evidence.artifact.second_identity}
      unauthenticated: "evidence.artifact.authenticated == false"
    severity_if:
      - "cross_account -> high"
      - "unauthenticated -> high"
      - "evidence.artifact.signal == 'idor' -> medium"
    confidence:
      - "cross_account -> 0.8"
      - "unauthenticated -> 0.7"
    default_confidence: 0.65
    cwe: CWE-639
    remediation: remediation-catalog/object-level-authorization.yaml
    narrative: web.idor-object-access
    tags: [idor, authorization]

  - id: web.session-cookie-weak
    title: "Session cookie is missing hardening attributes"
    check_ref: ["m3.auth-session-audit"]
    conditions:
      cookie_signal: {evidence.artifact.signal == "session-cookie-hardening"}
      plaintext: {evidence.artifact.protocol == "http"}
    severity_if:
      - "cookie_signal and plaintext -> medium"
      - "cookie_signal -> medium"
    confidence:
      - "cookie_signal -> 0.8"
    cwe: CWE-614
    remediation: remediation-catalog/cookie-flags.yaml
    narrative: web.cookie-weak-flags
    tags: [cookies, session]

  - id: web.insecure-login-transport
    title: "Credentials are submitted over plaintext HTTP"
    check_ref: ["m3.auth-session-audit"]
    severity_if:
      - "evidence.artifact.signal == 'insecure-login-transport' -> high"
    confidence:
      - "evidence.artifact.signal == 'insecure-login-transport' -> 0.8"
    cwe: CWE-319
    remediation: remediation-catalog/transport-encryption.yaml
    narrative: web.insecure-login-transport
    tags: [authentication, transport]

  - id: web.user-enumeration
    title: "Login response distinguishes a known user name"
    check_ref: ["m3.auth-session-audit"]
    severity_if:
      - "evidence.artifact.signal == 'user-enumeration' -> medium"
    confidence:
      - "evidence.artifact.signal == 'user-enumeration' -> 0.65"
    cwe: CWE-200
    remediation: remediation-catalog/user-enumeration.yaml
    narrative: web.user-enumeration
    tags: [authentication, enumeration]

  - id: web.cors-origin-reflection
    title: "CORS reflects an arbitrary origin"
    check_ref: ["m3.cors-audit", "research:ch03#23"]
    conditions:
      reflected: {evidence.artifact.reflected}
      with_credentials: {evidence.artifact.allows_auth}
      null_origin: {evidence.artifact.null_origin}
    severity_if:
      - "reflected and with_credentials -> high"
      - "reflected -> medium"
      - "null_origin -> medium"
    confidence:
      - "reflected and with_credentials -> 0.85"
      - "reflected -> 0.7"
    default_confidence: 0.7
    cwe: CWE-942
    remediation: remediation-catalog/cors-policy.yaml
    narrative: web.cors-wildcard-credentials
    tags: [cors, headers]

  - id: web.cors-wildcard-credentials
    title: "CORS wildcard is combined with credentials"
    check_ref: ["m3.cors-audit"]
    conditions:
      wildcard: {evidence.artifact.wildcard}
      with_credentials: {evidence.artifact.allows_auth}
    severity_if:
      - "wildcard and with_credentials -> high"
      - "wildcard -> medium"
    confidence:
      - "wildcard and with_credentials -> 0.85"
      - "wildcard -> 0.6"
    cwe: CWE-942
    remediation: remediation-catalog/cors-policy.yaml
    narrative: web.cors-wildcard-credentials
    tags: [cors, headers]

  - id: web.missing-security-headers
    title: "Security response headers are missing"
    check_ref: ["m3.security-headers", "m4.security-header-review"]
    conditions:
      no_csp: {evidence.artifact.missing contains "content-security-policy"}
      no_hsts: {evidence.artifact.missing contains "strict-transport-security"}
      no_frame_options: {evidence.artifact.missing contains "x-frame-options"}
      no_nosniff: {evidence.artifact.missing contains "x-content-type-options"}
    severity_if:
      - "no_hsts and no_csp -> medium"
      - "no_csp -> medium"
      - "no_frame_options and no_nosniff -> low"
    default_severity: low
    confidence:
      - "no_hsts and no_csp -> 0.8"
    default_confidence: 0.7
    cwe: CWE-693
    remediation: remediation-catalog/security-headers.yaml
    narrative: web.missing-security-headers
    tags: [headers, hardening]

  - id: web.cookie-weak-flags
    title: "Session cookie lacks security attributes"
    check_ref: ["m3.security-headers", "m3.auth-session-audit"]
    conditions:
      cookie_signal: {evidence.artifact.signal == "weak-cookie-flags"}
      insecure: {evidence.artifact.insecure_flags}
    severity_if:
      - "cookie_signal and insecure -> medium"
      - "insecure -> medium"
    confidence:
      - "insecure -> 0.8"
    cwe: CWE-614
    remediation: remediation-catalog/cookie-flags.yaml
