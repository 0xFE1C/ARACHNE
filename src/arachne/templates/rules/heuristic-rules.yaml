# ARACHNE heuristic rule corpus (docs/spec/04- §2.1, F-05-01).
#
# Managed data, not code (F-09-04): point ARACHNE_ANALYSIS_RULES at another file to replace
# it. A rule is evaluated by the restricted condition language in
# `arachne/analyzer/conditions.py` — no code execution, ever (F-08-06).
#
# Structure
#   check_ref   which candidates the rule applies to: `m2.smb-enum` (check id), `M2#smb-enum`
#               (module#check), `M2` (a whole module), `ch02#16` / `research:ch02#16` (corpus
#               method), `*` (any). Globs are allowed in the check-name part.
#   conditions  named booleans over the fact space (see `analyzer/conditions.py`); the body
#               is an expression string, or the spec's single-key mapping shorthand
#               (`{path matches "re"}`) where that is still valid YAML
#   severity_if / confidence   ordered `<condition> -> <value>` clauses; first match wins
#   default_severity          used when no severity clause fires (turns the rule into a floor)
#
# Rules are ranked by specificity, so a precise check-id rule always beats a module baseline.
# Facts available: check.*, asset.*, finding.*, analysis.*, evidence.<kind>.<path>,
# signature.*, derived.*, plus the aliases http_status, verification_count, reproducible,
# asset_kind, asset_value, research_ref, cwe, cve, title, confidence, severity_hint.

version: "1.0"

rules:
  # ----------------------------------------------------------------- M1 · Recon
  - id: recon.client-side-secret-exposure
    title: "Credential material in client-side assets"
    check_ref: ["m1.js-asset-scan", "research:ch01#24"]
    conditions:
      secret_kinds_found: {evidence.artifact.matched_patterns}
      fetched_many_scripts: {evidence.artifact.scripts_analysed >= 3}
    severity_if:
      - "secret_kinds_found and fetched_many_scripts -> high"
      - "secret_kinds_found -> medium"
    confidence:
      - "secret_kinds_found and fetched_many_scripts -> 0.8"
      - "secret_kinds_found -> 0.65"
    cwe: CWE-798
    remediation: remediation-catalog/client-side-secret-exposure.yaml
    narrative: recon.client-side-secret-exposure
    tags: [secrets, client-side]

  - id: recon.indexed-source-secrets
    title: "Credentials indexed in public code search"
    check_ref: ["m1.code-secret-mining", "research:ch01#2"]
    severity_if:
      - "evidence.artifact.matches >= 5 -> high"
      - "evidence.artifact.matches -> medium"
    confidence:
      - "evidence.artifact.matches >= 5 -> 0.75"
      - "evidence.artifact.matches -> 0.6"
    cwe: CWE-540
    remediation: remediation-catalog/source-code-secret-exposure.yaml
    narrative: recon.indexed-source-secrets
    tags: [secrets, osint]

  - id: recon.known-vulnerable-address
    title: "Third-party index reports known vulnerabilities"
    check_ref: ["m1.internetdb-triage", "research:ch01#5"]
    severity_if:
      - "evidence.artifact.vulns -> medium"
    confidence:
      - "evidence.artifact.vulns -> 0.6"
    cwe: CWE-1035
    remediation: remediation-catalog/patch-management.yaml
    narrative: recon.known-vulnerable-address
    tags: [cve, passive]

  - id: recon.exposed-document-in-index
    title: "Search index exposes a sensitive document"
    check_ref: ["m1.dork-sweep", "research:ch01#1"]
    severity_if:
      - "evidence.artifact.results -> low"
    cwe: CWE-200
    remediation: remediation-catalog/sensitive-document-exposure.yaml
    narrative: recon.exposed-document-in-index
    tags: [osint, exposure]

  - id: recon.archived-sensitive-path
    title: "Archived URLs match sensitive path patterns"
    check_ref: ["m1.webarchive-harvest", "research:ch01#12-13"]
    conditions:
      matched_paths: {evidence.artifact.matches}
    severity_if:
      - "matched_paths -> low"
    cwe: CWE-200
    remediation: remediation-catalog/sensitive-path-exposure.yaml
    narrative: recon.archived-sensitive-path
    tags: [osint, exposure]

  - id: recon.email-pattern-inferable
    title: "Employee address pattern is publicly inferable"
    check_ref: ["m1.email-harvest", "research:ch01#15"]
    severity_if:
      - "evidence.artifact.pattern -> low"
    default_severity: info
    cwe: CWE-200
    remediation: remediation-catalog/email-pattern-exposure.yaml
    narrative: recon.email-pattern-inferable
    tags: [osint]

  # ----------------------------------------------------------------- M2 · Data stores
  - id: net.unauthenticated-datastore
    title: "Datastore accepts unauthenticated access"
    check_ref: ["m2.db-service-probe", "research:ch02#22-23"]
    conditions:
      no_authentication:
        {title matches "unauthenticated|without any authentication|without authentication"}
      version_named: {evidence.note.service.identity.version}
    severity_if:
      - "no_authentication and version_named -> critical"
      - "no_authentication -> high"
    confidence:
      - "no_authentication and version_named -> 0.95"
      - "no_authentication -> 0.85"
    cwe: CWE-306
    remediation: remediation-catalog/unauthenticated-datastore.yaml
    narrative: net.unauthenticated-datastore
    tags: [database, authentication]

  - id: net.exposed-database-port
    title: "Database service reachable from the scanning position"
    check_ref: ["m2.db-service-probe", "research:ch02#22"]
    conditions:
      unauth_attempted: {title matches "unauthenticated|without authentication"}
      no_tls: {title matches "without encryption|refused TLS"}
    severity_if:
      - "no_tls -> medium"
      - "not unauth_attempted -> medium"
    confidence:
      - "no_tls -> 0.75"
      - "not unauth_attempted -> 0.7"
    cwe: CWE-284
    remediation: remediation-catalog/exposed-database-service.yaml
    narrative: net.exposed-database-port
    tags: [database, exposure]

  # ----------------------------------------------------------------- M2 · File & directory services
