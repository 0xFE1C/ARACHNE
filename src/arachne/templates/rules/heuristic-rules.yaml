  - id: net.ics-device-unauthenticated
    title: "Industrial control device is reachable and unauthenticated"
    check_ref: ["m2.ics-probe", "research:ch02#27"]
    severity_if:
      - "evidence.note.service.probes >= 1 -> critical"
    default_severity: high
    default_confidence: 0.9
    cwe: CWE-306
    remediation: remediation-catalog/ics-exposure.yaml
    narrative: net.ics-device-unauthenticated
