  - id: net.smtp-recipient-disclosure
    title: "SMTP server discloses mailbox existence"
    check_ref: ["m2.smtp-enum", "research:ch02#20"]
    conditions:
      recipients_confirmed: {title matches "confirmed recipient"}
      verbs_enabled: {title matches "enumeration is enabled"}
    severity_if:
      - "recipients_confirmed -> medium"
      - "verbs_enabled -> low"
    confidence:
      - "recipients_confirmed -> 0.8"
      - "verbs_enabled -> 0.7"
    cwe: CWE-200
    remediation: remediation-catalog/smtp-user-enumeration.yaml
    narrative: net.smtp-recipient-disclosure
