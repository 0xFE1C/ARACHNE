  # ----------------------------------------------------------------- signature bridge
  # A rule may key on a *template* match instead of a byte pattern of its own, which is how
  # the imported nuclei corpus participates in the heuristic decisions (docs/spec/04- §2.2):
  # the signature engine says "this response is an exposed .env", and the rule says how bad
  # that is and what to do about it.
  - id: exposure.matched-signature
    title: "Known exposure signature matched"
    check_ref: ["*"]
    conditions:
      env_file_signature: {signature.matched contains "exposed-env-file"}
      git_metadata_signature: {signature.matched contains "exposed-git-config"}
      debug_page_signature: {signature.matched contains "phpinfo-disclosure"}
    severity_if:
      - "env_file_signature or git_metadata_signature -> high"
      - "debug_page_signature -> medium"
    confidence:
      - "env_file_signature -> 0.9"
      - "git_metadata_signature -> 0.88"
      - "debug_page_signature -> 0.8"
    cwe: CWE-200
    remediation: remediation-catalog/source-disclosure.yaml
    narrative: exposure.matched-signature
    tags: [signature, template]

