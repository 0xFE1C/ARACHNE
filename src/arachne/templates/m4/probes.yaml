        family: dotenv-vault
        markers: ["DOTENV_VAULT", "DOTENV_KEY"]
      - path: "/secrets.env"
        family: dotenv
        markers: ["AWS_ACCESS_KEY_ID=", "DB_PASSWORD=", "SECRET_KEY="]
