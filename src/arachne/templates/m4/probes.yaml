      - path: "/compose.yaml"
        family: compose
        markers: ["services:", "image:", "container_name:"]
      - path: "/docker-compose.prod.yml"
        family: compose
        markers: ["services:", "image:", "container_name:"]
      - path: "/docker-compose.override.yml"
        family: compose
        markers: ["services:", "image:", "container_name:"]
    container_dockerfile:
      - path: "/Dockerfile"
        family: dockerfile
        markers: ["FROM ", "RUN ", "WORKDIR "]
      - path: "/Dockerfile.prod"
        family: dockerfile
        markers: ["FROM ", "RUN ", "WORKDIR "]
      - path: "/docker/Dockerfile"
        family: dockerfile
        markers: ["FROM ", "RUN ", "WORKDIR "]
      - path: "/build/Dockerfile"
        family: dockerfile
        markers: ["FROM ", "RUN ", "WORKDIR "]
      - path: "/Dockerfile.dev"
        family: dockerfile
        markers: ["FROM ", "RUN ", "WORKDIR "]
    orchestration_manifest:
      - path: "/k8s/deployment.yaml"
        family: kubernetes
        markers: ["apiVersion:", "kind: Deployment", "spec:"]
      - path: "/kubernetes/deployment.yaml"
        family: kubernetes
        markers: ["apiVersion:", "kind: Deployment", "spec:"]
      - path: "/manifests/deployment.yml"
        family: kubernetes
        markers: ["apiVersion:", "kind: Deployment", "spec:"]
      - path: "/deployment.yaml"
        family: kubernetes
        markers: ["apiVersion:", "kind: Deployment", "spec:"]
      - path: "/helm/values.yaml"
        family: helm
        markers: ["image:", "replicaCount:", "resources:"]
      - path: "/chart/values.yaml"
        family: helm
        markers: ["image:", "replicaCount:", "resources:"]
      - path: "/k8s/secret.yaml"
