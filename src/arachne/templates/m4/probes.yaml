      - path: "/gcp-service-account.json"
        family: service-account
        markers: ["\"type\": \"service_account\"", "private_key_id", "client_email"]
      - path: "/firebase-adminsdk.json"
        family: service-account
        markers: ["\"type\": \"service_account\"", "private_key_id", "client_email"]
      - path: "/serviceAccountKey.json"
        family: service-account
        markers: ["\"type\": \"service_account\"", "private_key_id", "client_email"]
      - path: "/credentials.json"
        family: service-account
