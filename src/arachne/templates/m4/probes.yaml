    # ------------------------------------------------------------ editor residue
    editor_swap:
      - path: "/.index.php.swp"
        family: vim
        markers: ["b0VIM"]
      - path: "/.env.swp"
        family: vim
        markers: ["b0VIM"]
      - path: "/.config.php.swp"
        family: vim
        markers: ["b0VIM"]
      - path: "/.index.php.swo"
        family: vim
        markers: ["b0VIM"]
      - path: "/.app.py.un~"
        family: vim
        markers: ["b0VIM"]
      # Emacs's autosave and lock names contain ``#``, which is a URL *fragment* delimiter, so
      # the octet must be percent-encoded or the request goes to ``/`` with a fragment and the
      # artefact is never asked for. The encodings below are the file names as a URL.
      - path: "/%23index.php%23"
        family: emacs
        markers: ["<?php", "autosave"]
      - path: "/.%23index.php"
        family: emacs
        markers: ["<?php", "automatically generated"]
    editor_backup_residue:
      - path: "/.env~"
        family: dotenv
        markers: ["DB_PASSWORD=", "SECRET_KEY="]
      - path: "/index.php~"
        family: source
        markers: ["<?php"]
      - path: "/wp-config.php~"
        family: source
        markers: ["DB_NAME", "<?php"]
      - path: "/app.py~"
        family: source
        markers: ["import ", "def "]
    editor_os_metadata:
      - path: "/.DS_Store"
        family: macos
        markers: ["Bud1"]
      - path: "/Thumbs.db"
        family: windows
        markers: []
      - path: "/desktop.ini"
        family: windows
        markers: ["[.ShellClassInfo]"]
      - path: "/.directory"
        family: freedesktop
        markers: ["[Desktop Entry]"]

    # ------------------------------------------------------------ credential & authorization
    credential_package_manager:
      - path: "/.npmrc"
        family: npm
        markers: ["_authtoken", "//registry", "always-auth"]
      - path: "/.yarnrc.yml"
        family: yarn
        markers: ["npmRegistries", "npmAuthToken"]
      - path: "/.pypirc"
        family: pypi
        markers: ["[distutils]", "[pypi]", "repository"]
      - path: "/.gem/credentials"
        family: rubygems
        markers: [":rubygems_api_key:"]
      - path: "/.m2/settings.xml"
        family: maven
        markers: ["<settings", "<servers>", "<password>"]
      - path: "/.nuget/NuGet.Config"
        family: nuget
        markers: ["<configuration>", "<packageSources>"]
      - path: "/.config/pip/pip.conf"
        family: pip
        markers: ["index-url", "extra-index-url"]
    credential_registry_auth:
      - path: "/.docker/config.json"
        family: docker
        markers: ["\"auths\"", "\"auth\"", "\"identitytoken\""]
      - path: "/.dockercfg"
        family: docker
        markers: ["\"auth\"", "\"email\""]
      - path: "/.docker/config.json.prod"
        family: docker
        markers: ["\"auths\"", "\"auth\""]
    credential_authorization:
      - path: "/.htaccess"
        family: htaccess
        markers: ["<FilesMatch", "AuthType Basic", "Require "]
      - path: "/.ssh/authorized_keys"
        family: ssh
        markers: ["ssh-rsa AAAA", "ssh-ed25519 AAAA", "ecdsa-sha2-"]
      - path: "/authorized_keys"
        family: ssh
        markers: ["ssh-rsa AAAA", "ssh-ed25519 AAAA", "ecdsa-sha2-"]
      - path: "/.ssh/config"
        family: ssh
        markers: ["Host ", "IdentityFile", "ProxyCommand"]

    # ------------------------------------------------------------ environment variants
    env_variant:
      - path: "/.env.staging"
        family: dotenv
        markers: ["DB_PASSWORD=", "DB_HOST=", "SECRET_KEY="]
      - path: "/.env.prod"
        family: dotenv
        markers: ["DB_PASSWORD=", "DB_HOST=", "SECRET_KEY="]
      - path: "/.env.dev"
        family: dotenv
        markers: ["DB_PASSWORD=", "DB_HOST=", "SECRET_KEY="]
      - path: "/.env.test"
        family: dotenv
        markers: ["DB_PASSWORD=", "DB_HOST=", "SECRET_KEY="]
      - path: "/.env.qa"
        family: dotenv
        markers: ["DB_PASSWORD=", "DB_HOST=", "SECRET_KEY="]
      - path: "/.env.ci"
        family: dotenv
