  - product: policykit
    aliases: ["polkit", "pkexec", "polkitd"]
    affected: [all]
    cve: CVE-2021-4034
    cvss: 7.8
    epss: 0.89
    cwe: CWE-787
    title: "PwnKit — pkexec local privilege escalation"
    impact: >-
      pkexec mishandles the argument vector, letting any local user execute code as root
      through an out-of-bounds write. Present in every polkit version shipped since 2009.
    remediation: Update polkit to a patched release, or remove the setuid bit from pkexec.
    references: [https://nvd.nist.gov/vuln/detail/CVE-2021-4034]
