    title: "Dirty Pipe — pipe-buffer overwrite of read-only files"
    impact: >-
      An unprivileged user can overwrite page-cache data in read-only files, escalating to
      root by modifying a setuid binary or /etc/passwd.
    remediation: Upgrade the kernel to 5.16.11 / 5.15.25 / 5.10.102 or later.
    references: [https://nvd.nist.gov/vuln/detail/CVE-2022-0847]
