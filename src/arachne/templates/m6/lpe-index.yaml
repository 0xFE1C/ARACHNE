# ARACHNE M6 offline local-privilege-escalation index — managed data (ch06#16, F-09-04).
#
# The offline half of "version-based local privilege-escalation matching" :
# m6.lpe-discovery matches the OS/service versions M6 learned (from the M2 fingerprint
# inventory, the web crawl's Server banner, or an operator-supplied asset export) against this
# table, so a scan reports real privesc CVEs with no network access.
#
# Same fields as the M2 CVE index (modules/m2/catalog.py CveEntry), so the two snapshots read
# the same way and refreshing this file is a data update, not a code change:
#   product     canonical product name (matched case-insensitively against a fingerprint)
#   aliases     other names a banner/export may use for the same product
#   affected    version constraints; a version matches when *every* constraint holds
#               (operators: <, <=, >, >=, ==, or the shorthand `all`)
#   cve/cvss/epss/cwe/title/impact/remediation/references
#
# Snapshot provenance: Linux kernel + common SUID-tool privesc advisories, curated to the
# products ARACHNE can fingerprint. Refreshing it is a data update.
index_version: "2026.10"
generated_at: "2026-10-20T00:00:00Z"
