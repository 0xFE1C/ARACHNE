title: AS-REP Roasting — pre-auth disabled account ticket (4768)
id: 8f2c1a10-0e11-4a2b-9c33-6b0e5d7a1002
status: stable
description: >-
  A Kerberos authentication-ticket request (4768) with pre-authentication not required — an
  account with "Do not require Kerberos preauthentication" set, whose AS-REP an attacker can
  request and crack offline (research ch06#18, ATT&CK T1558.004).
references:
  - https://attack.mitre.org/techniques/T1558/004/
tags: [attack.credential_access, attack.t1558.004]
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    PreAuthType: 0
  condition: selection
level: high
falsepositives:
  - Accounts intentionally configured without pre-authentication (rare, should be justified)
