    description: Ships a Sigma rule set for post-exploitation discovery activity — Kerberoasting (4769), AS-REP roasting (4768), LSASS access, web-worker-to-shell, lateral movement over admin shares and scheduled-task persistence — so findings stay SIEM-queryable, and, only when an explicit log-access grant is present, runs the rules over exported JSON-lines telemetry (research ch06#23). Without the grant it ingests nothing.
