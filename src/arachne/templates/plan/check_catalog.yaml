    - cloud
    - url
    estimated_requests: 0
  - module: M6
    name: cve-epss-correlation
    version: '1.0'
    title: CVE/EPSS correlation and patch-gap analysis
    description: 'Correlates the estate''s fingerprinted products and versions with the offline CVE index, then ranks each hit by FIRST EPSS exploit likelihood and CISA KEV status to produce a patch-gap view (research ch06#7). Offline-first: the shipped EPSS snapshot is used unless ARACHNE_M6_EPSS_FEED / ARACHNE_M6_KEV_FEED point at a refreshed feed. Zero requests.'
    research_ref: ch06#7
    proof: L1
    cwe: CWE-1035
    target_kinds:
