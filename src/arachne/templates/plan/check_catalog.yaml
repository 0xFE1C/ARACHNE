    version: "1.0"
    title: FTP anonymous access
    description: "Reads the FTP banner, then attempts a read-only anonymous login (USER anonymous / PASS anonymous@): a 230 response is anonymous access. Also reports a cleartext FTP banner (vsftpd, ProFTPD, FileZilla, Microsoft FTP). Nothing is uploaded, downloaded or deleted."
    research_ref: ch02#21
    proof: L1
    cwe: CWE-287
    target_kinds: [ip, cidr]
    estimated_requests: 4
    requires_active_checks: true

  - module: M2
    name: ssdp-discovery
    version: "1.0"
    title: SSDP/UPnP discovery
    description: Sends an SSDP M-SEARCH over UDP 1900 and parses the 200 OK / NOTIFY answers for the UPnP SERVER header and the LOCATION device-description URL. UDP probing requires ARACHNE_NET_ALLOW_UDP in addition to this check's active-check opt-in.
    research_ref: ch02#26
    proof: L1
    cwe: CWE-200
    target_kinds: [ip, cidr]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: legacy-services
    version: "1.0"
    title: Legacy network services
    description: "Detects legacy services left enabled with their defaults: a Telnet service (recognised by its IAC negotiation bytes) and the cleartext legacy protocols rlogin (513) and finger (79). When UDP is enabled it also sends a single read-only TFTP RRQ (69) for a small path. Any reachable service is a cleartext-management exposure."
    research_ref: ch04#22
    proof: L1
    cwe: CWE-521
    target_kinds: [ip, cidr]
    estimated_requests: 4
    requires_active_checks: true

  - module: M3
    name: nosql-oracle
    version: "1.0"
    title: NoSQL injection oracle
    description: "Injects MongoDB-style operator payloads (a bare quote, a JSON predicate such as {\"$ne\": null}, and the [$ne]/[$gt]/[$regex] parameter-name suffixes) into query parameters and confirms the family by a response differential against the benign baseline that is not merely the probe being echoed. Read-only: it only makes a back-end predicate true or false, and never extracts or modifies data."
    research_ref: ch03#2
    proof: L1
    cwe: CWE-943
    target_kinds: [url]
    estimated_requests: 10
    requires_active_checks: true

  - module: M3
    name: directory-traversal
    version: "1.0"
    title: Directory traversal oracle
    description: "Walks the traversal encoding matrix (plain, URL-encoded, dot-encoded, overlong separators, backslash, and the absolute file:// wrapper) against file-name parameters, and confirms the class by content: a world-readable, non-secret file's header line (root:x:0:0: / [extensions]) appears in the probe response where the benign baseline had none. Read-only: it reads one harmless system file."
    research_ref: ch03#12
    proof: L1
    cwe: CWE-22
    target_kinds: [url]
    estimated_requests: 10
    requires_active_checks: true

  - module: M3
    name: file-inclusion
    version: "1.0"
    title: File inclusion oracle
    description: "Confirms local file inclusion when a world-readable file's header line, or the base64 of a PHP opening tag from a php://filter read, appears in the probe response. The remote-file-inclusion probe only *references* an unresolvable .invalid host and is reported only on a clear in-response include side effect (a wrapper/allow_url_include diagnostic). The payload is never fetched and no remote code is executed."
    research_ref: ch03#13
    proof: L1
    cwe: CWE-98
    target_kinds: [url]
    estimated_requests: 10
    requires_active_checks: true

  - module: M3
    name: crlf-injection
