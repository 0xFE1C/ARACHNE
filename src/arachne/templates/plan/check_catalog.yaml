    name: cacheable-session-response
    version: '1.0'
    title: Response establishing a session is cacheable by a shared cache
    description: 'Reads the structural cookie projection of every crawled page and reports a response that establishes session state (it sets a session-like cookie) while its own Cache-Control *tells a shared cache to store it* — a public, max-age or s-maxage directive, or an Expires date, with no no-store/no-cache/private beside it. That combination is what lets a cache in front of the application hand one caller''s session page to the next. A response that merely omits Cache-Control is deliberately **not** reported: absent headers are the common case on any dynamic page, and the first draft of this check measured a 42 % false-positive rate on the shared M4 lab for exactly that reason (see the WP-30 handoff). The cookie''s *name* is read; its value was dropped at capture and never reaches the check. This is the caching default of a server family, distinct from m4.cookie-flag-audit, which reports the missing Secure/HttpOnly/SameSite attributes on the cookie itself. No new request is made. Read-only.'
