    description: 'Attempts the WebSocket upgrade handshake against the endpoints the crawl found, with a reserved attacker Origin, and reports an accepted handshake — the cross-site WebSocket hijacking precondition of research ch03#33. Read-only: the handshake is attempted (a GET with the upgrade headers) and abandoned at once; no frame is sent and no message is injected.'
    research_ref: ch03#33
    proof: L1
    cwe: CWE-1385
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  - module: M3
    name: business-logic-audit
    version: '1.0'
    title: Business-logic invariant audit
    description: 'Sends the edge values of research ch03#30 (a negative, zero or huge quantity / a client-supplied price) at the fields that drive a workflow, and reports one the application accepted where its own constraints should have refused it (a success response for a value the flow cannot honour). Detection-only: no order is created and no state is modified.'
    research_ref: ch03#30
    proof: L1
    cwe: CWE-840
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: race-oracle
    version: '1.0'
    title: Race condition (concurrent-request) oracle
    description: 'Replays a strictly bounded burst of near-simultaneous identical requests at a single-use action (redeem/coupon/claim/transfer, by path hint) and reports a double-apply: more successful responses than the limit should permit (research ch03#29). The burst size comes from ARACHNE_WEB_RACE_CONCURRENCY; the probe never performs a financial or destructive operation (GET, or a POST the crawl already found).'
    research_ref: ch03#29
    proof: L1
    cwe: CWE-362
    target_kinds:
    - url
    estimated_requests: 16
    requires_active_checks: true
  - module: M3
    name: smuggling-oracle
    version: '1.0'
    title: HTTP request smuggling (framing boundary) audit
    description: 'Reads the HTTP framing boundary of the probed endpoints: a response that carries both a proxy ``Via`` and a distinct origin ``Server`` (or an X-Backend-Server hop) sits behind the two-parser topology a CL.TE/TE.CL desync requires, and is reported as a framing-boundary risk for manual validation (research ch03#16). The check does not emit invalid framing (the shared client refuses it) and never smuggles a hostile request; it confirms surface, not exploitation.'
    research_ref: ch03#16
    proof: L1
    cwe: CWE-444
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: rate-limit-audit
    version: '1.0'
    title: Rate limiting and anti-automation audit
    description: 'Issues a small, fixed number of identical requests to the endpoints whose anti-automation posture matters (login, password reset, registration) and reads whether any throttling appears (429, lockout, CAPTCHA), then repeats with a rotating client-supplied forwarded-for header to test whether the control is keyed on a spoofable value. Strictly bounded: it characterizes controls and never mounts a brute-force (ARACHNE_WEB_RATE_PROBES controls the volume).'
    research_ref: ch03#35
    proof: L1
    cwe: CWE-770
    target_kinds:
    - url
    estimated_requests: 12
    requires_active_checks: true
  - module: M3
    name: upload-audit
    version: '1.0'
    title: Unrestricted file upload audit
    description: Walks the upload-validation matrix (executable extension with a mismatched content type, then polyglot-style pairs) against every multipart form the crawl found, using a single inert plain-text marker with no executable content, and reads it back to confirm whether the endpoint stored it. Requires ARACHNE_WEB_UPLOAD_PROBE=true, because storing even an inert marker is a write to the target; with the knob off the check reports itself skipped and sends nothing.
    research_ref: ch03#10
    proof: L1
    cwe: CWE-434
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  - module: M3
