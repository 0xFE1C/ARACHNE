    version: '1.0'
    title: GraphQL depth and cost limit audit
    description: 'Sends two bounded amplification probes at the GraphQL endpoints the crawl found: a selection nested to a configured (modest) depth along a real cycle in the introspected type graph, and one operation carrying a configured number of aliases. A server with a depth or cost limit refuses them; a response carrying data means the limit is absent. Every probe selects only the introspection meta-field __typename, so no document content is requested; no mutation is sent.'
