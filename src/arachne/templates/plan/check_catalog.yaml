  # ------------------------------------------------------------------ S18 (area INTEL)
  # Three checks that consume a third-party index's view of the target. Every one is opt-in
  # twice: its provider is not in DEFAULT_OSINT_PROVIDERS, so it must be named in
  # ARACHNE_OSINT_PROVIDERS (and its key set), and the check itself must be selected
  # (REQ-INTEL-003/004/005). All three are passive — they read somebody else's index and never
  # touch the target — and all three degrade to a skipped result, never an error, when their
  # provider is unavailable.
  - module: M1
    name: service-exposure-drift
    version: "1.0"
    title: Exposed-service drift against Shodan/Censys
    description: >-
      Compares the open services a third-party scanner observed on an address with the
      services this scan found, and reports the difference. When the scan's own inventory is
      not available (M1 runs before discovery), it reports the one-way signal that is still
      true: services the provider sees that this scan's port catalogue will never look at.
      Opt-in: it spends the deployment's Shodan and/or Censys key.
    research_ref: ch01#3-4
    proof: L1
    cwe: CWE-668
    target_kinds: [ip, cidr]
    estimated_requests: 16
  - module: M1
    name: ct-surprise
    version: "1.0"
    title: Certificate-transparency and registration surprises
    description: >-
      Reads a second certificate-transparency view (Cert Spotter, falling back to crt.sh),
      flags certificates issued inside a two-week surprise window, and reports names the
      scan's scope does not cover. RDAP registration facts (registrar, created, expiry,
      nameservers) are attached as context. Opt-in: it asks third-party registries about the
      domain.
    research_ref: ch01#8-9
    proof: L1
    cwe: CWE-200
    target_kinds: [domain, domain_pattern]
    estimated_requests: 3
  - module: M1
    name: breach-exposure
    version: "1.0"
    title: Breach exposure summary (HIBP)
    description: >-
      Asks Have I Been Pwned which breaches exposed accounts registered at the target's
      domain, and summarises the dates, volumes and data classes. Exposure of the domain's
      users, not a vulnerability in the target. Opt-in: needs an HIBP API key and the provider
      named in ARACHNE_OSINT_PROVIDERS.
    research_ref: ch01#18
    proof: L1
    cwe: CWE-522
    target_kinds: [domain, domain_pattern]
    estimated_requests: 1

  - module: M2
    name: http-fingerprint
    version: "1.0"
    title: HTTP(S) fingerprinting
    description: Reads one HTTP(S) response and names the server stack from its Server, X-Powered-By, X-AspNet-Version and X-Generator headers, its framework session cookies (JSESSIONID, PHPSESSID, ASP.NET_SessionId, XSRF-TOKEN, csrftoken, _session_id) and the HTML <title>/generator meta. A banner that discloses a product version is raised as a low-confidence candidate for the CVE correlation.
    research_ref: ch02#12
    proof: L1
    cwe: CWE-200
    target_kinds: [ip, domain, url]
    estimated_requests: 8

