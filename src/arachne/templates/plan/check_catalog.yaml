    requires_active_checks: true
  - module: M2
    name: smtp-transport
    version: '1.0'
    title: SMTP transport security and relay posture
    description: Establishes whether SMTP STARTTLS is offered and required, which AUTH mechanisms the server advertises before any encryption, and whether it relays mail for an external sender to an external recipient. The relay probe sends an envelope only - a MAIL FROM and an RCPT TO for a non-deliverable reserved-domain recipient, then RSET and QUIT - and never issues DATA or a message body.
    research_ref: ch02#20
    proof: L1
    cwe: CWE-319
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 4
    requires_active_checks: true
  - module: M3
    name: graphql-depth-abuse
    version: '1.0'
    title: GraphQL depth and cost limit audit
    description: 'Sends two bounded amplification probes at the GraphQL endpoints the crawl found: a selection nested to a configured (modest) depth along a real cycle in the introspected type graph, and one operation carrying a configured number of aliases. A server with a depth or cost limit refuses them; a response carrying data means the limit is absent. Every probe selects only the introspection meta-field __typename, so no document content is requested; no mutation is sent.'
    research_ref: ch03#32
    proof: L1
    cwe: CWE-770
    target_kinds:
    - url
    estimated_requests: 9
    requires_active_checks: true
  - module: M3
    name: graphql-resolver-auth
    version: '1.0'
    title: GraphQL resolver authorization audit
    description: Reads the schema and asks each query field whose name suggests an authenticated resource for its __typename with no credential presented, with a query for a field that cannot exist as the control. Data from the first and an error from the second is the anonymous-resolver-access pattern. Only the introspection meta-field is selected, so no document content is requested.
    research_ref: ch03#32
    proof: L1
    cwe: CWE-862
    target_kinds:
    - url
    estimated_requests: 10
    requires_active_checks: true
  - module: M3
    name: websocket-upgrade-auth
    version: '1.0'
    title: WebSocket upgrade authentication audit
    description: Completes the WebSocket upgrade at the endpoints the crawl found while presenting no credential of any kind (no Authorization, Cookie, subprotocol token or demo session), verifying the RFC 6455 accept derivation of the key it sent and using a plain GET of the same path as the upgrade-only control. An upgrade that succeeds without a credential means the connection is never authenticated.
    research_ref: ch03#33
    proof: L1
    cwe: CWE-306
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: websocket-injection
    version: '1.0'
    title: WebSocket message relay probe
    description: Completes the WebSocket handshake over the scoped network client and sends one inert, self-describing marker text frame plus one control PING. A server that echoes the marker is relaying client input unvalidated, the precondition of message injection; the probe sends no command language, query or target-specific syntax and exactly one message per endpoint. Off unless ARACHNE_WEB_WS_PROBE=true.
    research_ref: ch03#33
    proof: L1
    cwe: CWE-1385
    target_kinds:
    - url
    estimated_requests: 4
    requires_active_checks: true
  - module: M3
    name: client-secret-verify
    version: '1.0'
    title: Client-side credential impact verification
    description: 'Verifies dynamically what a served bundle''s hardcoded credential means: that the API endpoint behind it answers a caller presenting no credential at all, with the ladder''s single-use out-of-band token planted in a URL-valued parameter for confirmation. The credential''s value is never available to a check (redaction at capture, F-08-04) and is never replayed; the check proves impact, not possession. Opt-in (L2).'
    research_ref: ch03#3
    proof: L2
    cwe: CWE-522
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  # ---------------------------------------------------------------- WP-08 breadth (REQ-DET-004, REQ-DET-009)
  # Four CWE Top 25 emitters and five missing injection families, all L1 and read-only.
  - module: M3
    name: ldap-injection
    version: '1.0'
    title: LDAP injection oracle
    description: 'Confirms that a parameter reaches an LDAP filter by two read-only differentials: a malformed filter whose response carries the directory server''s own exception text, or a wildcard filter that renders more records than a literal non-match. No entry is read, modified or enumerated; the probe is bounded to the crawled parameter surface.'
    research_ref: ch03#2
    proof: L1
    cwe: CWE-90
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: xpath-injection
    version: '1.0'
    title: XPath injection oracle
    description: 'Confirms that a parameter reaches an XPath expression by two read-only differentials: a malformed predicate whose response carries the XPath engine''s own exception text, or the inert true/false predicate pair whose rendered result counts diverge. The second probe is the differential that a quoted value cannot reproduce; no node is read or extracted.'
    research_ref: ch03#1
    proof: L1
    cwe: CWE-643
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: code-injection-oracle
    version: '1.0'
    title: Code injection oracle
    description: 'Sends a bare arithmetic expression (7*7*7) to parameters that suggest an evaluation context and reports only when the *computed* result appears where the benign baseline did not have it. This is the evaluation-context oracle of research ch03#6, distinct from SQL and command injection and from template injection (no template delimiters are sent). Arithmetic only: no built-in, no attribute chain, no file access.'
    research_ref: ch03#6
    proof: L1
    cwe: CWE-94
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: argument-injection
    version: '1.0'
    title: Command-argument injection oracle
    description: 'Appends an unknown long option to a value that is plausibly concatenated into a command line and reports when the wrapped utility''s own argument parser answers with a diagnostic the baseline did not have. That proves the value was split into argv without neutralization — CWE-77''s general command-injection precondition. No separator, shell metacharacter or command of our choosing is sent, and nothing is executed.'
    research_ref: ch03#8
    proof: L1
    cwe: CWE-77
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: host-header-injection
    version: '1.0'
    title: Host header injection
    description: 'Sends one forged Host / X-Forwarded-Host value to crawled pages and reports when the forged name appears inside an absolute URL in the response body or in a Location header that the canonical response did not carry. A bare reflection is not a finding: the poisoned value has to land in a URL the page would hand to a user. Read-only GET probes.'
    research_ref: ch03#15
    proof: L1
    cwe: CWE-644
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  - module: M3
    name: email-header-injection
    version: '1.0'
    title: Email header injection
    description: 'Injects a CRLF sequence plus a nonce-named header into a mail-address parameter and reports only when the application''s structured message headers contain that header with the nonce. That is evidence the value was parsed as a header, not merely echoed; a validating endpoint rejects it. Read-only GET probes.'
    research_ref: ch03#15
    proof: L1
    cwe: CWE-93
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  - module: M3
    name: cache-deception
    version: '1.0'
    title: Web cache deception
    description: 'Requests a personalized page through a static-looking path (a nonce named .css) and reports when the same personalized body is returned with shared-cacheable headers. A shared cache will store that response, so a third party who requests the static path receives the private page. Distinct from cache poisoning: no unkeyed input is injected. Read-only GET probes.'
    research_ref: ch03#17
    proof: L1
    cwe: CWE-524
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: authz-bypass
    version: '1.0'
    title: Authorization-schema bypass
    description: 'Takes a page the server denied (401/403) and reads alternate renderings of its path: a trailing slash, a case variant and a duplicated separator. A 200 that still carries a segment of the protected path means the authorization decision covered one spelling of the route and not the handler behind it — incorrect authorization (CWE-863), not a missing check. Read-only GET probes.'
    research_ref: ch03#18
    proof: L1
    cwe: CWE-863
    target_kinds:
    - url
    estimated_requests: 10
    requires_active_checks: true
  - module: M3
    name: input-validation-audit
    version: '1.0'
    title: Input validation audit
    description: 'Probes numeric parameters with an out-of-domain value (negative or far beyond any sane bound) and reports only when the application accepts it: a 2xx response that echoes the value, keeps the baseline''s success shape and carries no error marker. CWE-20 is emitted deliberately for this one specific failure, never as a catch-all for unusual input. Read-only GET probes.'
    research_ref: ch03#30
    proof: L1
    cwe: CWE-20
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  # ---------------------------------------------------------------- WP-11 browser crawling
  # The DOM-sink half of ch03#3 (REQ-DET-015). Behind the optional `browser` extra *and* the
  # ARACHNE_WEB_BROWSER_CRAWL opt-in, so its absence is a skipped check rather than a failure.
  - module: M3
    name: dom-xss
    version: '1.0'
    title: DOM-based cross-site scripting sinks
    description: 'Crawls the application in a hardened headless browser and loads each route with a fresh inert marker planted in the URL fragment and in a query parameter. When the marker reaches a documented DOM sink (innerHTML, document.write, eval, location.href, ...) and was absent from the server''s own response body, the page moved an attacker-controllable source into a dangerous sink without server involvement: a DOM-XSS. The evidence names the source and the sink. Requires the optional arachne[browser] extra and ARACHNE_WEB_BROWSER_CRAWL=true; the marker is inert, nothing is executed as a payload, and every navigation passes the scope gate before the request.'
    research_ref: ch03#3
    proof: L1
    cwe: CWE-79
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
