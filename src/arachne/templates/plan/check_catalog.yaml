  # ---------------------------------------------------------------- M6 automation, AI-era, post-exploit (S11: implemented)
  - module: M6
    name: secret-scan-at-scale
    version: '1.0'
    title: Repository and history secret scan
    description: Scans a local repository clone for committed credentials — the working tree, the reflog/config, and git history (loose objects are decompressed read-only) — with the corpus detectors (AWS/GCP/Azure keys, GitHub/GitLab/Slack/Stripe tokens, PEM keys, connection strings, generic secrets), reporting the credential kind and location with the value masked (research ch06#8). Read-only; no clone, no network.
