  - module: M2
    name: http3-probe
    version: '1.0'
    title: HTTP/3 transport parity
    description: Reads the Alt-Svc advertisement and, when the optional QUIC client is installed, performs one HTTP/3 GET of the same path. The security-relevant response headers are compared with the HTTP/1.1-2 response, so a QUIC path that serves a weaker header set than the TCP path is reported. The transport used is recorded in evidence. Without the optional extra the check records that QUIC probing is unavailable and sends nothing over QUIC; the target not speaking HTTP/3 is an observation, never a finding.
    research_ref: ch02#12
    proof: L1
    cwe: CWE-693
    target_kinds:
