    description: 'Reviews the crawled surface and a declared repository for the GenAI attack surface: an exposed LLM/agent API endpoint answering 2xx, a hosted-model API key reaching a client or served document, a served system prompt or prompt-injection marker, and an agent/tool configuration that grants secret or command access (research ch06#14-15). Passive: it reads the crawl and local files and never sends a prompt or injection payload.'
    research_ref: ch06#14-15
