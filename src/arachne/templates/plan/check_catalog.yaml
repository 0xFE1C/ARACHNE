  # ---------------------------------------------------------------- WP-34 (REQ-DET-027)
  # Reconnaissance breadth (M1) and the AI-era serving surface (M6). Generated from the
  # check metadata; tests/unit/test_registry.py fails the build if the two ever disagree.
  - module: M1
    name: nameserver-inventory
    version: '1.0'
    title: Nameserver delegation inventory
    description: 'Reads the domain''s NS records through a DNS-over-HTTPS resolver and reports the delegation set it publishes. The set names the providers the domain''s resolution depends on — the first fact an enumeration wants and the input to the zone''s shape. It is an inventory, not a finding: a delegation set that resolves proves nothing on its own. Read-only: one resolver query.'
    research_ref: ch01#6
    proof: L1
    cwe: CWE-200
    target_kinds:
    - domain
    - domain_pattern
    estimated_requests: 1
  - module: M1
    name: mail-infrastructure-inventory
    version: '1.0'
    title: Mail-exchanger inventory
    description: 'Reads the domain''s MX records through a DNS-over-HTTPS resolver and reports the mail exchangers it publishes, in the resolver''s preference order. The set names the mail estate (and, through it, the provider the organisation uses) — a different record class from the delegation set, and an inventory rather than a finding. Read-only: one resolver query.'
    research_ref: ch01#6
    proof: L1
    cwe: CWE-200
    target_kinds:
    - domain
    - domain_pattern
    estimated_requests: 1
  - module: M1
    name: certificate-inventory
    version: '1.0'
    title: Certificate-issuance inventory
    description: 'Reads the certificate-transparency log for the declared domain and reports the distinct certificates that name it: their issuers, their validity windows and their count. It is the certificate *fingerprinting* view — which authorities issue for this name, and over what period — and it is an inventory, not a finding. A different claim from ``m1.ct-lookup``, which records the *hostnames* the same log exposes. Read-only: one log query.'
    research_ref: ch01#24
    proof: L1
    cwe: CWE-200
    target_kinds:
    - domain
    - domain_pattern
    estimated_requests: 1
  - module: M1
    name: certificate-expiry
    version: '1.0'
    title: Certificate expiry review
    description: 'Reads the certificate-transparency log for the declared domain and reports the certificates whose own ``not_after`` has passed or falls inside the next 30 days. Unlike the inventory beside it this raises a candidate, because the finding rests on a date the certificate itself states rather than on a fingerprint: an expired certificate is still being served somewhere, and an expiring one is an operational cliff. Read-only: one log query; the certificate is not fetched or re-validated.'
    research_ref: ch01#24
    proof: L1
    cwe: CWE-295
    target_kinds:
    - domain
    - domain_pattern
    estimated_requests: 1
  - module: M1
    name: asn-network-attribution
    version: '1.0'
    title: Network (ASN) attribution of an address
    description: 'Reads the registration-data (RDAP) address object for the declared address and reports the network it is allocated from: the registry handle and name, the address range and the country. The range is what an ASN-level enumeration works from — the owning network''s own statement, not a guess from a reverse lookup. It is an inventory, so it emits an info result. Read-only: one registry query through the opt-in ``whois`` provider.'
    research_ref: ch01#27
    proof: L1
    cwe: CWE-200
    target_kinds:
    - ip
    estimated_requests: 1
  - module: M1
    name: reverse-ip-cluster
    version: '1.0'
    title: Reverse-IP host clustering
    description: 'Reads the third-party index entry for the declared address and reports the hostnames it records as resolving there, recording each as a scoped asset. The co-tenancy view is how an enumeration finds the siblings of a name — the input to reverse-IP clustering — and it is an inventory, not a finding. A different claim from ``m1.internetdb-triage``, which reports the *services and CVEs* of one address; this reports the names beside it. Read-only: one index query.'
    research_ref: ch01#12
    proof: L1
    cwe: CWE-200
    target_kinds:
    - ip
    estimated_requests: 1
  - module: M1
    name: technology-inventory
    version: '1.0'
    title: Published-technology inventory
    description: 'Reads the crawl the checks step already built and reports the technologies the application itself publishes — its server header, its powered-by header, its generator meta and its framework markers — with the version each one discloses. It is fingerprint breadth as an inventory: a technology name is a signal that steers the next step, and only a version the application states about itself is reported, never a guess from a loose substring. Reads the crawl only; it issues no request of its own (estimated_requests = 0). Distinct from ``m2.http-fingerprint``, which reads a socket banner.'
    research_ref: ch02#10
    proof: L1
    cwe: CWE-200
    target_kinds:
    - url
    estimated_requests: 0
  - module: M1
    name: vhost-discovery
    version: '1.0'
    title: Virtual-host discovery
    description: 'Takes the other hostnames the crawl''s pages name, asks the declared origin for each one with that name in the Host header, and reports the names whose answer is a *different, successful* application than the origin''s own — a corroborated virtual host, not a banner guess. Only the Host header a browser would send is added to a plain GET: no body, no other verb, nothing written. The candidate set is bounded and comes from the target''s own content.'
    research_ref: ch02#12
    proof: L1
    cwe: CWE-200
    target_kinds:
    - url
    estimated_requests: 6
  - module: M6
    name: ollama-model-list
