    target_kinds:
    - git
    - cloud
    - url
    estimated_requests: 0
  - module: M6
    name: ci-secret-leak
    version: '1.0'
    title: CI log/artifact secret leakage
    description: 'Reads exported CI logs and build artifacts (from a repository clone or a configured log directory) for leaked credentials: a token a workflow echoed, an unmasked secret, a debug trace of an environment variable (research ch06#23). The same detectors as the repository scan plus CI-specific markers (::add-mask::, GITHUB_TOKEN, printenv, set -x). Values are masked; nothing is fetched.'
    research_ref: ch06#23
    proof: L1
    cwe: CWE-532
    target_kinds:
