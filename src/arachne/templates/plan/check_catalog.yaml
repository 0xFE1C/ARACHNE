    description: 'Establishes whether a TLS service actually enforces client-certificate authentication. Three read-only observations are recorded: the handshake with no client certificate, the presence of a CertificateRequest in the server''s TLS 1.2 flight, and the server''s answer to a throwaway self-signed certificate. A service that asks for a certificate and then accepts a client that presented none is reported, because its advertised authentication boundary is absent. No credential belonging to a principal is used, and no application-layer byte is sent.'
