    title: Server-side request forgery callback probe
    description: 'Injects an out-of-band callback URL (ARACHNE_WEB_SSRF_CALLBACK, a service on ARACHNE''s own infrastructure) into every parameter the crawl identified as a server-side fetch sink, and confirms the class when the sink reflected the callback''s nonce (in-band) or the callback service recorded the hit (out-of-band). Off by default: it needs ARACHNE_WEB_SSRF_CALLBACK, ARACHNE_WEB_SSRF_PROBE=true and the active-checks opt-in. No internal address or credential is ever targeted.'
    research_ref: ch03#5
    proof: L1
    cwe: CWE-918
    target_kinds:
    - url
    estimated_requests: 10
