  # ---------------------------------------------------------------- M4 misconfiguration & exposure
  - module: M4
    name: security-header-review
    version: "1.0"
    title: Security response headers missing or weak
    description: >-
      Reviews every crawled page's response headers against the hardening baseline (HSTS on HTTPS, CSP with frame-ancestors, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy) and flags a CSP that names unsafe-inline/unsafe-eval/a bare wildcard. One finding per origin, because the gap is an origin-wide configuration decision.
    research_ref: ch04#16
    proof: L1
    cwe: CWE-693
    target_kinds: [url]
    estimated_requests: 1
  - module: M4
    name: cookie-flag-audit
    version: "1.0"
    title: Session cookie lacks hardening attributes
    description: >-
      Reads the structural Set-Cookie projection the HTTP client captures (name and attributes only — never the value) and reports session-like cookies missing Secure, HttpOnly or SameSite, weighted by whether the name suggests a session and whether the cookie was set over plaintext HTTP.
    research_ref: ch04#18
    proof: L1
    cwe: CWE-614
    target_kinds: [url]
    estimated_requests: 1
  - module: M4
    name: client-secrets
    version: "1.0"
    title: Credential material in client-side assets
    description: >-
      Reviews every JavaScript bundle and HTML document the crawl fetched and reports the ones whose raw bytes matched a secret detector (cloud access key, provider API token, JWT, credentialed URL, PEM key). Only the detector names and the asset's provenance are reported; the values were redacted at capture time.
    research_ref: ch04#14
    proof: L1
    cwe: CWE-798
    target_kinds: [url]
    estimated_requests: 0
  - module: M4
    name: env-file-probe
    version: "1.0"
    title: Exposed environment or configuration file
    description: >-
      Requests the well-known environment and configuration paths (.env and its variants, wp-config.php, application.properties, config.yml, ...) and reports the ones that return a file instead of a not-found page. A hit is confirmed by credential-bearing key=value lines and by the redactor's detector names; the values themselves are redacted at capture time and never reach the check.
    research_ref: ch04#1
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 8
  - module: M4
    name: vcs-exposure
    version: "1.0"
    title: Exposed version-control metadata
    description: >-
      Probes /.git/HEAD, /.git/config, /.svn/entries, /.svn/wc.db and /.hg/requires and confirms the answer by its repository markers (a ref line, a [core] block, an SVN XML/entries body, a SQLite payload). It reports the exposure only; it does not download objects or reconstruct history.
    research_ref: ch04#2
    proof: L1
    cwe: CWE-538
    target_kinds: [url]
    estimated_requests: 5
  - module: M4
    name: backup-file-hunt
    version: "1.0"
    title: Downloadable backup or dump file
    description: >-
      Combines a bounded name list with backup/dump extensions under the usual backup directories and reports the artifacts that download. A hit is confirmed by the content's own signature (SQL statements, a dotenv body, source code), by an archive/database content type, or by a binary payload where the extension is binary by nature.
    research_ref: ch04#3
    proof: L1
    cwe: CWE-530
    target_kinds: [url]
    estimated_requests: 20
  - module: M4
    name: key-exposure
    version: "1.0"
    title: Private key material exposed
    description: >-
      Probes the well-known private-key and keystore paths and reports a reachable one when the response is PEM key material (the redactor's private-key detector fired), carries a PEM header, or is served with a key-file extension and a non-HTML content type. The key's contents never enter evidence.
    research_ref: ch04#15
    proof: L1
    cwe: CWE-321
    target_kinds: [url]
    estimated_requests: 8
  - module: M4
    name: sourcemap-exposure
    version: "1.0"
    title: JavaScript source map exposed
    description: >-
      Follows the sourceMappingURL reference of every JavaScript/CSS asset the crawl fetched, requests the map, and reports it when the document carries sources or sourcesContent. Recovered original sources and any secrets the redactor detected are reported by name, never by value.
    research_ref: ch04#4
    proof: L1
    cwe: CWE-540
    target_kinds: [url]
    estimated_requests: 6
  - module: M4
    name: api-doc-exposure
    version: "1.0"
    title: API documentation exposed
    description: >-
      Probes the conventional Swagger/OpenAPI/Redoc paths, parses a document it finds (JSON or YAML), and reports the schema plus the routes it publishes. The routes are recorded as assets and added to the shared web inventory under the 'api-doc' source, so m3.api-surface replays them as part of its own endpoint coverage instead of guessing them from a wordlist.
    research_ref: ch04#5
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 8
  - module: M4
    name: debug-endpoints
    version: "1.0"
    title: Debug or diagnostic endpoint reachable
    description: >-
      Probes the fixed high-confidence debug surface: phpinfo() pages, Apache server-status/server-info, Spring Boot Actuator (including /actuator/env, /actuator/heapdump and the legacy top-level endpoints), framework debug toolbars/consoles, Prometheus /metrics and Go's /debug/vars. A hit is confirmed by the page's own markers or a stack trace; the heapdump is a hit on a binary download alone.
    research_ref: ch04#7
    proof: L1
    cwe: CWE-489
    target_kinds: [url]
    estimated_requests: 20
  - module: M4
    name: directory-listing
    version: "1.0"
    title: Directory listing enabled
    description: >-
      Requests candidate directories with and without the trailing slash and classifies the answer as an auto-generated index (Apache 'Index of', nginx 'Directory listing for', IIS '[To Parent Directory]'). The published entries are extracted as the exposure's evidence, because a listing is a free file inventory.
    research_ref: ch04#9
    proof: L1
    cwe: CWE-548
    target_kinds: [url]
    estimated_requests: 10
  - module: M4
    name: dashboard-exposure
    version: "1.0"
    title: Administrative or monitoring dashboard reachable
    description: >-
      Fingerprints the common management and observability UIs (Jenkins, Kibana, Grafana, Prometheus, Consul, phpMyAdmin, SonarQube, RabbitMQ) by path, body marker and response header, and reports each one reachable from the scanning position. It distinguishes an anonymous dashboard from one that presents a login form; the credential attempt itself belongs to m4.default-credentials.
    research_ref: ch04#11
    proof: L1
    cwe: CWE-284
    target_kinds: [url]
    estimated_requests: 12
  - module: M4
    name: hidden-endpoint-hunt
    version: "1.0"
    title: Hidden endpoint or content reachable
    description: >-
      Probes a bounded wordlist of unlinked paths (plus a few editor-artifact mutations) and reports the ones that answer differently from the application's not-found page and its single-page catch-all. Only paths that look sensitive by name or that serve a non-HTML file are reported, so the check inventories exposure rather than every route the application owns.
    research_ref: ch04#24
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 30
  - module: M4
    name: staging-exposure
    version: "1.0"
    title: Staging or development surface exposed
    description: >-
      Looks for development and staging surfaces in two places: labelled paths on the declared origin (/staging/, /dev/, /test/, ...) and crawled hosts whose name carries a staging label. A path only counts when it is reachable, is not the application's not-found page, and is not the SPA shell; a labelled host is reported from the page the crawl already fetched.
    research_ref: ch04#25
    proof: L1
    cwe: CWE-1188
    target_kinds: [url]
    estimated_requests: 10
  - module: M4
    name: unauth-api-audit
    version: "1.0"
    title: Data-bearing API route answers without authentication
    description: >-
      Replays the routes recovered from an exposed API document and the internal-looking routes the crawl found, deliberately without the operator's session, and reports a 200 JSON answer that carries records. A 401/403 is the control working and is not reported. GET only.
    research_ref: ch04#29
    proof: L1
    cwe: CWE-306
    target_kinds: [url]
    estimated_requests: 6
  - module: M4
    name: bucket-exposure
    version: "1.0"
    title: Object-storage bucket is publicly readable
    description: >-
      Probes a bucket root for an anonymous listing (<ListBucketResult>, GCS items, Azure EnumerationResults) and for a public ACL (AllUsers / allUsers / container-public-access). Cloud references are translated into the provider's public endpoint; an endpoint: reference (S3-compatible storage, or the lab fixture) is probed directly. Candidate names derived from the target's organisation label are tested with a bounded wordlist. Non-destructive: GET only, no object writes.
    research_ref: ch04#13
    proof: L1
    cwe: CWE-732
    target_kinds: [cloud, url, domain]
    estimated_requests: 16
  - module: M4
    name: cors-config-review
    version: "1.0"
    title: CORS policy allows cross-origin reads
    description: >-
      Runs the origin matrix of research ch04#19 — an arbitrary origin, the literal 'null', and a look-alike host — against the crawled JSON/API endpoints and reads Access-Control-Allow-Origin/Allow-Credentials. A reflected origin with credentials is a cross-origin read primitive; a null acceptance and a wildcard with credentials each carry their own weight. GET only.
    research_ref: ch04#19
    proof: L1
    cwe: CWE-942
    target_kinds: [url]
    estimated_requests: 9
    requires_active_checks: true
  - module: M4
    name: tls-config-review
    version: "1.0"
    title: Weak TLS configuration
    description: >-
      Profiles the TLS endpoint behind an https URL asset with the raw-network client: negotiated version and cipher, whether a deprecated protocol (SSLv3, TLS 1.0/1.1) still completes a handshake, and whether the certificate chain validates for the host name. A light review; M2's deep scan is the exhaustive one.
    research_ref: ch04#17
    proof: L1
    cwe: CWE-326
    target_kinds: [url]
    estimated_requests: 8
    requires_active_checks: true
  - module: M4
    name: email-auth-review
    version: "1.0"
    title: Email authentication missing or permissive
    description: >-
      Asks a DNS-over-HTTPS resolver for the domain's SPF, DMARC and DKIM TXT records and reports the spoofable configurations: no SPF, an SPF ending in +all/?all, no DMARC, a DMARC policy of none, and no DKIM selector answered. It is a third-party lookup, so it runs only when OSINT is enabled and the 'dns' provider is selected (safe defaults, F-02-09).
    research_ref: ch04#20
    proof: L1
    cwe: CWE-290
    target_kinds: [url, domain]
    estimated_requests: 6
  - module: M4
    name: webdav-verbs
    version: "1.0"
    title: Unsafe HTTP methods or WebDAV enabled
    description: >-
      Sends OPTIONS to read the advertised Allow set, PROPFIND to test WebDAV metadata access and TRACE to test cross-site tracing. A write verb (PUT, DELETE, MOVE, COPY, MKCOL) is reported from Allow and never exercised; nothing is uploaded, renamed or deleted.
    research_ref: ch04#21
    proof: L1
    cwe: CWE-650
    target_kinds: [url]
    estimated_requests: 9
    requires_active_checks: true
  - module: M4
    name: user-enumeration
    version: "1.0"
    title: Username enumeration through a login differential
    description: >-
      Submits a single dummy password for a few candidate user names (plus one random name as the invalid baseline) to each credential form the crawl found, and reports a form whose answers differ by status, marker or body length. At most a handful of attempts, one password each: the check confirms that existence is observable, it never guesses a credential.
    research_ref: ch04#28
    proof: L1
    cwe: CWE-204
    target_kinds: [url]
    estimated_requests: 6
    requires_active_checks: true
  - module: M4
    name: metadata-ssrf
    version: "1.0"
    title: Cloud metadata service reachable through a request sink
    description: >-
      Injects the provider metadata URLs (AWS 169.254.169.254, GCP computeMetadata, Azure instance) into parameters the crawl identified as likely server-side fetchers and reports the posture from the sink's answer: metadata returned (IMDSv1-style, exploitable) or a 401 challenge (IMDSv2 enforced). Off by default: it needs ARACHNE_M4_METADATA_SSRF=true, an explicit check selection and the active-checks opt-in. It sends GET only and never stores a response body beyond its redacted evidence.
