    description: 'Reaches an S7comm endpoint with an ISO-TSAP connection request and a DNP3 outstation with a link-layer status request, reporting a controller whose engineering protocol answers from the scanned segment. Read-only: no S7 read or write job, no PLC memory access, and no DNP3 link reset. Opt-in.'
