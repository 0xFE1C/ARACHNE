    description: 'Authenticates to an SMB service with the credential this scan selected from the vault, using an SMB2 NTLMSSP exchange, and reports whether the peer accepted it. The credential never enters the check: the broker supplies it for one exchange and drops it, so the finding carries the peer''s status and the redacted exchange only. Opt-in, active, and refused when the credential is not scoped to the target.'
