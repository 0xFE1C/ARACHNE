  - module: M3
    name: file-inclusion
    version: "1.0"
    title: File inclusion oracle
    description: "Confirms local file inclusion when a world-readable file's header line, or the base64 of a PHP opening tag from a php://filter read, appears in the probe response. The remote-file-inclusion probe only *references* an unresolvable .invalid host and is reported only on a clear in-response include side effect (a wrapper/allow_url_include diagnostic). The payload is never fetched and no remote code is executed."
    research_ref: ch03#13
    proof: L1
    cwe: CWE-98
    target_kinds: [url]
    estimated_requests: 10
    requires_active_checks: true

  - module: M3
    name: crlf-injection
    version: "1.0"
    title: CRLF / HTTP header injection oracle
    description: "Injects CR/LF-bearing header fragments into query parameters and flags only what the response *shows*: an echoed X-Injected header, an injected Set-Cookie name, or a Location carrying the injected host (header/response splitting). The check observes the split; it never attempts to exploit it or smuggle a second response."
    research_ref: ch03#15
    proof: L1
    cwe: CWE-113
    target_kinds: [url]
    estimated_requests: 8
    requires_active_checks: true

  - module: M4
    name: verbose-errors
    version: "1.0"
    title: Verbose error page exposes internals
    description: "Requests malformed and error-triggering paths and inspects the response body for the signature of a leaked error page: a Python traceback, a Java stack trace, a PHP Fatal error/Warning, an ASP.NET 'Server Error in', a Spring/SQLSTATE/Django/Laravel/Whoops error. An answer that is merely the application's own not-found page is rejected by comparison, so a styled 404 is never reported."
    research_ref: ch04#6
    proof: L1
    cwe: CWE-209
    target_kinds: [url]
    estimated_requests: 12

  - module: M4
    name: actuator-exposure
    version: "1.0"
    title: Spring Boot Actuator endpoint exposed
    description: Probes the conventional Actuator paths (/actuator, /env, /health, /beans, /mappings, /configprops, /heapdump, /threaddump, /loggers, /httptrace, /jolokia/list) and flags those that answer with Actuator's own JSON ('_links', activeProfiles/propertySources, a thread dump, or a heapdump binary). A reachable Actuator index is a high-confidence finding; a health probe is not enough on its own unless it exposes status detail.
    research_ref: ch04#8
    proof: L1
    cwe: CWE-497
    target_kinds: [url]
    estimated_requests: 12

  - module: M4
    name: datastore-surface
    version: "1.0"
    title: Data-store API reachable over HTTP
    description: Probes the well-known HTTP APIs of Elasticsearch/OpenSearch (/ _cat/indices, /_cluster/health, /_plugins/_security/...), CouchDB (/_all_dbs), Solr (/solr/admin/cores), Consul (/v1/agent/self) and Redis web UIs. A path is only reported when the body is clearly that product's own API shape (a cluster health document, a database-name array, a Solr response header), never a generic page.
    research_ref: ch04#12
    proof: L1
    cwe: CWE-668
    target_kinds: [url]
    estimated_requests: 10

  - module: M4
    name: robots-sitemap
    version: "1.0"
    title: robots.txt or sitemap.xml discloses sensitive paths
    description: Fetches /robots.txt and /sitemap.xml and reports entries that name a sensitive surface (admin, backup, .git, staging, dev, internal, api/, private, config, secret, db, test, old, tmp, .sql, .bak, .env). The offending Disallow/Allow lines and sitemap URLs are carried as evidence. A file that lists only ordinary paths is information, not a finding.
    research_ref: ch04#23
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 3

  - module: M4
    name: wordpress-surface
    version: "1.0"
    title: WordPress surface exposes users or XML-RPC
    description: "Probes /wp-json/, /wp-json/wp/v2/users, /xmlrpc.php, /?author=1 and /wp-login.php. It reports a REST user list (login-name enumeration), the REST root the API publishes, an author redirect that leaks a login name and an enabled XML-RPC endpoint. It sends GETs only: XML-RPC is detected from its 'accepts POST requests only' answer, never by sending a POST body."
    research_ref: ch04#27
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 8

  - module: M4
    name: alias-traversal
    version: "1.0"
    title: Static alias allows path traversal
    description: "Probes misconfigured static/alias prefixes (/static, /assets, /images, /media, /css, /js, /files, /uploads and a file parameter) with encoded .. traversal to the /etc/passwd canary. A path is reported only when the response body reveals the canary ('root:x:0:0:' or '/bin/bash'), so an ordinary 404 or a blob that merely echoes the name is never a finding. Read-only GETs only."
    research_ref: ch04#30
    proof: L1
    cwe: CWE-22
    target_kinds: [url]
    estimated_requests: 12

  - module: M5
    name: serverless-functions
    version: "1.0"
    title: Unauthenticated serverless function endpoint
    description: "Probes the web origin for a reachable serverless/function endpoint: an AWS Lambda function URL, an API Gateway stage (/prod, /dev, /stage), an Azure Functions app (/api/), a GCP Cloud Functions host or a Cloudflare Workers subdomain (research ch05#9). A 200 carrying a function response and no auth challenge is the finding; a 401/403 challenge is the hardened answer. GET only; nothing is invoked."
    research_ref: ch05#9
    proof: L1
    cwe: CWE-284
    target_kinds: [url]
    estimated_requests: 8

  - module: M5
    name: managed-datastores
    version: "1.0"
    title: Reachable managed database console or proxy
    description: "Probes the web origin for a publicly reachable managed-database surface: an adminer/phpMyAdmin/pgAdmin console at the conventional paths, a /.well-known database indicator, or a cloud DB proxy endpoint (RDS/Aurora, Azure SQL/Postgres, MongoDB Atlas/Compass) answering with its metadata (research ch05#20). GET only."
    research_ref: ch05#20
    proof: L1
    cwe: CWE-668
    target_kinds: [url]
    estimated_requests: 8

  - module: M5
    name: search-platform-exposure
    version: "1.0"
    title: Unauthenticated search platform exposed
    description: "Probes the web origin for an exposed Elasticsearch, Kibana or OpenSearch Dashboards instance: ``/_cat/indices`` and ``/_cluster/health`` (Elasticsearch JSON), ``/app/kibana`` and ``/api/status`` (Kibana), and the OpenSearch Dashboards equivalents (research ch05#21). A 200 carrying the product JSON/HTML is the finding; a 401/403 is the hardened answer. GET only, read-only."
    research_ref: ch05#21
    proof: L1
    cwe: CWE-668
    target_kinds: [url]
    estimated_requests: 8

  - module: M6
    name: template-scan
    version: "1.0"
    title: Template-driven exposure match
    description: "A minimal, offline matcher: loads simple path + body-marker templates from the managed corpus, requests each template's path(s) against the asset origin and flags a response whose status and body markers match (research ch06#3). Strictly a matcher — no templating engine, no code execution, GET only."
    research_ref: ch06#3
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 10

  - module: M6
    name: exploit-match
    version: "1.0"
    title: Known N-day exploit matches observed software
    description: "Matches the estate's observed software banners and CVE ids — from the network and web crawl already in the step context, or a bounded banner fetch — against a compact offline ExploitDB-style N-day index, and reports the mapped exploit/PoC reference as a candidate (research ch06#5). Matching only: no exploitation is performed."
    research_ref: ch06#5
    proof: L1
    cwe: CWE-1104
    target_kinds: [url, domain, ip]
    estimated_requests: 2

  - module: M6
    name: credential-hunt
    version: "1.0"
    title: Credentials in reachable configuration surfaces
    description: "Hunts credentials in reachable configuration surfaces: the crawled pages/inventory the step already has plus a bounded set of .env-style paths (web.config, appsettings.json, docker-compose.yml, application.properties, shell rc files, backups), reusing the shared secret detectors and reporting the detector name and a masked fingerprint — never a raw value (research ch06#17). GET only."
    research_ref: ch06#17
    proof: L1
    cwe: CWE-798
    target_kinds: [url]
    estimated_requests: 4

  # ---------------------------------------------------------------- M2 AD CS (WP-10, REQ-DET-014)
  # Read-only AD CS enumeration: two LDAP object classes, credentialed, L1. The check
  # reports configuration *conditions* and never attempts exploitation.
  - module: M2
    name: adcs-enum
    version: '1.0'
    title: Active Directory Certificate Services misconfiguration (read-only)
    description: 'Binds to the directory with the scan''s selected LDAP credential and enumerates two AD CS object classes — pKICertificateTemplate and pKIEnrollmentService — under the configuration naming context, then reports the configuration conditions associated with the published ESC classes (a template that permits an enrollee-supplied subject, an unrestricted usage, an enrolment-agent usage, a missing security extension, a v1 schema, or a CA that honours a requester-supplied subject alternative name). The ESC class is named as context, never as a claim of exploitability. ARACHNE does not attempt exploitation: no request reaches the CA service, no certificate is requested and no template is modified. Read-only, credentialed, and skipped when no credential is available.'
    research_ref: ch02#18
    proof: L1
    cwe: CWE-269
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 2
    requires_active_checks: true

  # ---------------------------------------------------------------- M6 MCP family (WP-07, REQ-DET-005)
  # The read-only MCP security family: three anonymous GETs at the published well-known
  # documents and the MCP endpoint. All L1, all default-on (opt-out-able), all GET-only.
  - module: M6
    name: mcp-token-audience
    version: "1.0"
    title: "MCP protected-resource metadata declares no token audience"
    description: "Reads the MCP server's protected-resource metadata (RFC 9728) with one anonymous GET and reports it when it publishes no `resource` identifier. Without one the server cannot bind an access token to its own audience, which is the token-passthrough condition the MCP Security Best Practices forbid. Read-only: the published document is parsed, and no token is ever presented."
    research_ref: ch06#15
    proof: L1
    cwe: CWE-287
    target_kinds: [url]
    estimated_requests: 1

  - module: M6
    name: mcp-session-auth
    version: "1.0"
    title: MCP endpoint authenticates with a session
    description: "Sends one anonymous GET to the MCP endpoint and reports it when the endpoint answers without any authentication challenge while issuing a session identifier (an `Mcp-Session-Id` header or a session cookie). The MCP Security Best Practices say a server MUST NOT use sessions for authentication. Read-only: no credential is sent and nothing is written; the check only reads the challenge the server sent."
    research_ref: ch06#15
    proof: L1
    cwe: CWE-306
    target_kinds: [url]
    estimated_requests: 1

  - module: M6
    name: mcp-oauth-metadata
    version: "1.0"
    title: MCP OAuth metadata advertises an unsafe discovery target
    description: "Reads the MCP server's protected-resource and authorization-server metadata with two anonymous GETs and reports an advertised issuer or authorization server that is not HTTPS or that points into a private, loopback or link-local range — the unvalidated-discovery SSRF surface the MCP Security Best Practices warn about. Read-only: the advertised URLs are parsed, never fetched — following one would be the SSRF the check reports."
    research_ref: ch06#15
    proof: L1
    cwe: CWE-918
    target_kinds: [url]
    estimated_requests: 2

  # ---------------------------------------------------------------- M6 agentic family (WP-10, REQ-DET-013)
  # The read-only OWASP Agentic Top 10 surface: one anonymous GET per path at the
  # published agent/tool/memory/policy documents. All L1, all default-on (opt-out-able),
  # all GET-only: no check authenticates to, writes to or starts a target agent.
  - module: M6
    name: agentic-tool-manifest
    version: '1.0'
    title: Agent tool manifest publishes high-impact tools without an authorization gate
    description: 'Reads the agent/MCP tool manifests a target publishes with one anonymous GET per path and reports a manifest that answers without an authentication challenge while it enumerates tools whose declared capability is destructive (command execution, file mutation, credential access, outbound fetch). The condition is the missing authorization gate on the tool surface, not the tools themselves. Read-only: the documents are parsed and no tool is ever invoked.'
    research_ref: ch06#15
    proof: L1
    cwe: CWE-269
    target_kinds:
    - url
    estimated_requests: 5
  - module: M6
    name: agentic-memory-store
    version: '1.0'
    title: Agent memory store is readable without authentication
    description: 'Reads the memory/vector/context endpoints a target publishes with one anonymous GET per path and reports one that answers 2xx without an authentication challenge with a collection listing. A context store reachable with no credential on the same surface a write would use is the context-poisoning condition (ASI06): the agent''s long-term context is not integrity-protected. Read-only: ARACHNE reads and writes nothing.'
    research_ref: ch06#15
    proof: L1
    cwe: CWE-345
    target_kinds:
    - url
    estimated_requests: 5
  - module: M6
    name: agentic-human-trust
    version: '1.0'
    title: Agent policy declares autonomous execution without human confirmation
    description: 'Reads the agent policy documents a target publishes with one anonymous GET per path and reports a policy that declares its actions run without human confirmation (`auto_approve`, `requires_confirmation: false`, `approval_mode: none`). With no confirmation step a human has no intervention point, so the trust they extend to the agent''s output is not backed by a control — the human-agent trust condition (ASI09). Read-only: the published document is parsed and no instruction is sent to the agent.'
    research_ref: ch06#15
    proof: L1
    cwe: CWE-863
    target_kinds:
    - url
    estimated_requests: 5
  - module: M6
    name: agentic-rogue-runtime
    version: '1.0'
    title: Agent runtime answers unauthenticated callers with its own configuration
    description: 'Reads the agent runtime endpoints a target publishes with one anonymous GET per path and reports one that answers 2xx without an authentication challenge while self-describing (its model, tools, framework or uptime). Nothing binds an operator to the process and nothing binds the caller, so any reachable host can drive an agent the estate cannot attribute — the unmanaged/rogue-agent condition (ASI10). Read-only: the description is parsed and no agent action is requested.'
    research_ref: ch06#15
    proof: L1
    cwe: CWE-306
    target_kinds:
    - url
    estimated_requests: 5

  # ---------------------------------------------------------------- S15 proof ladder (area PROOF)
  # The L2 out-of-band variants and the attested L3/L4 proofs (S15, area PROOF).
  # Every row is opt-in: an L2+ declaration can never be enabled by default
  # (REQ-PROOF-001), and the L3/L4 rows additionally require the state-change
  # attestation. Title/description are generated from the check metadata so the
  # drift gate in tests/unit/test_registry.py holds verbatim.

  - module: M3
    name: cmdi-oob
    version: "1.0"
    title: "Blind OS command injection, out-of-band"
    description: "Injects shell separators plus the allowlisted one-shot echo text ('echo arachne-<nonce>') into parameters whose name suggests a command sink, and confirms the class when an execution monitor reports the echo to this check's callback token (research ch03#8's blind variant). The payload is the ladder's single allowlisted command; nothing else is ever sent. Opt-in (L2)."
    research_ref: ch03#8
    proof: L2
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-78
    target_kinds: [url]
    estimated_requests: 6

  - module: M3
    name: rce-echo
    version: "1.0"
    title: "One-shot command execution proof"
    description: "Executes exactly one benign, allowlisted command — 'echo arachne-<nonce>' — through the strongest command sink the crawl identified, and reports the echoed nonce as proof of execution (REQ-PROOF-007). There is no parameter that could carry a different command; the output is captured redacted and the execution is audited. Requires the RCE probe switch, the active-checks opt-in AND an attestation that authorizes state changes (L3)."
    research_ref: ch03#8
    proof: L3
    requires_state_attestation: true
    requires_active_checks: true
    cwe: CWE-78
    target_kinds: [url]
    estimated_requests: 3

  - module: M3
    name: sqli-oob
    version: "1.0"
    title: "Blind SQL injection, out-of-band"
    description: "Injects a predicate that carries this check's out-of-band callback token into parameters whose name suggests a SQL sink, and confirms the class when the back-end resolved the predicate and reached the token (research ch03#1's out-of-band oracle). No sleep, no data read or extracted: the single hit is the proof, and it is matched single-use to this finding. Opt-in (L2)."
    research_ref: ch03#1
    proof: L2
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-89
    target_kinds: [url]
    estimated_requests: 4

  - module: M3
    name: ssti-oob
    version: "1.0"
    title: "Server-side template injection, out-of-band"
    description: "Injects an arithmetic-only template that also references this check's callback token into parameters on rendering endpoints, and confirms the class when the template engine evaluated the content and reached the token (the SSTI→SSRF primitive, research ch03#6). The template payload is inert arithmetic plus the token reference — no built-ins, no attribute chains. Opt-in (L2)."
    research_ref: ch03#6
    proof: L2
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-1336
    target_kinds: [url]
    estimated_requests: 4

  - module: M3
    name: state-marker
    version: "1.0"
    title: "State-change proof (marker row)"
    description: "Proves write access with the ladder's minimal footprint: an INSERT of one calm marker row into arachne_poc (or the obviously-fake record the deployment names), verification that it is visible, an automatic restore, and re-verification that it is gone (REQ-PROOF-008). DELETE/DROP/TRUNCATE/ALTER/GRANT and multi-statement payloads are refused in code; identity stores are refused outright. Requires the state probe switch, the active-checks opt-in AND an attestation that authorizes state changes (L4)."
    research_ref: ch03#1
    proof: L4
    requires_state_attestation: true
    requires_active_checks: true
    cwe: CWE-89
    target_kinds: [url]
    estimated_requests: 6

  - module: M3
    name: xxe-oob
    version: "1.0"
    title: "XML external entity, out-of-band"
    description: "Posts a minimal XML document whose single external entity is this check's callback token, and confirms the class when the parser resolved the entity (research ch03#7's out-of-band variant). The entity points at ARACHNE's own callback service — never at a file, a credential, or a third party. Opt-in (L2)."
    research_ref: ch03#7
    proof: L2
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-611
    target_kinds: [url]
    estimated_requests: 6

  - module: M3
    name: authenticated-surface
    version: '1.0'
    title: Authenticated-only web surface
    description: 'Compares the anonymous crawl with the crawl made after authenticating with the scan''s configured credential, and reports the pages added by a session: content behind a login wall, and in particular administrative or account areas that an unauthenticated client cannot reach. Runs only when the scan names a credential; it never handles the credential itself.'
    research_ref: ch03#19
    proof: L1
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-284
    target_kinds:
    - url
    estimated_requests: 4

  - module: M3
    name: session-logout
    version: '1.0'
    title: Session invalidation on logout
    description: Logs out and then re-probes the session. A logout that only clears the client's cookie leaves the server-side session usable, so a captured token keeps working and a shared or stolen session cannot be ended by the user; that is reported. Uses the logout endpoint the credential declares, or one the crawl saw the application advertise; never guesses a path.
    research_ref: ch03#19
    proof: L1
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-613
    target_kinds:
    - url
    estimated_requests: 4

  - module: M2
    name: smb-auth
