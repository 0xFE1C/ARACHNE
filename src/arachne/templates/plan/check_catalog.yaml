    estimated_requests: 0
  - module: M6
    name: lpe-discovery
    version: '1.0'
    title: Local privilege-escalation CVE matching
    description: 'Matches the estate''s fingerprinted OS/service versions (kernel, sudo, polkit, glibc) against the offline local-privilege-escalation index to surface known unprivileged-to-root paths a defender must patch before an attacker enumerates them (research ch06#16). Offline-first and read-only: it reads fingerprints and the shipped index, and never runs a privesc check on a host.'
    research_ref: ch06#16
    proof: L1
    cwe: CWE-269
    target_kinds:
    - url
    - ip
    - domain
    - cidr
    - cloud
    estimated_requests: 0
  - module: M6
    name: webshell-yara
    version: '1.0'
    title: Webshell signature and behaviour scan
    description: Scans web-visible and locally-hosted script content for webshell classes, using the corpus signature rules (eval() over request superglobals, c99/r57/b374k markers, encoded payload execution) together with behaviour heuristics (oversized single lines, encoded blocks, eval-heavy code, anomalous file timestamps) so a PHP2SHELL-class artifact is caught before a CVE-specific signature exists (research ch06#24). File-read-only; served content is GET-only.
    research_ref: ch06#24
    proof: L1
