# ARACHNE planning catalogue — the checks a scan *would* run.
#
# This file is data, not code (ADR-04) and is versioned with the
# repository. It is the input to the dry-run/plan mode (F-01-10): it lets
# `arachne scan --dry-run` print a complete, reviewable plan — modules, checks, and an
# estimated request count — without loading a single detection module or making a single
# request.
#
# Fields
#   module               M1..M6, per module group
#   name                 stable check id (kebab-case); unique per module
#   version              check version, recorded in scan reports
#   title / description  operator-facing prose for the plan and the audit trail
#   research_ref         traceability link into the research corpus (e.g. ch04#1)
#   cwe                  primary weakness class, where one is known up front
#   target_kinds         which target definition kinds the check applies to (F-01-01)
#   estimated_requests   requests the check is expected to make per applicable asset
#   proof               the check's proof-ladder declaration (L0..L4, S15/PROOF):
#                        L1 everywhere today; L2+ rows are opt-in and L3/L4 additionally
#                        require a state-change attestation (REQ-PROOF-001..004)
#   requires_active_checks
#                        true when the check performs anything beyond a plain GET —
#                        a non-GET interaction, fuzzing, or credential verification
#                        (F-01-09). Active checks are only planned when the scan opts in
#                        *and* the authorization attestation authorizes them.
#
# S3 keeps this file as the planner's input and adds the M1 rows that the module registry
# actually implements; `tests/unit/test_catalog.py` fails the build when the two
# disagree, so a plan can never describe a check differently from the code that runs it.
# S4 adds the M2 rows the registry implements; M3-M6 below are still *planned* only and the
# plan marks them `implemented: false`.
catalog_version: "1.10"
checks:
  # ---------------------------------------------------------------- M1 recon & attack surface
  # Implemented in S3 (arachne/modules/m1/). The rows below are generated from the check
  # metadata so they cannot drift from the code; tests/unit/test_registry.py fails the
  # build if they ever disagree. References are the canonical method numbers in
  # docs/research/01-reconnaissance-and-osint.md (see ADR-070.3 for the spec-05 discrepancy).
  - module: M1
    name: dork-sweep
    version: "1.0"
    title: Search-engine dork sweep
    description: Runs the versioned dork corpus (GHDB-aligned) against the configured search API and records which queries surface indexed material for the target.
    research_ref: ch01#1
    proof: L1
    cwe: CWE-200
    target_kinds: [domain, domain_pattern]
    estimated_requests: 4

  - module: M1
    name: code-secret-mining
    version: "1.0"
    title: Public code-host secret mining
    description: Queries a code-search API for configuration files and credentials referencing the target domain. Opt-in and token budgeted.
    research_ref: ch01#2
    proof: L1
    cwe: CWE-798
    target_kinds: [domain, domain_pattern, git]
    estimated_requests: 3

  - module: M1
    name: internetdb-triage
    version: "1.0"
    title: InternetDB address triage
    description: Looks up every declared address in Shodan InternetDB (keyless) for open ports, CPE fingerprints and known CVEs, before any active service scan.
    research_ref: ch01#5
    proof: L1
    cwe: CWE-1035
    target_kinds: [ip, cidr]
    estimated_requests: 1

  - module: M1
    name: ct-lookup
    version: "1.0"
    title: Certificate Transparency lookup
    description: Queries crt.sh for every certificate naming the declared domain and records the hostnames its SANs expose.
    research_ref: ch01#8
    proof: L1
    target_kinds: [domain, domain_pattern]
    estimated_requests: 1

  - module: M1
    name: passive-dns
    version: "1.0"
    title: Passive DNS history
    description: Queries a passive-DNS database for the addresses, CNAMEs, mail servers and name servers the declared name has ever resolved to.
    research_ref: ch01#11
    proof: L1
    target_kinds: [domain, domain_pattern]
    estimated_requests: 1

  - module: M1
    name: subdomain-passive
    version: "1.0"
    title: Passive subdomain aggregation
    description: Merges and de-duplicates subdomains observed by several passive sources (certificate transparency, passive DNS, web archives) into one host set.
    research_ref: ch01#13
    proof: L1
    target_kinds: [domain, domain_pattern]
    estimated_requests: 3

  - module: M1
    name: webarchive-harvest
    version: "1.0"
    title: Web archive URL harvesting
    description: Harvests historical URLs for the declared host from the Wayback Machine CDX index and the Common Crawl index, and flags archived paths that match the sensitive-path table.
    research_ref: ch01#14-16
    proof: L1
    cwe: CWE-200
    target_kinds: [domain, domain_pattern]
    estimated_requests: 2

  - module: M1
    name: email-harvest
    version: "1.0"
    title: Organization email harvesting
    description: Searches the configured search API for addresses at the target domain and infers the organization's address-generation pattern.
    research_ref: ch01#17
    proof: L1
    target_kinds: [domain, domain_pattern]
    estimated_requests: 3

  - module: M1
    name: js-asset-scan
    version: "1.0"
    title: JavaScript asset scan
    description: Fetches the page and its JavaScript bundles and extracts API endpoints, referenced assets and hardcoded credentials (reported masked).
    research_ref: ch01#26
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 3

  # ---------------------------------------------------------------- M2 network & services
  # Implemented in S4 (arachne/modules/m2/). Generated from the check metadata, so it cannot
  # drift from the code (tests/unit/test_registry.py enforces this parity for every module).
  # research_ref values are the canonical method numbers in
  # docs/research/02-active-scanning-and-enumeration.md (see ADR-080.3 for the spec-05
  # discrepancy). estimated_requests is per applicable asset: the M2 checks form a pipeline
  # and the shared inventory gates the work each one actually does.
  - module: M2
    name: host-discovery
    version: "1.0"
    title: Host discovery
    description: >-
      Determines which addresses in the declared ranges are alive, combining an ICMP echo probe with a TCP connect sweep over a few common ports (a host that drops ICMP still answers TCP), and records every live host in the asset inventory.
    research_ref: ch02#1-4
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern]
    estimated_requests: 1
    requires_active_checks: true

  - module: M2
    name: port-scan
    version: "1.0"
    title: TCP port scan
    description: >-
      Probes the top-ports policy (ARACHNE_NET_MAX_PORTS, default 100) on every live host with a TCP connect scan, using python-nmap when it is installed and permitted and the pure-Python connect scanner otherwise.
    research_ref: ch02#4-7
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 1
    requires_active_checks: true

  - module: M2
    name: os-fingerprint
    version: "1.0"
    title: OS fingerprinting
    description: >-
      Infers an operating-system family for each live host from the ICMP reply TTL and from service banners, each with the observation that produced it. Best-effort by design: no probe battery and no raw-socket spoofing.
    research_ref: ch02#8
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern]
    estimated_requests: 1
    requires_active_checks: true

  - module: M2
    name: service-fingerprint
    version: "1.0"
    title: Service version detection
    description: >-
      Identifies the protocol, product and version behind every open port, using the banner the port already sent and a bounded probe suite (HTTP, TLS, Redis, memcached, MongoDB, SMTP, ...) when it did not. The result is what the CVE correlation consumes.
    research_ref: ch02#9-10
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: tls-deep-scan
    version: "1.0"
    title: TLS configuration scan
    description: >-
      Profiles every TLS endpoint M2 found: which protocol versions it negotiates, which cipher suites it accepts (probed one suite at a time), and whether its certificate is valid, trusted, correctly named and strongly keyed. Weak protocols and suites are reported with the handshake that accepted them.
    research_ref: ch02#14
    proof: L1
    cwe: CWE-327
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: snmp-enum
    version: "1.0"
    title: SNMP enumeration
    description: >-
      Probes 161/udp with a community-string catalogue (public/private plus vendor defaults) and a read-only GET on the system group, reporting readable and writable communities together with the system description, name and contacts they expose. UDP probing requires ARACHNE_NET_ALLOW_UDP in addition to this check's opt-in.
    research_ref: ch02#15
    proof: L1
    cwe: CWE-306
    target_kinds: [ip, cidr, domain, domain_pattern]
    estimated_requests: 4
    requires_active_checks: true

  - module: M2
    name: smb-enum
    version: "1.0"
    title: SMB enumeration
    description: >-
      Negotiates SMB2 to learn the supported dialects and whether message signing is required, then attempts an NTLMSSP anonymous session to establish whether the server accepts a session with no credential. Reports SMBv1 support, missing signing requirements and anonymous access; never authenticates with a credential.
    research_ref: ch02#16
    proof: L1
    cwe: CWE-200
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: nfs-enum
    version: "1.0"
    title: NFS export enumeration
    description: >-
      Dumps the portmapper/rpcbind registration table (RPCBPROC_DUMP) and then the NFS export list from mountd (MOUNTPROC_EXPORT), reporting which exports are offered and to whom. No filesystem is mounted and no file is read.
    research_ref: ch02#17
    proof: L1
    cwe: CWE-284
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: ldap-enum
    version: "1.0"
    title: LDAP anonymous bind
    description: >-
      Reads the LDAP rootDSE for the naming contexts and supported versions, then attempts an anonymous simple bind. A directory that answers an anonymous bind can be enumerated by any network client, which is the finding.
    research_ref: ch02#18
    proof: L1
    cwe: CWE-287
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: kerberos-enum
    version: "1.0"
    title: Kerberos user enumeration
    description: >-
      Sends Kerberos AS-REQ probes and reads the KDC's error code to establish which principal names exist (PREAUTH_REQUIRED means the account is real, CLIENT_UNKNOWN means it is not). Paced and capped by design: the check must not produce the lockout event it is meant to warn about.
    research_ref: ch02#19
    proof: L1
    cwe: CWE-200
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 4
    requires_active_checks: true

  - module: M2
    name: smtp-enum
    version: "1.0"
    title: SMTP enumeration
    description: >-
      Speaks EHLO to read the mail server's capabilities, then uses VRFY/EXPN (or a paced MAIL FROM/RCPT TO exchange when the verbs are disabled) against a small wordlist to establish which mailboxes exist. Bounded and paced: enumeration of existence, never a delivery or an authentication attempt.
    research_ref: ch02#20
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 6
    requires_active_checks: true

  - module: M2
    name: db-service-probe
    version: "1.0"
    title: Database service probing
    description: >-
      Fingerprints database wire protocols (MySQL, PostgreSQL, MSSQL) for product and version, and establishes whether Redis, memcached, MongoDB, Elasticsearch or CouchDB answer without authentication by reading their metadata endpoints read-only. No credential is submitted and no data is modified.
    research_ref: ch02#22-23
    proof: L1
    cwe: CWE-284
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 4
    requires_active_checks: true

  - module: M2
    name: rdp-vnc-detect
    version: "1.0"
    title: RDP/VNC detection
    description: >-
      Negotiates X.224 with RDP services to see whether NLA (CredSSP) is required, and reads the RFB security-type list from VNC services to see whether authentication is required at all. A passwordless VNC server and an RDP service without NLA are reported as findings; no credential is ever submitted.
    research_ref: ch02#25
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: ssh-enum
    version: "1.0"
    title: SSH enumeration
    description: >-
      Reads the SSH banner for the daemon's product and version, then exchanges a KEXINIT to enumerate the key-exchange, host-key, cipher and MAC algorithms the server offers. Reports deprecated algorithms (ssh-rsa/SHA-1, group1-sha1, RC4, 3DES) as findings and feeds the version to the CVE correlation.
    research_ref: ch02#24
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: dns-active
    version: "1.0"
    title: Active DNS enumeration
    description: >-
      Attempts a zone transfer (AXFR) against the zone's nameserver and then resolves a bounded dictionary of candidate subdomains over TCP, recording every name that resolves as a discovered host. A successful transfer is reported as the exposure it is.
    research_ref: ch02#28
    proof: L1
    cwe: CWE-200
    target_kinds: [domain, domain_pattern]
    estimated_requests: 3
    requires_active_checks: true

  - module: M2
    name: ics-probe
    version: "1.0"
    title: ICS/SCADA protocol probing
    description: >-
      Reads a Modbus device identification (function 0x2B) over TCP and, when UDP is enabled, sends a BACnet/IP Who-Is, reporting vendor, model and firmware of any controller that answers. Opt-in because OT protocols are unauthenticated by design and their endpoints are the most sensitive in an estate.
    research_ref: ch02#27
    proof: L1
    cwe: CWE-306
    target_kinds: [ip, cidr, domain, domain_pattern]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: cve-correlate
    version: "1.0"
    title: CVE/EPSS correlation
    description: >-
      Matches the product and version M2 fingerprinted against the offline CVE/EPSS index, and reports every known CVE whose version range the observed version falls in. Optional online enrichment through the vulners provider when the deployment has configured a key. Sends nothing to the target.
    research_ref: ch02#29
    proof: L1
    cwe: CWE-1035
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 0
    requires_active_checks: false

  # ---------------------------------------------------------------- M3 web application
  - module: M3
    name: security-headers
    version: '1.0'
    title: Security header and cookie review
    description: 'Reviews the response hardening of every crawled page (Strict-Transport-Security, Content-Security-Policy with frame-ancestors, X-Frame-Options, X-Content-Type-Options, Referrer-Policy) and the attributes of every cookie the application sets (Secure, HttpOnly, SameSite), reporting the origin''s missing controls. Read-only: it sends no payload and changes nothing.'
    research_ref: ch03#24
    proof: L1
    cwe: CWE-693
    target_kinds:
    - url
    estimated_requests: 1
  - module: M3
    name: api-surface
    version: '1.0'
    title: API and hidden endpoint surface
    description: Discovers undocumented endpoints by learning the application's own not-found response, then probing a bounded path wordlist and parsing any OpenAPI/Swagger document it finds; also reads the verbs a discovered endpoint advertises. A path only counts as a finding when its response differs from both the not-found answer and the single-page-application catch-all. GET/OPTIONS only.
    research_ref: ch03#31
    proof: L1
    cwe: CWE-200
    target_kinds:
    - url
    estimated_requests: 8
  - module: M3
    name: subdomain-takeover
    version: '1.0'
    title: Subdomain takeover of a web-facing alias
    description: 'Matches the can-i-take-over-xyz service fingerprints (GitHub Pages, Heroku, S3, Shopify, Fastly, ...) against the hosts the crawl reached: a page carrying the service''s own ''this name is not configured'' body means the alias points at a service that no longer owns it. When OSINT is enabled the CNAME chain is read too and a CNAME into a fingerprint service raises the confidence. Nothing is claimed or registered.'
    research_ref: ch03#34
    proof: L1
    cwe: CWE-350
    target_kinds:
    - url
    - domain
    - domain_pattern
    estimated_requests: 2
  - module: M3
    name: csrf-audit
    version: '1.0'
    title: CSRF protection audit
    description: 'Classifies every state-changing form the crawl found by whether it carries a per-session anti-CSRF token and whether the session cookie is SameSite-protected, and reports mutating actions reachable by GET. Read-only: this check sends no payload and submits no form.'
    research_ref: ch03#4
    proof: L1
    cwe: CWE-352
    target_kinds:
    - url
    estimated_requests: 1
  - module: M3
    name: deser-audit
    version: '1.0'
    title: Insecure deserialization audit
    description: Fingerprints serialized-object signatures (Java rO0AB, PHP serialize(), .NET BinaryFormatter, pickle) in the crawl's forms, parameters and bodies, then confirms the sink is *processed* by comparing a structurally-valid benign stream against a malformed one (a parser-reaction differential). No gadget chain is sent and nothing is deserialized for effect.
    research_ref: ch03#9
    proof: L1
    cwe: CWE-502
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  - module: M3
    name: sqli-oracle
    version: '1.0'
    title: SQL injection oracle
    description: 'Confirms that query-string parameters reach a SQL statement by differential oracles only: a single-character delta whose response carries a database error signature, a true/false predicate pair whose responses diverge, or a blocking-sleep probe whose timing exceeds the baseline. No data is read, extracted or modified.'
    research_ref: ch03#1
    proof: L1
    cwe: CWE-89
    target_kinds:
    - url
    estimated_requests: 24
    requires_active_checks: true
  - module: M3
    name: ssti-oracle
    version: '1.0'
    title: Server-side template injection oracle
    description: 'Sends the arithmetic probes of research ch03#6 ({{7*7}}, ${7*7}, <%= 7*7 %>) into every reflected parameter and confirms when the *evaluated* form (49) appears where the raw probe did not, or when an engine-specific parse error names the template library. Arithmetic only: no built-ins, no file access, no code execution.'
    research_ref: ch03#6
    proof: L1
    cwe: CWE-1336
    target_kinds:
    - url
    estimated_requests: 12
    requires_active_checks: true
  - module: M3
    name: xxe-oracle
    version: '1.0'
    title: XML external entity oracle
    description: 'Posts a minimal external-entity document to every XML-accepting endpoint and confirms the class when the parser resolved the entity: a world-readable, non-secret file''s header line is echoed, or the out-of-band callback fires. The entity never points at a credential file and nothing is exfiltrated.'
    research_ref: ch03#7
    proof: L1
    cwe: CWE-611
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: cmdi-oracle
    version: '1.0'
    title: OS command injection oracle
    description: Injects shell separators plus a harmless 'echo <nonce>' sentinel into parameters whose name suggests a command or a lookup, and confirms the class when the sentinel's output is echoed back (research ch03#8). A single blocking-sleep probe is the fallback for a blind sink. Nothing is read, written or exfiltrated.
    research_ref: ch03#8
    proof: L1
    cwe: CWE-78
    target_kinds:
    - url
    estimated_requests: 18
    requires_active_checks: true
  - module: M3
    name: xss-oracle
    version: '1.0'
    title: Cross-site scripting reflection oracle
    description: 'Sends one inert marker (an unknown element plus quote characters, unique per request) into every query-string parameter and classifies how the response reflects it: unencoded HTML, an unencoded quote inside an attribute, or a bare value inside a script block. An encoded reflection is reported as clean. The probe cannot execute in any browser, and DOM-sink verification is out of scope for this stage.'
    research_ref: ch03#3
    proof: L1
    cwe: CWE-79
    target_kinds:
    - url
    estimated_requests: 12
    requires_active_checks: true
  - module: M3
    name: traversal-oracle
    version: '1.0'
    title: Path traversal oracle
    description: 'Confirms path traversal in file-name parameters by content, not status: each encoding class (plain, URL-encoded, double-encoded, overlong, backslash, absolute) is tried against a world-readable, non-secret marker file, and a finding requires the marker''s header line in a response whose benign baseline did not contain it. Read-only: no path is written and nothing sensitive is read.'
    research_ref: ch03#11
    proof: L1
    cwe: CWE-22
    target_kinds:
    - url
    estimated_requests: 16
    requires_active_checks: true
  - module: M3
    name: open-redirect
    version: '1.0'
    title: Open redirect oracle
    description: Feeds redirect-style parameters the URL classes of research ch03#14 (absolute, scheme-relative, backslash confusion, userinfo, encoded, bare host) and reads the Location header. A finding requires the answer to point at the reserved, non-resolving probe host, so it can never redirect a user anywhere real. Redirects are not followed.
    research_ref: ch03#14
    proof: L1
    cwe: CWE-601
    target_kinds:
    - url
    estimated_requests: 12
    requires_active_checks: true
  - module: M3
    name: cors-audit
    version: '1.0'
    title: CORS configuration audit
    description: 'Sends a probe Origin header to the crawled endpoints and reads the Access-Control-Allow-Origin / Allow-Credentials pair: a reflected origin with credentials is a cross-origin read primitive, a reflected origin alone, a null acceptance and a wildcard with credentials each carry their own weight. GET only.'
    research_ref: ch03#23
    proof: L1
    cwe: CWE-942
    target_kinds:
    - url
    estimated_requests: 10
    requires_active_checks: true
  - module: M3
    name: cache-poison-audit
    version: '1.0'
    title: Web cache poisoning (unkeyed input) audit
    description: Injects a reserved marker host (arachne-cache.invalid) through headers a cache may treat as unkeyed (X-Forwarded-Host, X-Original-URL, X-HTTP-Method-Override, ...) and reports the endpoints that reflect it into the response — the unkeyed-input primitive of research ch03#17 — weighting a response that also advertises caching. It never injects live script content into a cache.
    research_ref: ch03#17
    proof: L1
    cwe: CWE-444
    target_kinds:
    - url
    estimated_requests: 12
    requires_active_checks: true
  - module: M3
    name: hpp-oracle
    version: '1.0'
    title: HTTP parameter pollution oracle
    description: 'Sends a security-relevant parameter twice with distinct values and reads the resolution oracle: when the response depends on the *order* of the duplicate values while a single value is stable, the parser resolution is ambiguous (research ch03#25) — the precondition for a WAF/application disagreement. Two bounded requests per parameter; nothing is modified.'
    research_ref: ch03#25
    proof: L1
    cwe: CWE-235
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: idor-oracle
    version: '1.0'
    title: IDOR / object-level authorization oracle
    description: 'Enumerates adjacent identifiers on object-id parameters and reports a finding only when several return distinct single-record pages that each carry a per-record identity (an email/username field). When a second session is configured the same identifier is read as both identities, and a foreign-object read is reported. Read-only: only GET requests are sent.'
    research_ref: ch03#18
    proof: L1
    cwe: CWE-639
    target_kinds:
    - url
    estimated_requests: 18
    requires_active_checks: true
  - module: M3
    name: auth-session-audit
    version: '1.0'
    title: Authentication and session handling audit
    description: Reviews the session cookie's hardening attributes, the transport a login form posts over, and whether the login response distinguishes a plausible privileged user name from a random one (user enumeration). The enumeration pass sends a single dummy password per name, is bounded to a few names and never attempts a real credential. Session fixation and logout invalidation are out of scope.
    research_ref: ch03#19
    proof: L1
    cwe: CWE-287
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: jwt-audit
    version: '1.0'
    title: JWT verification audit
    description: 'Finds JWTs the crawl delivered, decodes them, and reads verifier weaknesses without forging an identity: an unsigned (alg=none) token, an HMAC token whose signature an offline weak-secret list reproduces, and — replayed at an endpoint the crawl saw challenge a request — an unsigned token the server still accepts. Verify-only; no live brute-force and no key material is used.'
    research_ref: ch03#20
    proof: L1
    cwe: CWE-347
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: oauth-flow-audit
    version: '1.0'
    title: OAuth 2.0 flow audit
    description: 'Probes the authorization endpoint''s redirect_uri validation with the mutation classes of research ch03#21 — an appended path segment, a suffix-matched look-alike host and an userinfo confusion — and reports a mutation the server redirects an authorization to off the registered origin. Read-only: no authorization code is requested, or replayed.'
    research_ref: ch03#21
    proof: L1
    cwe: CWE-601
    target_kinds:
    - url
    estimated_requests: 10
  - module: M3
    name: saml-audit
    version: '1.0'
    title: SAML assertion signature-handling audit
    description: 'Posts an unsigned (signature-stripped) SAML assertion to the service provider''s ACS endpoint and reports an acceptance: HTTP 200 without a rejection marker, which means the SP did not verify the signature (research ch03#22). The assertion carries no real identity and no valid signature; nothing is forged.'
    research_ref: ch03#22
    proof: L1
    cwe: CWE-347
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  - module: M3
    name: mass-assign-audit
    version: '1.0'
    title: Mass assignment (property-level binding) audit
    description: 'Adds sensitive property names (role, is_admin, balance, verified, ...) to an API body the crawl found binding to an object, and reports the property whose injected value the response reflects back — the object-property over-binding gap of research ch03#26. Detection-only: the property is read from the response, never relied upon, and no durable state is created.'
    research_ref: ch03#26
    proof: L1
    cwe: CWE-915
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: proto-pollution
    version: '1.0'
    title: Prototype pollution oracle (server-observable)
    description: Injects a benign prototype key (__proto__ / constructor.prototype) carrying a unique marker through a JSON body the server merges, and reports the marker the server echoed back — the server-observable pollution oracle of research ch03#27. A headless-browser DOM-sink check is out of scope for this stage (ADR-S10-6); the check never attempts to chain the pollution to a sink.
    research_ref: ch03#27
    proof: L1
    cwe: CWE-1321
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: graphql-audit
    version: '1.0'
    title: GraphQL introspection and schema disclosure
    description: Runs the introspection query and a wrong-field suggestion probe against the GraphQL endpoints the crawl found, and reports an enabled introspection (full schema disclosure) or a field-suggestion leak (research ch03#32). Read-only queries only; no mutation is sent and no batching amplification is attempted beyond a bounded alias probe.
    research_ref: ch03#32
    proof: L1
    cwe: CWE-200
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: websocket-audit
    version: '1.0'
    title: WebSocket handshake origin validation audit
    description: 'Attempts the WebSocket upgrade handshake against the endpoints the crawl found, with a reserved attacker Origin, and reports an accepted handshake — the cross-site WebSocket hijacking precondition of research ch03#33. Read-only: the handshake is attempted (a GET with the upgrade headers) and abandoned at once; no frame is sent and no message is injected.'
    research_ref: ch03#33
    proof: L1
    cwe: CWE-1385
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  - module: M3
    name: business-logic-audit
    version: '1.0'
    title: Business-logic invariant audit
    description: 'Sends the edge values of research ch03#30 (a negative, zero or huge quantity / a client-supplied price) at the fields that drive a workflow, and reports one the application accepted where its own constraints should have refused it (a success response for a value the flow cannot honour). Detection-only: no order is created and no state is modified.'
    research_ref: ch03#30
    proof: L1
    cwe: CWE-840
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: race-oracle
    version: '1.0'
    title: Race condition (concurrent-request) oracle
    description: 'Replays a strictly bounded burst of near-simultaneous identical requests at a single-use action (redeem/coupon/claim/transfer, by path hint) and reports a double-apply: more successful responses than the limit should permit (research ch03#29). The burst size comes from ARACHNE_WEB_RACE_CONCURRENCY; the probe never performs a financial or destructive operation (GET, or a POST the crawl already found).'
    research_ref: ch03#29
    proof: L1
    cwe: CWE-362
    target_kinds:
    - url
    estimated_requests: 16
    requires_active_checks: true
  - module: M3
    name: smuggling-oracle
    version: '1.0'
    title: HTTP request smuggling (framing boundary) audit
    description: 'Reads the HTTP framing boundary of the probed endpoints: a response that carries both a proxy ``Via`` and a distinct origin ``Server`` (or an X-Backend-Server hop) sits behind the two-parser topology a CL.TE/TE.CL desync requires, and is reported as a framing-boundary risk for manual validation (research ch03#16). The check does not emit invalid framing (the shared client refuses it) and never smuggles a hostile request; it confirms surface, not exploitation.'
    research_ref: ch03#16
    proof: L1
    cwe: CWE-444
    target_kinds:
    - url
    estimated_requests: 8
    requires_active_checks: true
  - module: M3
    name: rate-limit-audit
    version: '1.0'
    title: Rate limiting and anti-automation audit
    description: 'Issues a small, fixed number of identical requests to the endpoints whose anti-automation posture matters (login, password reset, registration) and reads whether any throttling appears (429, lockout, CAPTCHA), then repeats with a rotating client-supplied forwarded-for header to test whether the control is keyed on a spoofable value. Strictly bounded: it characterizes controls and never mounts a brute-force (ARACHNE_WEB_RATE_PROBES controls the volume).'
    research_ref: ch03#35
    proof: L1
    cwe: CWE-770
    target_kinds:
    - url
    estimated_requests: 12
    requires_active_checks: true
  - module: M3
    name: upload-audit
    version: '1.0'
    title: Unrestricted file upload audit
    description: Walks the upload-validation matrix (executable extension with a mismatched content type, then polyglot-style pairs) against every multipart form the crawl found, using a single inert plain-text marker with no executable content, and reads it back to confirm whether the endpoint stored it. Requires ARACHNE_WEB_UPLOAD_PROBE=true, because storing even an inert marker is a write to the target; with the knob off the check reports itself skipped and sends nothing.
    research_ref: ch03#10
    proof: L1
    cwe: CWE-434
    target_kinds:
    - url
    estimated_requests: 6
    requires_active_checks: true
  - module: M3
    name: ssrf-probe
    version: '1.0'
    title: Server-side request forgery callback probe
    description: 'Injects an out-of-band callback URL (ARACHNE_WEB_SSRF_CALLBACK, a service on ARACHNE''s own infrastructure) into every parameter the crawl identified as a server-side fetch sink, and confirms the class when the sink reflected the callback''s nonce (in-band) or the callback service recorded the hit (out-of-band). Off by default: it needs ARACHNE_WEB_SSRF_CALLBACK, ARACHNE_WEB_SSRF_PROBE=true and the active-checks opt-in. No internal address or credential is ever targeted.'
    research_ref: ch03#5
    proof: L1
    cwe: CWE-918
    target_kinds:
    - url
    estimated_requests: 10
    requires_active_checks: true

  # ---------------------------------------------------------------- M4 misconfiguration & exposure
  - module: M4
    name: security-header-review
    version: "1.0"
    title: Security response headers missing or weak
    description: >-
      Reviews every crawled page's response headers against the hardening baseline (HSTS on HTTPS, CSP with frame-ancestors, X-Frame-Options, X-Content-Type-Options, Referrer-Policy, Permissions-Policy) and flags a CSP that names unsafe-inline/unsafe-eval/a bare wildcard. One finding per origin, because the gap is an origin-wide configuration decision.
    research_ref: ch04#16
    proof: L1
    cwe: CWE-693
    target_kinds: [url]
    estimated_requests: 1
  - module: M4
    name: cookie-flag-audit
    version: "1.0"
    title: Session cookie lacks hardening attributes
    description: >-
      Reads the structural Set-Cookie projection the HTTP client captures (name and attributes only — never the value) and reports session-like cookies missing Secure, HttpOnly or SameSite, weighted by whether the name suggests a session and whether the cookie was set over plaintext HTTP.
    research_ref: ch04#18
    proof: L1
    cwe: CWE-614
    target_kinds: [url]
    estimated_requests: 1
  - module: M4
    name: client-secrets
    version: "1.0"
    title: Credential material in client-side assets
    description: >-
      Reviews every JavaScript bundle and HTML document the crawl fetched and reports the ones whose raw bytes matched a secret detector (cloud access key, provider API token, JWT, credentialed URL, PEM key). Only the detector names and the asset's provenance are reported; the values were redacted at capture time.
    research_ref: ch04#14
    proof: L1
    cwe: CWE-798
    target_kinds: [url]
    estimated_requests: 0
  - module: M4
    name: env-file-probe
    version: "1.0"
    title: Exposed environment or configuration file
    description: >-
      Requests the well-known environment and configuration paths (.env and its variants, wp-config.php, application.properties, config.yml, ...) and reports the ones that return a file instead of a not-found page. A hit is confirmed by credential-bearing key=value lines and by the redactor's detector names; the values themselves are redacted at capture time and never reach the check.
    research_ref: ch04#1
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 8
  - module: M4
    name: vcs-exposure
    version: "1.0"
    title: Exposed version-control metadata
    description: >-
      Probes /.git/HEAD, /.git/config, /.svn/entries, /.svn/wc.db and /.hg/requires and confirms the answer by its repository markers (a ref line, a [core] block, an SVN XML/entries body, a SQLite payload). It reports the exposure only; it does not download objects or reconstruct history.
    research_ref: ch04#2
    proof: L1
    cwe: CWE-538
    target_kinds: [url]
    estimated_requests: 5
  - module: M4
    name: backup-file-hunt
    version: "1.0"
    title: Downloadable backup or dump file
    description: >-
      Combines a bounded name list with backup/dump extensions under the usual backup directories and reports the artifacts that download. A hit is confirmed by the content's own signature (SQL statements, a dotenv body, source code), by an archive/database content type, or by a binary payload where the extension is binary by nature.
    research_ref: ch04#3
    proof: L1
    cwe: CWE-530
    target_kinds: [url]
    estimated_requests: 20
  - module: M4
    name: key-exposure
    version: "1.0"
    title: Private key material exposed
    description: >-
      Probes the well-known private-key and keystore paths and reports a reachable one when the response is PEM key material (the redactor's private-key detector fired), carries a PEM header, or is served with a key-file extension and a non-HTML content type. The key's contents never enter evidence.
    research_ref: ch04#15
    proof: L1
    cwe: CWE-321
    target_kinds: [url]
    estimated_requests: 8
  - module: M4
    name: sourcemap-exposure
    version: "1.0"
    title: JavaScript source map exposed
    description: >-
      Follows the sourceMappingURL reference of every JavaScript/CSS asset the crawl fetched, requests the map, and reports it when the document carries sources or sourcesContent. Recovered original sources and any secrets the redactor detected are reported by name, never by value.
    research_ref: ch04#4
    proof: L1
    cwe: CWE-540
    target_kinds: [url]
    estimated_requests: 6
  - module: M4
    name: api-doc-exposure
    version: "1.0"
    title: API documentation exposed
    description: >-
      Probes the conventional Swagger/OpenAPI/Redoc paths, parses a document it finds (JSON or YAML), and reports the schema plus the routes it publishes. The routes are recorded as assets and added to the shared web inventory under the 'api-doc' source, so m3.api-surface replays them as part of its own endpoint coverage instead of guessing them from a wordlist.
    research_ref: ch04#5
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 8
  - module: M4
    name: debug-endpoints
    version: "1.0"
    title: Debug or diagnostic endpoint reachable
    description: >-
      Probes the fixed high-confidence debug surface: phpinfo() pages, Apache server-status/server-info, Spring Boot Actuator (including /actuator/env, /actuator/heapdump and the legacy top-level endpoints), framework debug toolbars/consoles, Prometheus /metrics and Go's /debug/vars. A hit is confirmed by the page's own markers or a stack trace; the heapdump is a hit on a binary download alone.
    research_ref: ch04#7
    proof: L1
    cwe: CWE-489
    target_kinds: [url]
    estimated_requests: 20
  - module: M4
    name: directory-listing
    version: "1.0"
    title: Directory listing enabled
    description: >-
      Requests candidate directories with and without the trailing slash and classifies the answer as an auto-generated index (Apache 'Index of', nginx 'Directory listing for', IIS '[To Parent Directory]'). The published entries are extracted as the exposure's evidence, because a listing is a free file inventory.
    research_ref: ch04#9
    proof: L1
    cwe: CWE-548
    target_kinds: [url]
    estimated_requests: 10
  - module: M4
    name: dashboard-exposure
    version: "1.0"
    title: Administrative or monitoring dashboard reachable
    description: >-
      Fingerprints the common management and observability UIs (Jenkins, Kibana, Grafana, Prometheus, Consul, phpMyAdmin, SonarQube, RabbitMQ) by path, body marker and response header, and reports each one reachable from the scanning position. It distinguishes an anonymous dashboard from one that presents a login form; the credential attempt itself belongs to m4.default-credentials.
    research_ref: ch04#11
    proof: L1
    cwe: CWE-284
    target_kinds: [url]
    estimated_requests: 12
  - module: M4
    name: hidden-endpoint-hunt
    version: "1.0"
    title: Hidden endpoint or content reachable
    description: >-
      Probes a bounded wordlist of unlinked paths (plus a few editor-artifact mutations) and reports the ones that answer differently from the application's not-found page and its single-page catch-all. Only paths that look sensitive by name or that serve a non-HTML file are reported, so the check inventories exposure rather than every route the application owns.
    research_ref: ch04#24
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 30
  - module: M4
    name: staging-exposure
    version: "1.0"
    title: Staging or development surface exposed
    description: >-
      Looks for development and staging surfaces in two places: labelled paths on the declared origin (/staging/, /dev/, /test/, ...) and crawled hosts whose name carries a staging label. A path only counts when it is reachable, is not the application's not-found page, and is not the SPA shell; a labelled host is reported from the page the crawl already fetched.
    research_ref: ch04#25
    proof: L1
    cwe: CWE-1188
    target_kinds: [url]
    estimated_requests: 10
  - module: M4
    name: unauth-api-audit
    version: "1.0"
    title: Data-bearing API route answers without authentication
    description: >-
      Replays the routes recovered from an exposed API document and the internal-looking routes the crawl found, deliberately without the operator's session, and reports a 200 JSON answer that carries records. A 401/403 is the control working and is not reported. GET only.
    research_ref: ch04#29
    proof: L1
    cwe: CWE-306
    target_kinds: [url]
    estimated_requests: 6
  - module: M4
    name: bucket-exposure
    version: "1.0"
    title: Object-storage bucket is publicly readable
    description: >-
      Probes a bucket root for an anonymous listing (<ListBucketResult>, GCS items, Azure EnumerationResults) and for a public ACL (AllUsers / allUsers / container-public-access). Cloud references are translated into the provider's public endpoint; an endpoint: reference (S3-compatible storage, or the lab fixture) is probed directly. Candidate names derived from the target's organisation label are tested with a bounded wordlist. Non-destructive: GET only, no object writes.
    research_ref: ch04#13
    proof: L1
    cwe: CWE-732
    target_kinds: [cloud, url, domain]
    estimated_requests: 16
  - module: M4
    name: cors-config-review
    version: "1.0"
    title: CORS policy allows cross-origin reads
    description: >-
      Runs the origin matrix of research ch04#19 — an arbitrary origin, the literal 'null', and a look-alike host — against the crawled JSON/API endpoints and reads Access-Control-Allow-Origin/Allow-Credentials. A reflected origin with credentials is a cross-origin read primitive; a null acceptance and a wildcard with credentials each carry their own weight. GET only.
    research_ref: ch04#19
    proof: L1
    cwe: CWE-942
    target_kinds: [url]
    estimated_requests: 9
    requires_active_checks: true
  - module: M4
    name: tls-config-review
    version: "1.0"
    title: Weak TLS configuration
    description: >-
      Profiles the TLS endpoint behind an https URL asset with the raw-network client: negotiated version and cipher, whether a deprecated protocol (SSLv3, TLS 1.0/1.1) still completes a handshake, and whether the certificate chain validates for the host name. A light review; M2's deep scan is the exhaustive one.
    research_ref: ch04#17
    proof: L1
    cwe: CWE-326
    target_kinds: [url]
    estimated_requests: 8
    requires_active_checks: true
  - module: M4
    name: email-auth-review
    version: "1.0"
    title: Email authentication missing or permissive
    description: >-
      Asks a DNS-over-HTTPS resolver for the domain's SPF, DMARC and DKIM TXT records and reports the spoofable configurations: no SPF, an SPF ending in +all/?all, no DMARC, a DMARC policy of none, and no DKIM selector answered. It is a third-party lookup, so it runs only when OSINT is enabled and the 'dns' provider is selected (safe defaults, F-02-09).
    research_ref: ch04#20
    proof: L1
    cwe: CWE-290
    target_kinds: [url, domain]
    estimated_requests: 6
  - module: M4
    name: webdav-verbs
    version: "1.0"
    title: Unsafe HTTP methods or WebDAV enabled
    description: >-
      Sends OPTIONS to read the advertised Allow set, PROPFIND to test WebDAV metadata access and TRACE to test cross-site tracing. A write verb (PUT, DELETE, MOVE, COPY, MKCOL) is reported from Allow and never exercised; nothing is uploaded, renamed or deleted.
    research_ref: ch04#21
    proof: L1
    cwe: CWE-650
    target_kinds: [url]
    estimated_requests: 9
    requires_active_checks: true
  - module: M4
    name: user-enumeration
    version: "1.0"
    title: Username enumeration through a login differential
    description: >-
      Submits a single dummy password for a few candidate user names (plus one random name as the invalid baseline) to each credential form the crawl found, and reports a form whose answers differ by status, marker or body length. At most a handful of attempts, one password each: the check confirms that existence is observable, it never guesses a credential.
    research_ref: ch04#28
    proof: L1
    cwe: CWE-204
    target_kinds: [url]
    estimated_requests: 6
    requires_active_checks: true
  - module: M4
    name: metadata-ssrf
    version: "1.0"
    title: Cloud metadata service reachable through a request sink
    description: >-
      Injects the provider metadata URLs (AWS 169.254.169.254, GCP computeMetadata, Azure instance) into parameters the crawl identified as likely server-side fetchers and reports the posture from the sink's answer: metadata returned (IMDSv1-style, exploitable) or a 401 challenge (IMDSv2 enforced). Off by default: it needs ARACHNE_M4_METADATA_SSRF=true, an explicit check selection and the active-checks opt-in. It sends GET only and never stores a response body beyond its redacted evidence.
    research_ref: ch04#26
    proof: L1
    cwe: CWE-918
    target_kinds: [url]
    estimated_requests: 4
    requires_active_checks: true
  - module: M4
    name: default-credentials
    version: "1.0"
    title: Vendor default credentials accepted
    description: >-
      Fingerprints a management panel, then makes at most one vendor-default authentication attempt per product, paced and never retried, and reports only a successful login. Off by default: needs ARACHNE_M4_DEFAULT_CREDENTIALS=true, the check named explicitly and the active-checks opt-in. It verifies existence; it never sprays or guesses.
    research_ref: ch04#10
    proof: L1
    cwe: CWE-1392
    target_kinds: [url]
    estimated_requests: 10
    requires_active_checks: true

  # ---------------------------------------------------------------- M5 cloud, container, supply chain
  - module: M5
    name: leaked-cloud-keys
    version: '1.0'
    title: Leaked cloud credential material in artifacts
    description: Scans a local repository clone and the crawled web assets for cloud credential patterns (AWS access keys, GCP service-account JSON, Azure client secrets, PEM keys) and reports the credential *kind* and location — the values are masked and never stored. Optional read-only validation (sts:GetCallerIdentity-class) is off by default (ARACHNE_M5_VALIDATE_CLOUD_KEYS) and uses only a configured key.
    research_ref: ch05#3
    proof: L1
    cwe: CWE-798
    target_kinds:
    - git
    - cloud
    - url
    estimated_requests: 0
  - module: M5
    name: gcp-sa-keys
    version: '1.0'
    title: GCP service-account key material exposed
    description: Scans a local repository clone and crawled assets for GCP service-account key material (a JSON document with type=service_account and a private_key / client_email pair) and reports the location. The key body is masked; the check never attempts token issuance.
    research_ref: ch05#6
    proof: L1
    cwe: CWE-798
    target_kinds:
    - git
    - cloud
    - url
    estimated_requests: 0
  - module: M5
    name: iam-review
    version: '1.0'
    title: IAM over-privilege and escalation paths
    description: Reviews IAM policy documents in a local repository clone for wildcard actions/resources and privilege-escalation-relevant actions (research ch05#1). The live review (iam:List*/Get*, sts:GetCallerIdentity) requires a read-only credential and is documented in the corpus permission list; with none configured the check performs the static review only.
    research_ref: ch05#1
    proof: L1
    cwe: CWE-269
    target_kinds:
    - git
    - cloud
    estimated_requests: 0
  - module: M5
    name: cloud-posture
    version: '1.0'
    title: Cloud configuration posture and drift
    description: 'Reads a cloud-config state snapshot with one bounded read-only GET (the normalized export a read-only collector endpoint serves, or an AWS/Azure/GCP list response), evaluates the estate policies over it, and — when the deployment wires the continuous baseline store — diffs it against the last baseline and emits delta findings carrying before/after. On schedules this is the continuous mode: findings on changes, not only point-in-time state. The snapshot endpoint is declared (a URL target or endpoint:<url>); nothing is written anywhere, to the target or the cloud.'
    research_ref: ch05#1
    proof: L1
    cwe: CWE-16
    target_kinds:
    - cloud
    - url
    estimated_requests: 2
    requires_active_checks: true
  - module: M5
    name: cicd-audit
    version: '1.0'
    title: CI/CD pipeline supply-chain exposure
    description: 'Reviews a local clone''s workflow files (GitHub Actions, GitLab CI, Jenkins) for the constructs of research ch05#23: pull_request_target with secrets in scope, an untrusted github.event.* interpolated into a run step (script injection), GITHUB_TOKEN write-all, a self-hosted runner, and a third-party action pinned to a mutable ref. Read-only: it parses files and never runs a workflow.'
    research_ref: ch05#23
    proof: L1
    cwe: CWE-78
    target_kinds:
    - git
    - cloud
    estimated_requests: 0
  - module: M5
    name: dep-confusion
    version: '1.0'
    title: Dependency-confusion or typosquatting candidate
    description: 'Reads a local clone''s manifests (package.json, requirements.txt, pom.xml, ...) and flags dependencies whose name looks internal or private (a scoped or ''…-internal''/''company-'' name), which is the registration-collision candidate of research ch05#24: an attacker who registers the same name publicly gets code execution at install time. Offline by default; nothing is registered.'
    research_ref: ch05#24
    proof: L1
    cwe: CWE-427
    target_kinds:
    - git
    - cloud
    estimated_requests: 0
  - module: M5
    name: sbom-review
    version: '1.0'
    title: Known-vulnerable component in use
    description: Parses a local clone's lockfiles/manifests, matches the declared component versions against the offline known-vulnerable index (research ch05#25), and reports each component below its fixed version with the CVE and the fix version. An external scanner (Trivy/Syft-class) is used when ARACHNE_M5_SBOM_TOOL is configured. Nothing is installed or executed.
    research_ref: ch05#25
    proof: L1
    cwe: CWE-1104
    target_kinds:
    - git
    - cloud
    estimated_requests: 0
  - module: M5
    name: image-history-secrets
    version: '1.0'
    title: Secret material in image build or manifest artifacts
    description: 'Reads a local clone''s Dockerfiles for literal secret material in ENV/ARG/LABEL instructions, its Helm/Kubernetes manifests for plaintext values, and reports a container that runs as root (research ch05#17: image layers and manifests preserve secrets that were ''removed''). Values are masked; nothing is pulled or built.'
    research_ref: ch05#17
    proof: L1
    cwe: CWE-798
    target_kinds:
    - git
    - cloud
    estimated_requests: 0
  - module: M5
    name: tfstate-exposure
    version: '1.1'
    title: Terraform state exposed or IaC misconfigured
    description: 'Fetches the conventional ``.tfstate`` paths (over HTTP) and reads a local clone''s state files, and reports a state document that carries plaintext secrets or a full resource inventory (research ch05#11). The same check runs the IaC misconfiguration review (ch05#12, tfsec/checkov-class) over the clone''s .tf/manifests when it has one: security groups open to 0.0.0.0/0, wildcard IAM, public buckets, unencrypted storage, publicly accessible databases and privileged containers. Since S23 the review also parses YAML manifests and evaluates them with the *structured* Kubernetes policy rules the admission webhook runs, so the pre-deploy gate and the cluster cannot drift apart (REQ-POSTURE-002/005).'
    research_ref: ch05#11-12
    proof: L1
    cwe: CWE-312
    target_kinds:
    - cloud
    - url
    - git
    estimated_requests: 6
  - module: M5
