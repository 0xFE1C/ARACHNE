    description: "Probes the web origin for an exposed Elasticsearch, Kibana or OpenSearch Dashboards instance: ``/_cat/indices`` and ``/_cluster/health`` (Elasticsearch JSON), ``/app/kibana`` and ``/api/status`` (Kibana), and the OpenSearch Dashboards equivalents (research ch05#21). A 200 carrying the product JSON/HTML is the finding; a 401/403 is the hardened answer. GET only, read-only."
    research_ref: ch05#21
    proof: L1
    cwe: CWE-668
    target_kinds: [url]
    estimated_requests: 8

  - module: M6
    name: template-scan
    version: "1.0"
    title: Template-driven exposure match
    description: "A minimal, offline matcher: loads simple path + body-marker templates from the managed corpus, requests each template's path(s) against the asset origin and flags a response whose status and body markers match (research ch06#3). Strictly a matcher — no templating engine, no code execution, GET only."
    research_ref: ch06#3
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 10

  - module: M6
    name: exploit-match
    version: "1.0"
    title: Known N-day exploit matches observed software
    description: "Matches the estate's observed software banners and CVE ids — from the network and web crawl already in the step context, or a bounded banner fetch — against a compact offline ExploitDB-style N-day index, and reports the mapped exploit/PoC reference as a candidate (research ch06#5). Matching only: no exploitation is performed."
    research_ref: ch06#5
    proof: L1
    cwe: CWE-1104
    target_kinds: [url, domain, ip]
    estimated_requests: 2

  - module: M6
    name: credential-hunt
    version: "1.0"
    title: Credentials in reachable configuration surfaces
    description: "Hunts credentials in reachable configuration surfaces: the crawled pages/inventory the step already has plus a bounded set of .env-style paths (web.config, appsettings.json, docker-compose.yml, application.properties, shell rc files, backups), reusing the shared secret detectors and reporting the detector name and a masked fingerprint — never a raw value (research ch06#17). GET only."
    research_ref: ch06#17
    proof: L1
    cwe: CWE-798
    target_kinds: [url]
    estimated_requests: 4

  # ---------------------------------------------------------------- S15 proof ladder (area PROOF)
  # The L2 out-of-band variants and the attested L3/L4 proofs (S15, area PROOF).
  # Every row is opt-in: an L2+ declaration can never be enabled by default
  # (REQ-PROOF-001), and the L3/L4 rows additionally require the state-change
  # attestation. Title/description are generated from the check metadata so the
  # drift gate in tests/unit/test_registry.py holds verbatim.

  - module: M3
    name: cmdi-oob
    version: "1.0"
    title: "Blind OS command injection, out-of-band"
    description: "Injects shell separators plus the allowlisted one-shot echo text ('echo arachne-<nonce>') into parameters whose name suggests a command sink, and confirms the class when an execution monitor reports the echo to this check's callback token (research ch03#8's blind variant). The payload is the ladder's single allowlisted command; nothing else is ever sent. Opt-in (L2)."
    research_ref: ch03#8
    proof: L2
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-78
    target_kinds: [url]
    estimated_requests: 6

  - module: M3
    name: rce-echo
    version: "1.0"
    title: "One-shot command execution proof"
    description: "Executes exactly one benign, allowlisted command — 'echo arachne-<nonce>' — through the strongest command sink the crawl identified, and reports the echoed nonce as proof of execution (REQ-PROOF-007). There is no parameter that could carry a different command; the output is captured redacted and the execution is audited. Requires the RCE probe switch, the active-checks opt-in AND an attestation that authorizes state changes (L3)."
    research_ref: ch03#8
    proof: L3
    requires_state_attestation: true
    requires_active_checks: true
    cwe: CWE-78
    target_kinds: [url]
    estimated_requests: 3

  - module: M3
    name: sqli-oob
    version: "1.0"
    title: "Blind SQL injection, out-of-band"
    description: "Injects a predicate that carries this check's out-of-band callback token into parameters whose name suggests a SQL sink, and confirms the class when the back-end resolved the predicate and reached the token (research ch03#1's out-of-band oracle). No sleep, no data read or extracted: the single hit is the proof, and it is matched single-use to this finding. Opt-in (L2)."
    research_ref: ch03#1
    proof: L2
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-89
    target_kinds: [url]
    estimated_requests: 4

  - module: M3
    name: ssti-oob
    version: "1.0"
    title: "Server-side template injection, out-of-band"
    description: "Injects an arithmetic-only template that also references this check's callback token into parameters on rendering endpoints, and confirms the class when the template engine evaluated the content and reached the token (the SSTI→SSRF primitive, research ch03#6). The template payload is inert arithmetic plus the token reference — no built-ins, no attribute chains. Opt-in (L2)."
    research_ref: ch03#6
    proof: L2
    requires_state_attestation: false
    requires_active_checks: true
    cwe: CWE-1336
    target_kinds: [url]
    estimated_requests: 4

  - module: M3
    name: state-marker
    version: "1.0"
    title: "State-change proof (marker row)"
    description: "Proves write access with the ladder's minimal footprint: an INSERT of one calm marker row into arachne_poc (or the obviously-fake record the deployment names), verification that it is visible, an automatic restore, and re-verification that it is gone (REQ-PROOF-008). DELETE/DROP/TRUNCATE/ALTER/GRANT and multi-statement payloads are refused in code; identity stores are refused outright. Requires the state probe switch, the active-checks opt-in AND an attestation that authorizes state changes (L4)."
    research_ref: ch03#1
    proof: L4
    requires_state_attestation: true
    requires_active_checks: true
    cwe: CWE-89
    target_kinds: [url]
