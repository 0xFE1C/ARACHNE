# ARACHNE planning catalogue — the checks a scan *would* run.
#
# This file is data, not code (ADR-04) and is versioned with the
# repository. It is the input to the dry-run/plan mode (F-01-10): it lets
# `arachne scan --dry-run` print a complete, reviewable plan — modules, checks, and an
# estimated request count — without loading a single detection module or making a single
# request.
#
# Fields
#   module               M1..M6, per module group
#   name                 stable check id (kebab-case); unique per module
#   version              check version, recorded in scan reports
#   title / description  operator-facing prose for the plan and the audit trail
#   research_ref         traceability link into the research corpus (e.g. ch04#1)
#   cwe                  primary weakness class, where one is known up front
#   target_kinds         which target definition kinds the check applies to (F-01-01)
#   estimated_requests   requests the check is expected to make per applicable asset
#   proof               the check's proof-ladder declaration (L0..L4, S15/PROOF):
#                        L1 everywhere today; L2+ rows are opt-in and L3/L4 additionally
#                        require a state-change attestation (REQ-PROOF-001..004)
#   requires_active_checks
#                        true when the check performs anything beyond a plain GET —
#                        a non-GET interaction, fuzzing, or credential verification
#                        (F-01-09). Active checks are only planned when the scan opts in
#                        *and* the authorization attestation authorizes them.
#
# S3 keeps this file as the planner's input and adds the M1 rows that the module registry
# actually implements; `tests/unit/test_catalog.py` fails the build when the two
# disagree, so a plan can never describe a check differently from the code that runs it.
# S4 adds the M2 rows the registry implements; M3-M6 below are still *planned* only and the
# plan marks them `implemented: false`.
catalog_version: "1.22"
checks:
  # ---------------------------------------------------------------- M1 recon & attack surface
  # Implemented in S3 (arachne/modules/m1/). The rows below are generated from the check
  # metadata so they cannot drift from the code; tests/unit/test_registry.py fails the
  # build if they ever disagree. References are the canonical method numbers in
  # docs/research/01-reconnaissance-and-osint.md (see ADR-070.3 for the spec-05 discrepancy).
  - module: M1
    name: dork-sweep
    version: "1.0"
    title: Search-engine dork sweep
    description: Runs the versioned dork corpus (GHDB-aligned) against the configured search API and records which queries surface indexed material for the target.
    research_ref: ch01#1
    proof: L1
    cwe: CWE-200
    target_kinds: [domain, domain_pattern]
    estimated_requests: 4

  - module: M1
    name: code-secret-mining
    version: "1.0"
    title: Public code-host secret mining
    description: Queries a code-search API for configuration files and credentials referencing the target domain. Opt-in and token budgeted.
    research_ref: ch01#2
    proof: L1
    cwe: CWE-798
    target_kinds: [domain, domain_pattern, git]
    estimated_requests: 3

  - module: M1
    name: internetdb-triage
    version: "1.0"
    title: InternetDB address triage
    description: Looks up every declared address in Shodan InternetDB (keyless) for open ports, CPE fingerprints and known CVEs, before any active service scan.
    research_ref: ch01#5
    proof: L1
    cwe: CWE-1035
    target_kinds: [ip, cidr]
    estimated_requests: 1

  - module: M1
    name: ct-lookup
    version: "1.0"
    title: Certificate Transparency lookup
    description: Queries crt.sh for every certificate naming the declared domain and records the hostnames its SANs expose.
    research_ref: ch01#8
    proof: L1
    target_kinds: [domain, domain_pattern]
    estimated_requests: 1

  - module: M1
    name: passive-dns
    version: "1.0"
    title: Passive DNS history
    description: Queries a passive-DNS database for the addresses, CNAMEs, mail servers and name servers the declared name has ever resolved to.
    research_ref: ch01#11
    proof: L1
    target_kinds: [domain, domain_pattern]
    estimated_requests: 1

  - module: M1
    name: subdomain-passive
    version: "1.0"
    title: Passive subdomain aggregation
    description: Merges and de-duplicates subdomains observed by several passive sources (certificate transparency, passive DNS, web archives) into one host set.
    research_ref: ch01#13
    proof: L1
    target_kinds: [domain, domain_pattern]
    estimated_requests: 3

  - module: M1
    name: webarchive-harvest
    version: "1.0"
    title: Web archive URL harvesting
    description: Harvests historical URLs for the declared host from the Wayback Machine CDX index and the Common Crawl index, and flags archived paths that match the sensitive-path table.
    research_ref: ch01#14-16
    proof: L1
    cwe: CWE-200
    target_kinds: [domain, domain_pattern]
    estimated_requests: 2

  - module: M1
    name: email-harvest
    version: "1.0"
    title: Organization email harvesting
    description: Searches the configured search API for addresses at the target domain and infers the organization's address-generation pattern.
    research_ref: ch01#17
    proof: L1
    target_kinds: [domain, domain_pattern]
    estimated_requests: 3

  - module: M1
    name: js-asset-scan
    version: "1.0"
    title: JavaScript asset scan
    description: Fetches the page and its JavaScript bundles and extracts API endpoints, referenced assets and hardcoded credentials (reported masked).
    research_ref: ch01#26
    proof: L1
    cwe: CWE-200
    target_kinds: [url]
    estimated_requests: 3

  # ---------------------------------------------------------------- M2 network & services
  # Implemented in S4 (arachne/modules/m2/). Generated from the check metadata, so it cannot
  # drift from the code (tests/unit/test_registry.py enforces this parity for every module).
  # research_ref values are the canonical method numbers in
  # docs/research/02-active-scanning-and-enumeration.md (see ADR-080.3 for the spec-05
  # discrepancy). estimated_requests is per applicable asset: the M2 checks form a pipeline
  # and the shared inventory gates the work each one actually does.
  - module: M2
    name: host-discovery
    version: "1.0"
    title: Host discovery
    description: >-
      Determines which addresses in the declared ranges are alive, combining an ICMP echo probe with a TCP connect sweep over a few common ports (a host that drops ICMP still answers TCP), and records every live host in the asset inventory.
    research_ref: ch02#1-4
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern]
    estimated_requests: 1
    requires_active_checks: true

  - module: M2
    name: port-scan
    version: "1.0"
    title: TCP port scan
    description: >-
      Probes the top-ports policy (ARACHNE_NET_MAX_PORTS, default 100) on every live host with a TCP connect scan, using python-nmap when it is installed and permitted and the pure-Python connect scanner otherwise.
    research_ref: ch02#4-7
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 1
    requires_active_checks: true

  - module: M2
    name: os-fingerprint
    version: "1.0"
    title: OS fingerprinting
    description: >-
      Infers an operating-system family for each live host from the ICMP reply TTL and from service banners, each with the observation that produced it. Best-effort by design: no probe battery and no raw-socket spoofing.
    research_ref: ch02#8
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern]
    estimated_requests: 1
    requires_active_checks: true

  - module: M2
    name: service-fingerprint
    version: "1.0"
    title: Service version detection
    description: >-
      Identifies the protocol, product and version behind every open port, using the banner the port already sent and a bounded probe suite (HTTP, TLS, Redis, memcached, MongoDB, SMTP, ...) when it did not. The result is what the CVE correlation consumes.
    research_ref: ch02#9-10
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: tls-deep-scan
    version: "1.0"
    title: TLS configuration scan
    description: >-
      Profiles every TLS endpoint M2 found: which protocol versions it negotiates, which cipher suites it accepts (probed one suite at a time), and whether its certificate is valid, trusted, correctly named and strongly keyed. Weak protocols and suites are reported with the handshake that accepted them.
    research_ref: ch02#14
    proof: L1
    cwe: CWE-327
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: snmp-enum
    version: "1.0"
    title: SNMP enumeration
    description: >-
      Probes 161/udp with a community-string catalogue (public/private plus vendor defaults) and a read-only GET on the system group, reporting readable and writable communities together with the system description, name and contacts they expose. UDP probing requires ARACHNE_NET_ALLOW_UDP in addition to this check's opt-in.
    research_ref: ch02#15
    proof: L1
    cwe: CWE-306
    target_kinds: [ip, cidr, domain, domain_pattern]
    estimated_requests: 4
    requires_active_checks: true

  - module: M2
    name: smb-enum
    version: "1.0"
    title: SMB enumeration
    description: >-
      Negotiates SMB2 to learn the supported dialects and whether message signing is required, then attempts an NTLMSSP anonymous session to establish whether the server accepts a session with no credential. Reports SMBv1 support, missing signing requirements and anonymous access; never authenticates with a credential.
    research_ref: ch02#16
    proof: L1
    cwe: CWE-200
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: nfs-enum
    version: "1.0"
    title: NFS export enumeration
    description: >-
      Dumps the portmapper/rpcbind registration table (RPCBPROC_DUMP) and then the NFS export list from mountd (MOUNTPROC_EXPORT), reporting which exports are offered and to whom. No filesystem is mounted and no file is read.
    research_ref: ch02#17
    proof: L1
    cwe: CWE-284
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: ldap-enum
    version: "1.0"
    title: LDAP anonymous bind
    description: >-
      Reads the LDAP rootDSE for the naming contexts and supported versions, then attempts an anonymous simple bind. A directory that answers an anonymous bind can be enumerated by any network client, which is the finding.
    research_ref: ch02#18
    proof: L1
    cwe: CWE-287
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: kerberos-enum
    version: "1.0"
    title: Kerberos user enumeration
    description: >-
      Sends Kerberos AS-REQ probes and reads the KDC's error code to establish which principal names exist (PREAUTH_REQUIRED means the account is real, CLIENT_UNKNOWN means it is not). Paced and capped by design: the check must not produce the lockout event it is meant to warn about.
    research_ref: ch02#19
    proof: L1
    cwe: CWE-200
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 4
    requires_active_checks: true

  - module: M2
    name: smtp-enum
    version: "1.0"
    title: SMTP enumeration
    description: >-
      Speaks EHLO to read the mail server's capabilities, then uses VRFY/EXPN (or a paced MAIL FROM/RCPT TO exchange when the verbs are disabled) against a small wordlist to establish which mailboxes exist. Bounded and paced: enumeration of existence, never a delivery or an authentication attempt.
    research_ref: ch02#20
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 6
    requires_active_checks: true

  - module: M2
    name: db-service-probe
    version: "1.0"
    title: Database service probing
    description: >-
      Fingerprints database wire protocols (MySQL, PostgreSQL, MSSQL) for product and version, and establishes whether Redis, memcached, MongoDB, Elasticsearch or CouchDB answer without authentication by reading their metadata endpoints read-only. No credential is submitted and no data is modified.
    research_ref: ch02#22-23
    proof: L1
    cwe: CWE-284
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 4
    requires_active_checks: true

  - module: M2
    name: rdp-vnc-detect
    version: "1.0"
    title: RDP/VNC detection
    description: >-
      Negotiates X.224 with RDP services to see whether NLA (CredSSP) is required, and reads the RFB security-type list from VNC services to see whether authentication is required at all. A passwordless VNC server and an RDP service without NLA are reported as findings; no credential is ever submitted.
    research_ref: ch02#25
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: ssh-enum
    version: "1.0"
    title: SSH enumeration
    description: >-
      Reads the SSH banner for the daemon's product and version, then exchanges a KEXINIT to enumerate the key-exchange, host-key, cipher and MAC algorithms the server offers. Reports deprecated algorithms (ssh-rsa/SHA-1, group1-sha1, RC4, 3DES) as findings and feeds the version to the CVE correlation.
    research_ref: ch02#24
    proof: L1
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: dns-active
    version: "1.0"
    title: Active DNS enumeration
    description: >-
      Attempts a zone transfer (AXFR) against the zone's nameserver and then resolves a bounded dictionary of candidate subdomains over TCP, recording every name that resolves as a discovered host. A successful transfer is reported as the exposure it is.
    research_ref: ch02#28
    proof: L1
    cwe: CWE-200
    target_kinds: [domain, domain_pattern]
    estimated_requests: 3
    requires_active_checks: true

  - module: M2
    name: ics-probe
    version: "1.0"
    title: ICS/SCADA protocol probing
    description: >-
      Reads a Modbus device identification (function 0x2B) over TCP and, when UDP is enabled, sends a BACnet/IP Who-Is, reporting vendor, model and firmware of any controller that answers. Opt-in because OT protocols are unauthenticated by design and their endpoints are the most sensitive in an estate.
    research_ref: ch02#27
    proof: L1
    cwe: CWE-306
    target_kinds: [ip, cidr, domain, domain_pattern]
    estimated_requests: 2
    requires_active_checks: true

  - module: M2
    name: cve-correlate
    version: "1.0"
    title: CVE/EPSS correlation
    description: >-
      Matches the product and version M2 fingerprinted against the offline CVE/EPSS index, and reports every known CVE whose version range the observed version falls in. Optional online enrichment through the vulners provider when the deployment has configured a key. Sends nothing to the target.
    research_ref: ch02#29
    proof: L1
    cwe: CWE-1035
    target_kinds: [ip, cidr, domain, domain_pattern, url]
    estimated_requests: 0
    requires_active_checks: false

  # ---------------------------------------------------------------- M3 web application
  - module: M2
    name: redfish-service-root-exposed
    version: '1.0'
    title: BMC Redfish management API answers without authentication
    description: 'Requests the Redfish service root a baseboard management controller publishes and reports it when the controller''s own service document is served to an unauthenticated caller. The baseboard controller is the machine''s out-of-band control plane: it can power the host off, mount virtual media and read the sensor and firmware inventory, so an unauthenticated service root is a management interface reachable by anyone who can route to it. Read-only GET; nothing is powered, mounted or reset.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 2
    requires_active_checks: true
  - module: M2
    name: redfish-systems-exposed
    version: '1.0'
    title: BMC Redfish system inventory readable without authentication
    description: 'Requests the Redfish computer-system collection and reports it when the controller answers unauthenticated with the collection''s own document. It names the managed hosts, their power state, their boot order and their firmware inventory — the mapping an attacker wants before touching the hardware. A different claim from the service-root check: the root proves the API answers, this proves the host inventory is readable. Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 2
    requires_active_checks: true
  - module: M2
    name: container-api-info-exposed
    version: '1.0'
    title: Container daemon API answers without authentication (daemon configuration)
    description: 'Performs a single read-only GET of the container daemon''s own information document and reports it when the daemon answers with that document (confirmed by its own fields: the root directory, the running-container counter, the server version). Nothing else is asked of the daemon: no container is listed, started, stopped, inspected or exec''d, and no image is pulled — the evidence records ``command_issued: false``. An unauthenticated daemon socket is a remote-control interface, so the read proves reachability and deliberately stops at the door. This is a different claim from ``m4.docker-api-exposed``, which reads the version endpoint alone. Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 3
    requires_active_checks: true
  - module: M2
    name: etcd-version-exposed
    version: '1.0'
    title: etcd key-value store answers without authentication
    description: 'Requests the etcd version endpoint and reports it when the store answers unauthenticated with its own version document. etcd is the cluster''s source of truth — Kubernetes stores every object it holds there, often including service account tokens — so an API that answers without a client certificate or token is a data-exposure finding rather than a banner. Only the version document is read; no key is listed and no value is returned. Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 1
    requires_active_checks: true
  - module: M2
    name: etcd-members-exposed
    version: '1.0'
    title: etcd cluster membership readable without authentication
    description: 'Requests etcd''s member list and reports it when the store answers unauthenticated with the cluster''s own membership document. The list names every node of the quorum and their peer and client URLs — the topology needed to move against the rest of the cluster — while returning no stored data at all. It is a deliberately different claim from the version check: this one is readable even where the version endpoint is filtered. Read-only GET; no key is listed.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 1
    requires_active_checks: true
  - module: M2
    name: consul-catalog-exposed
    version: '1.0'
    title: Consul service catalog answers without authentication
    description: 'Requests Consul''s service catalog and reports it when the agent answers unauthenticated with the catalog document. The catalog names every registered service, the tags that describe them and their health — the service mesh''s own inventory — and an agent that answers it without an ACL token also answers its KV store, so this is the exposure that makes the rest reachable. Read-only GET; no KV value is returned.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 1
    requires_active_checks: true
  - module: M2
    name: consul-kv-keys-exposed
    version: '1.0'
    title: Consul KV key names readable without authentication
    description: 'Requests the *names* of Consul''s KV entries (the ``?keys`` projection) and reports it when the agent answers unauthenticated. Only key names and their folder structure are read — no value is requested and none can be returned by this projection — because the names alone disclose the configuration layout an operator keeps in the KV store (per-service settings, feature flags, and often the paths that hold credentials). Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 1
    requires_active_checks: true
  - module: M2
    name: vault-seal-status-exposed
    version: '1.0'
    title: Vault management endpoint answers without authentication
    description: 'Requests Vault''s seal-status document and reports it when the server answers unauthenticated. Vault is the secrets store, and its management endpoints are meant to be unreachable without a token; an answer that carries the server''s own seal/initialization state proves the management API is exposed from the scanning position. The check reads the status document only — no secret path is requested and no token is presented. Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 2
    requires_active_checks: true
  - module: M2
    name: vault-auth-methods-exposed
    version: '1.0'
    title: Vault auth-method configuration readable without authentication
    description: 'Requests Vault''s auth-method listing and reports it when the server answers unauthenticated with the mount document. The listing names every enabled auth method — the LDAP, Kubernetes and AppRole mounts included — which is the map of how an attacker would try to obtain a token, and it is a management read that normally requires a root token. No secret path is read and no credential is presented. Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 2
    requires_active_checks: true
  - module: M2
    name: zookeeper-admin-stat-exposed
    version: '1.0'
    title: ZooKeeper AdminServer answers without authentication
    description: 'Requests the ZooKeeper AdminServer''s stat report and reports it when the server answers unauthenticated with its own version and mode lines. The AdminServer publishes the ensemble''s role, its clients, its latency and its outstanding requests; an unauthenticated caller also reaches the four-letter administration words, so this is a coordination-service exposure rather than a banner. Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 2
    requires_active_checks: true
  - module: M2
    name: zookeeper-monitor-exposed
    version: '1.0'
    title: ZooKeeper monitor four-letter word answers without authentication
    description: 'Issues the read-only ``mntr`` four-letter word — the monitor report, whose whole output is the server''s version, role and counters — and reports it when the ensemble answers it without authentication. The four-letter words are the reason ZooKeeper''s client port belongs on an internal network: once unauthenticated, the administration half of that vocabulary is reachable too. Only ``mntr`` is sent; no administration word is issued. Read-only command.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 1
    requires_active_checks: true
  - module: M2
    name: kafka-topics-exposed
    version: '1.0'
    title: Kafka REST proxy answers its topic list without authentication
    description: 'Requests the topic list from the Kafka REST proxy and reports it when the proxy answers unauthenticated with the broker''s own topic names. The topic names are the event backbone''s data model — who publishes what — and a REST proxy that serves the list also serves the produce endpoint, which is why the list is the finding rather than the banner. The check reads the list only; no message is produced, consumed or acked and no topic is created or deleted. Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 1
    requires_active_checks: true
  - module: M2
    name: kafka-brokers-exposed
    version: '1.0'
    title: Kafka REST proxy answers its broker list without authentication
    description: 'Requests the broker list from the Kafka REST proxy and reports it when the proxy answers unauthenticated with the cluster''s own broker documents. Each broker record names its host and port, so the answer maps the cluster''s nodes — useful even where the topic list itself is filtered. No message, consumer group or offset is requested. Read-only GET.'
    research_ref: ch02#22
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 1
    requires_active_checks: true
  - module: M2
    name: elasticsearch-cluster-exposed
    version: '1.0'
    title: Elasticsearch cluster API answers without authentication
    description: 'Requests the Elasticsearch cluster-health document and reports it when the cluster answers unauthenticated with its own fields. Elasticsearch holds logs, traces and often application data, and an API that serves the cluster document without a credential also serves ``_search``, so this is the exposure that makes the stored documents reachable. A different claim from ``m2.db-service-probe``, which reads the service root and the index list. No search is performed and no document is read or written. Read-only GET.'
    research_ref: ch02#23
    proof: L1
    cwe: CWE-306
    target_kinds:
    - ip
    - cidr
    - domain
    - domain_pattern
    - url
    estimated_requests: 1
    requires_active_checks: true
  - module: M2
    name: elasticsearch-nodes-exposed
    version: '1.0'
    title: Elasticsearch node inventory readable without authentication
    description: 'Requests the cluster''s node view and reports it when the cluster answers unauthenticated with the nodes'' own records. Each line names a node, its address, its role and its heap and disk pressure — the cluster''s topology and the sizing an operator would not publish. It is a deliberate second claim: a deployment can filter the index list and still serve the node view. No search is performed. Read-only GET.'
