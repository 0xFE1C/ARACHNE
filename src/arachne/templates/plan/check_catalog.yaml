    description: Reads the schema and asks each query field whose name suggests an authenticated resource for its __typename with no credential presented, with a query for a field that cannot exist as the control. Data from the first and an error from the second is the anonymous-resolver-access pattern. Only the introspection meta-field is selected, so no document content is requested.
    research_ref: ch03#32
    proof: L1
    cwe: CWE-862
    target_kinds:
