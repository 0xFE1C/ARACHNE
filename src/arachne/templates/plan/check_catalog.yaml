    description: Completes the WebSocket upgrade at the endpoints the crawl found while presenting no credential of any kind (no Authorization, Cookie, subprotocol token or demo session), verifying the RFC 6455 accept derivation of the key it sent and using a plain GET of the same path as the upgrade-only control. An upgrade that succeeds without a credential means the connection is never authenticated.
