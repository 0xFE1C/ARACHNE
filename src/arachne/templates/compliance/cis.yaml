# ARACHNE compliance map — CIS Controls v8.1 (S22, REQ-TRUST-001).
#
# This file is data, not code (ADR-04): it maps ARACHNE check ids onto the CIS
# safeguards a finding is evidence about. The shape is validated by
# `tests/unit/test_compliance_map.py`, which guarantees the two directions an
# auditor cares about:
#
#   * every `checks:` entry is a real check id in the shipped planning catalogue —
#     no dangling ids, so a control can never claim coverage from a typo; and
#   * every control id is unique inside its framework.
#
# An unmapped safeguard is *deliberately absent*: `total_controls` records the
# framework's own control count (153 safeguards in v8.1), so a framework report can
# state the gap honestly — "this scan assesses N of 153 safeguards; the remainder are
# outside ARACHNE's check catalogue" — instead of implying the framework was covered.
#
# A check id is `m<module>.<name>` (the id every finding carries). One check may
# evidence several safeguards; one safeguard may be evidenced by several checks.
#
# Editing this file is a governance act: a new check id must exist in
# `templates/plan/check_catalog.yaml` (and the registry) first, or the schema test
# fails the build.

framework: cis
name: CIS Controls v8
edition: v8.1
kind: safeguard
total_controls: 153
map_version: "1.0"
