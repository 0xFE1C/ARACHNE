# ARACHNE compliance map — ISO/IEC 27001:2022 Annex A (S22, REQ-TRUST-001).
#
# Same contract as cis.yaml: check ids must exist in the shipped planning catalogue
# (no dangling ids — `tests/unit/test_compliance_map.py` fails the build otherwise),
# control ids are unique, and `total_controls` states the framework's own size (93
# Annex A controls in the 2022 edition) so a framework report can name the gap
# explicitly instead of implying coverage.
#
# ISO 27001 is a management-system standard: a technical check can only ever be
# *evidence about* a control's operation, never proof of ISMS conformity. The
# framework report says exactly that.

framework: iso27001
name: ISO/IEC 27001:2022 Annex A
edition: "2022"
kind: control
total_controls: 93
map_version: "1.0"
controls:
  - id: A.5.17
    title: Authentication information
    checks:
      - m4.key-exposure
      - m4.client-secrets
      - m4.env-file-probe
      - m5.leaked-cloud-keys
      - m5.gcp-sa-keys
      - m5.image-history-secrets
      - m1.code-secret-mining

  - id: A.5.23
    title: Information security for use of cloud services
    checks:
      - m5.bucket-enumerator
      - m5.leaked-cloud-keys
      - m5.iam-review
      - m5.firebase-rules
      - m5.k8s-exposure

  - id: A.8.2
    title: Privileged access rights
    checks:
      - m4.dashboard-exposure
      - m4.actuator-exposure
      - m4.unauth-api-audit
      - m5.iam-review
      - m3.idor-oracle

  - id: A.8.5
    title: Secure authentication
    checks:
      - m3.auth-session-audit
      - m3.jwt-audit
      - m3.session-logout
      - m4.default-credentials
      - m4.user-enumeration
      - m2.smb-auth

  - id: A.8.7
    title: Protection against malware
    checks:
      - m6.webshell-yara

  - id: A.8.8
    title: Management of technical vulnerabilities
    checks:
      - m2.cve-correlate
      - m6.cve-epss-correlation
      - m6.exploit-match
      - m6.template-scan

  - id: A.8.9
    title: Configuration management
    checks:
      - m4.security-header-review
      - m4.cors-config-review
      - m4.cookie-flag-audit
      - m4.tls-config-review
      - m5.k8s-exposure

  - id: A.8.12
    title: Data leakage prevention
    checks:
      - m1.bucket-hunt
      - m4.backup-file-hunt
      - m4.bucket-exposure
      - m4.vcs-exposure
      - m4.sourcemap-exposure
      - m3.api-surface
      - m4.api-doc-exposure

  - id: A.8.15
    title: Logging
    checks:
      - m3.auth-session-audit

  - id: A.8.16
    title: Monitoring activities
    checks:
      - m1.service-exposure-drift
      - m6.deception-listeners

  - id: A.8.20
    title: Networks security
    checks:
      - m2.legacy-services
      - m2.ftp-anonymous
      - m4.tls-config-review

  - id: A.8.24
    title: Use of cryptography
    checks:
      - m2.tls-deep-scan
      - m4.tls-config-review
      - m3.jwt-audit

  - id: A.8.25
    title: Secure development life cycle
    checks:
      - m3.sqli-oracle
      - m3.xss-oracle
      - m3.cmdi-oracle
      - m3.ssti-oracle
      - m3.xxe-oracle
      - m3.traversal-oracle

  - id: A.8.26
    title: Application security requirements
    checks:
      - m3.security-headers
      - m3.csrf-audit
      - m3.cors-audit

  - id: A.8.28
    title: Secure coding
    checks:
      - m3.mass-assign-audit
      - m3.proto-pollution
      - m3.business-logic-audit
      - m3.hpp-oracle

  - id: A.8.31
    title: Separation of development, test and production environments
    checks:
      - m4.staging-exposure
      - m4.debug-endpoints
