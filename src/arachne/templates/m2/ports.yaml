# ARACHNE M2 port catalogue — managed data, not code (docs/spec/07- §4).
#
# Two consumers read this file:
#   * `m2.port-scan` uses `tcp` (frequency order) as its **default top-ports policy** and
#     `udp` as the curated UDP set it uses when UDP probing is opted in (F-01-09). The
#     order is the rank: `ARACHNE_NET_MAX_PORTS` truncates the list, so the default scan is
#     "the N most likely TCP ports", exactly like `nmap --top-ports N`.
#   * `m2.service-fingerprint` uses `probe` as the *hint* for how to identify a service on
#     an open port. A hint is only a priority: the fingerprinter falls back to its generic
#     probe suite when the hinted protocol does not answer, which is what lets it identify
#     Redis on 56379 or SSH on 2222 as readily as on the canonical port.
#
# `service` is a neutral protocol name (used in evidence and in the CVE correlation key);
# it is deliberately not a product name — products come from banners, not from port numbers.
catalog_version: "1.0"
source: >-
  Nmap-services frequency head (research ch02#7 "top-ports vs full range") plus the
  protocol-interest ports the M2 checks can identify (datastores, directory services,
  remote desktop, ICS). Port numbers are hints; the fingerprinter confirms every one.
