      - text: "Row-level security is not enabled (or not restrictive) for the anonymous role, so the public anon key can read the table."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.tfstate
    match: {check: ["m5.tfstate-exposure"]}
    rule: cloud.tfstate
    sections:
      - text: "{title}: a Terraform state document is exposed ({evidence.artifact.location or evidence.artifact.path}) ({research_ref})."
