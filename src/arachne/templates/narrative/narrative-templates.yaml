      - text: "An unauthenticated Docker API grants host takeover: a container can be created with the host filesystem mounted."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.docker-socket
