    sections:
      - text: "{title}: {evidence.artifact.location} contains {evidence.artifact.kind} credential material ({research_ref})."
      - text: "A credential in a repository, image or artifact must be treated as public; if it is live it grants whatever the identity can do."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.imds
    match: {check: ["m5.imds-ssrf"]}
    rule: cloud.imds
    sections:
      - text: "{title}: the fetch sink '{evidence.artifact.sink}' at {evidence.artifact.endpoint} returned {evidence.artifact.provider} metadata (posture: {evidence.artifact.posture}) ({research_ref})."
      - text: "IMDSv1-style metadata returns the instance's temporary credentials; IMDSv2 requires a token that the sink cannot obtain."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.azure-mi
    match: {check: ["m5.azure-mi-audit"]}
    rule: cloud.azure-mi
    sections:
      - text: "{title}: the fetch sink '{evidence.artifact.sink}' at {evidence.artifact.endpoint} returned the Azure {evidence.artifact.document} document ({research_ref})."
      - text: "Azure IMDS mints OAuth2 tokens for the managed identity with only a Metadata header, so a reachable sink can obtain tokens for Key Vault, Storage or the management plane."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.gcp-sa
    match: {check: ["m5.gcp-sa-keys"]}
    rule: cloud.gcp-sa
    sections:
      - text: "{title}: {evidence.artifact.location} contains a GCP service-account key document ({research_ref})."
      - text: "A downloaded service-account key authenticates as the service account and carries all its IAM roles."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.firebase
    match: {check: ["m5.firebase-rules"]}
    rule: cloud.firebase
    sections:
      - text: "{title}: the Firebase project {evidence.artifact.project} returned its database contents anonymously ({research_ref})."
