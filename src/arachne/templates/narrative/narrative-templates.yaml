      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.iac
    match: {check: ["m5.tfstate-exposure"]}
    rule: cloud.iac
    sections:
      - text: "{title}: the rule '{evidence.artifact.rule}' matched in {evidence.artifact.locations} ({research_ref})."
      - text: "A static IaC review flags risky constructs before they reach production: open security groups, wildcard IAM, public buckets, unencrypted storage, privileged containers."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.k8s-kubelet
    match: {check: ["m5.k8s-exposure"]}
