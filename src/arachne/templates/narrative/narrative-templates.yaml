    sections:
      - text: "{title}: {evidence.artifact.start} reaches {evidence.artifact.goal} in {evidence.artifact.length} hop(s) ({research_ref})."
      - text: "A short escalation path to Domain Admin is the highest-value thing to break in an AD exposure model."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

