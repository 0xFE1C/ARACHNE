      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  # ----------------------------------------------------------------- M6 · automation, AI-era, post-exploit
  - id: m6.webshell
    match: {check: ["m6.webshell-yara"]}
    rule: m6.webshell
    sections:
      - text: "{title}: {evidence.artifact.location} carries a webshell signature or behaviour ({research_ref})."
      - text: "A webshell gives an attacker command execution as the web-server user; the signature/behaviour list above is the machine-readable reason it was flagged."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: m6.genai
    match: {check: ["m6.attack-surface-genai"]}
    rule: m6.genai-surface
    sections:
      - text: "{title}: {evidence.artifact.location} exposes a GenAI surface ({evidence.artifact.signal}) ({research_ref})."
      - text: "Exposed model endpoints, leaked model keys, served system prompts and over-privileged agent configs are the injection and agency risks of the LLM Top 10."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: m6.patch-gap
    match: {check: ["m6.cve-epss-correlation"]}
    rule: m6.patch-gap
    sections:
      - text: "{title}: {evidence.artifact.cve} affects {evidence.artifact.product} {evidence.artifact.version} (EPSS {evidence.artifact.epss}, KEV {evidence.artifact.kev}) ({research_ref})."
      - text: "A CVE with high EPSS or KEV status is one attackers reach for first; a host inside the affected range is in the patch gap."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: m6.lpe
    match: {check: ["m6.lpe-discovery"]}
    rule: m6.lpe
    sections:
      - text: "{title}: {evidence.artifact.cve} affects {evidence.artifact.product} {evidence.artifact.version} ({research_ref})."
      - text: "A version inside a local-privilege-escalation range turns any low-privilege foothold into root; it is the step between a webshell and full host control."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: m6.repo-secret
    match: {check: ["m6.secret-scan-at-scale"]}
    rule: m6.repo-secret
    sections:
      - text: "{title}: {evidence.artifact.location} contains {evidence.artifact.kind} credential material (history: {evidence.artifact.in_history}) ({research_ref})."
      - text: "A credential in a repository or its history must be treated as public; if it is live it grants whatever the identity can do."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: m6.ci-secret
    match: {check: ["m6.ci-secret-leak"]}
    rule: m6.ci-secret
    sections:
      - text: "{title}: {evidence.artifact.location} leaks {evidence.artifact.kind} material ({research_ref})."
      - text: "CI logs and artifacts outlive the job and are often readable by more people than the secret itself."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: m6.sigma
    match: {check: ["m6.sigma-hunt-rules"]}
    rule: m6.sigma-hit
    sections:
      - text: "{title}: rule '{evidence.artifact.rule_title}' matched a telemetry event in {evidence.artifact.location} ({research_ref})."
      - text: "The matched behaviour is a post-exploitation discovery step (ticket abuse, credential access, lateral movement or persistence), not a vulnerability scan."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: m6.deception
    match: {check: ["m6.deception-listeners"]}
    rule: m6.deception
    sections:
      - text: "{title}: honeytoken {evidence.artifact.decoy} was triggered ({evidence.artifact.at}) ({research_ref})."
      - text: "A honeytoken is only touched by an actor, never by legitimate users; a trigger is high-signal evidence of attacker contact."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: m6.ad-path
