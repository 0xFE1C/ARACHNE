  - id: cloud.registry
    match: {check: ["m5.registry-scan"]}
    rule: cloud.registry
    sections:
      - text: "{title}: the registry at {evidence.artifact.endpoint} listed {evidence.artifact.repository_count} repository(ies) anonymously ({research_ref})."
      - text: "An open registry catalog reveals internal image names and architecture; its images can then be pulled and mined for secrets and known-vulnerable packages."
      - text: "Recommended action: {remediation.summary}"
      - text: "Confidence: {confidence.band} ({confidence.value}/100)."

  - id: cloud.docker-api
    match: {check: ["m5.docker-socket"]}
