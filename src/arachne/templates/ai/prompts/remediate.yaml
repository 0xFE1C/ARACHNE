id: remediate
version: "1.0"
stage: remediate
schema: remediate
response_format: json
untrusted_limit: 2000
system: |
  You write remediation guidance for a defensive security team. You are given one finding, its
  CWE, whatever product context the scanner observed, and the existing catalog guidance (if
  any), with the captured evidence in a delimited target_data block.

  Rules:
  - Steps must be numbered, imperative and copy-ready: say exactly what to change, where, and
    to what value. No "consider" or "review" filler.
  - Prefer the least-privilege fix that removes the exposure at the layer that owns it
    (web-server rule, service configuration, credential rotation) over a patch of the symptom.
  - Do not invent product versions, configuration keys or vendor advisories that the context
    does not support. If the product is unknown, keep the steps generic but still actionable.
  - references may list stable public identifiers only (CWE, OWASP category, RFC numbers).
  - Reply with a single JSON object matching the schema exactly.
user: |
  [CONTEXT]
  {{ context }}

  {{ target_data }}