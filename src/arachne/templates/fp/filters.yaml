# Context filters for false-positive reduction (F-05-07).
#
# These are the pages that make a scanner noisy: a web server's default page, a "coming soon"
# placeholder, a WAF interstitial, a login wall. Each filter matches case-insensitive
# substrings against the response bodies and banner text a candidate captured. `decisive: true`
# marks a filter that can drop a finding on its own — but only when the placeholder is the
# *entire* substance of the candidate (a bare HTTP body with no parsed evidence behind it),
# because "the body says nothing useful" is not the same claim as "the exposure is false".
#
# Managed data (F-09-04): point ARACHNE_FP_FILTERS at another file to tune it.

version: "1.0"

filters:
  - id: placeholder.default-server-page
    kind: placeholder
    decisive: true
    detail: "the response is the web server's default page"
    patterns:
      - "Apache2 Ubuntu Default Page"
      - "Welcome to nginx"
      - "It works!"
      - "nginx default page"
      - "IIS Windows Server"
      - "Test Page for the HTTP Server"

  - id: placeholder.coming-soon
    kind: placeholder
    decisive: true
    detail: "the site is a parked or pre-launch placeholder"
    patterns:
      - "coming soon"
      - "under construction"
      - "this site is temporarily unavailable"
      - "default web site page"
      - "domain is for sale"
      - "buy this domain"
      - "future home of something quite cool"

  - id: placeholder.empty-shell
    kind: placeholder
    decisive: true
    detail: "the response body carries no application content"
    patterns:
      - "<title></title>"
      - "<body></body>"

  - id: waf.cloudflare
    kind: waf
    decisive: false
    detail: "the response is a Cloudflare challenge or block page"
    patterns:
      - "Attention Required! | Cloudflare"
      - "cf-error-details"
      - "Just a moment..."
      - "Checking your browser before accessing"
      - "cf-chl-"

  - id: waf.akamai
    kind: waf
    decisive: false
    detail: "the response is an Akamai edge block page"
    patterns:
      - "Reference #18."
      - "Access Denied You don't have permission to access"
      - "akamai"

  - id: waf.imperva
    kind: waf
    decisive: false
    detail: "the response is an Imperva/Incapsula block page"
    patterns:
      - "incap_ses"
      - "_Incapsula_Resource"
      - "Request unsuccessful. Incapsula incident ID"

  - id: waf.aws
    kind: waf
    decisive: false
    detail: "the response is an AWS WAF block page"
    patterns:
      - "Request blocked. We can't connect to the server"
      - "awswaf"

  - id: waf.modsecurity
    kind: waf
    decisive: false
    detail: "the response is a ModSecurity block page"
    patterns:
      - "ModSecurity Action"
      - "This error was generated by Mod_Security"
      - "not acceptable!"

  - id: wall.login-required
    kind: login_wall
    decisive: false
    detail: "the response is an unauthenticated login wall"
    patterns:
      - "please log in"
      - "please sign in"
      - "you must be logged in"
      - "session has expired"
      - "authentication required"
      - "401 Unauthorized"
