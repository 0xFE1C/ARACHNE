[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arachne"
version = "0.1.0"
description = "ARACHNE — defensive automated vulnerability-detection and reporting system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "0xFE1C (Felix)" }]
keywords = ["security", "vulnerability-scanner", "defensive-security", "reporting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
# Reference stack (the runtime dependency set).
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7,<3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "jinja2>=3.1",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  # A stuck test must fail the run, naming itself, instead of hanging the job
  # (REQ-QUAL-007, REQ-QUAL-012).
  "pytest-timeout>=2.3",
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  # Report QA (S8): validates the rendered JSON report against the versioned schema.
  "jsonschema>=4.21",
  # Provider tests (S9): cassettes record/replay the real HTTP path of the AI adapters.
  "vcrpy>=6.0",
]
# Dependency hygiene : installed in a dedicated CI step so a
# transient advisory never breaks the primary test job, and release-blocking on a
# tag push (S22, REQ-TRUST-003). Upper-bounded so a major audit-tool change is a
# reviewed decision, not a surprise.
audit = ["pip-audit>=2.7,<3"]
# Postgres support (F-09-02, F-07-04): the driver is an extra so the default SQLite install
# stays dependency-light. The container image installs `.[postgres]`.
postgres = ["psycopg[binary]>=3.1"]
# The headless browser (REQ-DET-015): JavaScript-rendered route discovery and DOM-sink
# detection. Deliberately an extra, and the most deliberate one in this file — a browser
# engine is a large attack surface *inside* the scanner (R-16, score 15), so the default and
# air-gapped installs must not contain it. `pip install arachne[browser]` adds the driver;
# with it absent `m3.dom-xss` reports itself skipped and nothing else changes. Lower-bounded
# and audited on the dependency cadence (R-16's residual risk).
browser = ["playwright>=1.44"]
# HTTP/3 and QUIC probing (REQ-DET-006). Deliberately an extra: the default and air-gapped
# installs never pull a QUIC stack, and `m2.http3-probe` records the extra's absence as an
# installation observation rather than failing. `pip install arachne[quic]` enables the
# handshake; everything else works without it.
quic = ["aioquic>=1.0"]
# The coverage-guided fuzzing engine's instrumentation (REQ-FUZZ-007). Deliberately an extra:
# the default and air-gapped installs keep the two dependency-free engines (`grammar`,
# `fingerprint`), and asking for `coverage` without this extra degrades to the default engine
# with the substitution recorded in the report. With it installed the engine is registered only
# once it has a target to instrument — `ARACHNE_FUZZ_COVERAGE_TARGET=module:callable`, the
# in-process parser or decoder whose coverage the run is guided by. It never measures a remote
# target's coverage; that needs instrumentation inside the target, which is the operator's.
fuzz-coverage = ["coverage[toml]>=7.0"]

[project.scripts]
arachne = "arachne.cli.main:run"

[project.urls]
Homepage = "https://github.com/0xFE1C/ARACHNE"
Repository = "https://github.com/0xFE1C/ARACHNE"
Issues = "https://github.com/0xFE1C/ARACHNE/issues"
Security = "https://github.com/0xFE1C/ARACHNE/security/advisories/new"

[tool.hatch.build.targets.wheel]
packages = ["src/arachne"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "migrations", "README.md", "alembic.ini"]

# ---------------------------------------------------------------- ruff (lint)
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "migrations/versions", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "PIE",  # flake8-pie
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RUF",  # ruff-specific
  "S",    # flake8-bandit (includes S307: eval)
  "SIM",  # flake8-simplify
  "ASYNC",# flake8-async
]
ignore = [
  "S101",    # asserts are the test idiom (also ignored per-file for tests)
  "SIM117",  # nested `with` is clearer in a few DB helper cases
  "RUF012",  # ClassVar annotations on pydantic/SQLAlchemy bases are noise
]

[tool.ruff.lint.per-file-ignores]
# The HTML renderer carries its stylesheet as one literal (a single-file report must not
# fetch anything), and the PDF renderer carries the base-14 font metric tables; both are
# data whose line length is set by the format, not by us.
"src/arachne/report/html_render.py" = ["E501"]
"src/arachne/report/pdf.py" = ["E501"]
# The DOM-sink instrumentation is a JavaScript source literal (REQ-DET-015). Its line length
# is set by the sink it wraps, not by us, exactly as the HTML renderer's stylesheet is.
"src/arachne/browser/sinks.py" = ["E501"]
"tests/**" = [
  "S101",   # asserts are the test idiom
  "S104",   # tests assert on "0.0.0.0" as data, they never bind a socket
  "S105",
  "S106",
  "S108",
  "S311",
  "S607",   # a test helper shells out to the developer's own git by name, never to a target's
  "ASYNC240",  # a test's blocking file read is the point; there is no loop to protect
  "DTZ001",
  "PTH",
  "T20",
]
"src/arachne/cli/**" = ["T20"]        # CLI output goes through typer.echo, ordering rules relaxed
# The fix engine's process module is the tool's second (and last) deliberate process
# boundary: it starts git and a repository's own test command, always as a validated argv
# list with no shell and a timeout. The bandit rules it trips are exactly the ones the
# module's docstring and tests/test_fix_safety.py answer structurally (a closed subcommand
# vocabulary, an enumerated runner allowlist, AST-asserted call shape), so repeating a
# noqa on each of the runners' branches would add noise, not information.
"src/arachne/fix/gitops.py" = ["S603", "S607"]
# The mutation gate (REQ-QUAL-008) runs the test suite in a subprocess, once per mutant, with
# the interpreter by name (`python -m pytest` — the same shape tools/wp_check.py uses to run
# the quality gates). The argv is a fixed list of literals and nothing is spliced into it: the
# mutant's identity and its test scope travel in the environment. Resolving the interpreter
# from PATH is the point — it is the operator's interpreter — and `preflight` refuses to start
# when that interpreter cannot import this project, so a wrong PATH is one clear error rather
# than a whole gate's worth of noise.
"src/arachne/fuzz/mutate.py" = ["S603", "S607"]
"migrations/**" = ["INP001", "I001"]
# The documentation checker asks the checkout's own `git` whether a cited commit exists
# (`git cat-file -t`). That is deliberately the operator's git, resolved from PATH rather
# than a pinned absolute path, because the gate has to answer the same question an operator
# would ask. The argv is a fixed list of literals with no shell.
"src/arachne/tools/doccheck.py" = ["S607"]
# The handoff gate asks the checkout's own `git` for commits and diffs and runs the quality
# gates (`ruff`, `mypy`, `python -m pytest`) in fresh processes. Each argv is a literal list
# and each program name is a literal — the same "operator's own tools" reasoning as
# doccheck.py — so the partial-path rule is the wrong rule here.
"src/arachne/tools/wp_check.py" = ["S607"]
# The quickstart runner executes the commands `docs/getting-started.md` declares, in a shell,
# because "the page runs verbatim" is the whole point of REQ-DOC-005. The shell and the
# `arachne` it verifies are the operator's — resolved from PATH, with the virtualenv the guide
# creates prepended to it — so a pinned absolute path would test a different thing than the
# page describes. The argv is a fixed list of literals; nothing untrusted is spliced into it.
"src/arachne/tools/quickstart.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["arachne"]

# ---------------------------------------------------------------- mypy (type)
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

# python-nmap is an optional runtime dependency (the pure-Python connect backend is the
# fallback) and ships no type information; the adapter that imports it is thin and its
# boundary is asserted by tests/unit/test_m2_scanners.py.
[[tool.mypy.overrides]]
module = ["nmap", "nmap.*"]
ignore_missing_imports = true

# WeasyPrint is the optional PDF backend (extra `pdf`); the built-in renderer is the default
# and the only one CI needs, so the import is guarded and untyped here.
[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

# Playwright is the optional browser driver (extra `browser`, REQ-DET-015): it ships no type
# information, the import is guarded, and the module that imports it is the transport — its
# own acceptance evidence is the optional integration module that runs when the extra is
# installed. Nothing in the crawl's decision path depends on it.
[[tool.mypy.overrides]]
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config --durations=25"
filterwarnings = ["error::DeprecationWarning:arachne.*"]
# Every test runs under a timeout (REQ-QUAL-012): the slowest legitimate test in the suite
# is under 60 s, so 60 is the cap and a stuck test fails, naming itself, instead of hanging
# the job. A genuinely slower test takes an explicit, reviewed `@pytest.mark.timeout(N)`.
timeout = 60
timeout_method = "signal"
markers = [
  "integration: needs the docker lab fixture ",
  "lab: runs against the local vulnerable lab",
  "parity: AI/heuristic parity suite ",
  "report_qa: golden-file report validation ",
  "perf: wall-clock benchmark of a synthetic 50-host/200-endpoint heuristic scan (G-06)",
]

# ---------------------------------------------------------------- mutation testing
# REQ-QUAL-008: coverage says a line ran, mutation says the assertion would notice. The gate
# targets the safety core, holds a minimum score, and fails on an allowlist entry that no
# longer matches a mutant (an allowlist that keeps growing without being pruned is how a gate
# stops being a gate).
#
# Each target names the tests that judge it. The scope travels to pytest through the
# environment, never on a command line. A narrower scope can only produce *more* survivors,
# never fewer, so choosing it cannot flatter the score.
[tool.arachne.mutation]
# The full-run floor. The measured score at this commit is **0.8021** (227 killed, 56
# survived, 283 scored) over the four modules, so the floor is the measured value rounded down
# to the report precision — the same rule the coverage floor uses — which leaves a one-mutant
# margin for a different interpreter. It is a floor and it ratchets up, never down: the 56
# survivors are real places where the safety core's assertions would not notice a wrong line,
# and closing them (a work package allowed to touch the safety suites) is what raises this.
min_score = 0.80
# The pull-request subset: every k-th mutant, deterministic. The nightly job runs them all.
sample = 12
# A twelve-mutant sample cannot resolve a few points, so the subset is held to a separate,
# looser floor and it is a smoke test rather than a measurement. The arithmetic, so it is not
# a number someone picked: with a true kill rate of 0.80, a sample of 12 clears 6 killed
# (0.50) with 99.6% probability, so a red sample is evidence of a broken gate rather than of
# ordinary variance. The full run is the measurement.
min_score_sample = 0.50
timeout_seconds = 300
budget_seconds = 5400

[[tool.arachne.mutation.target]]
path = "src/arachne/core/safety.py"
tests = [
  "tests/test_safety.py",
  "tests/unit/test_safety_policy.py",
  "tests/unit/test_scope.py",
  "tests/unit/test_target.py",
  "tests/test_ipv6_safety.py",
]

[[tool.arachne.mutation.target]]
path = "src/arachne/core/proof.py"
tests = [
  "tests/test_proof_safety.py",
  "tests/unit/test_proof_model.py",
  "tests/unit/test_oob_hardening.py",
  "tests/unit/test_verification_record.py",
]

[[tool.arachne.mutation.target]]
path = "src/arachne/core/integrity.py"
tests = [
  "tests/unit/test_audit.py",
  "tests/unit/test_integrity_chain.py",
  "tests/unit/test_evidence_custody.py",
  "tests/unit/test_residue_attestation.py",
  "tests/unit/test_pii_retention.py",
  "tests/unit/test_backup.py",
]

[[tool.arachne.mutation.target]]
path = "src/arachne/proof/sql.py"
tests = [
  "tests/unit/test_proof_model.py",
  "tests/test_proof_safety.py",
  "tests/unit/test_m3_checks.py",
]

# Every entry needs a reason, and the gate fails when one no longer matches a mutant. An
# allowlist is for mutants that are genuinely equivalent to the original, not for survivors
# nobody has looked at yet.
#
# It is EMPTY, and that is the measured result rather than an oversight: the first full run
# over all 283 mutants produced no mutant whose behaviour could not differ from the original.
# Every survivor below is a place where the safety core's tests would not notice a wrong line,
# which is what the gate exists to say. The mechanism (a mandatory reason, plus a failure when
# an entry no longer matches a mutant) is in place for the first genuinely equivalent mutant
# anyone finds.

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/arachne"]
branch = true
omit = ["src/arachne/templates/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# The branch-coverage floor (REQ-QUAL-011). The measured total at this commit is **82.95%**
# (59,711 statements + 18,690 branches; 82.95% combined), so the floor is 82 — the measured
# value rounded down to the report precision, which leaves a sub-point margin for a different
# interpreter without opening a hole. It ratchets up, never down; lowering it needs an ADR.
fail_under = 82
