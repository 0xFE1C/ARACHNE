# The lab's misconfigured Nginx (docs/spec/08- Phase 0).
#
# Deliberately wrong, and deliberately bounded: it listens on port 80 inside a container that
# compose publishes on 127.0.0.1 only.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # 1. Directory listing on: `m4.directory-listing` territory (S7).
    autoindex on;

    # 2. Version disclosure: the Server header names 1.18.0, which carries known CVEs
    #    (CVE-2019-20372, CVE-2021-23017) — that is the M2 fingerprint→CVE fixture.
    server_tokens on;

    # 3. `.env` and `.git` are served instead of denied: `m4.env-file-probe` /
    #    `m4.vcs-exposure` (S7) and `m4.sourcemap-exposure`.
    location ~ /\.(env|git|svn) {
        allow all;
    }

    # 4. A fake "API docs" folder so `m4.api-doc-exposure` has something to find.
    location /api-docs/ {
        autoindex on;
    }
}
