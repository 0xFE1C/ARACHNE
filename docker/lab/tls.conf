# The lab's weak-TLS endpoint (Phase 0), for `m2.tls-deep-scan`.
server {
    listen 443 ssl default_server;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/nginx/tls/expired.crt;
    ssl_certificate_key /etc/nginx/tls/expired.key;

    # Protocols that RFC 8996 deprecates.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    # A CBC-only, non-PFS cipher list (no AEAD, no forward secrecy on the RSA suites).
    ssl_ciphers 'AES128-SHA:AES256-SHA:DES-CBC3-SHA:RC4-SHA:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;

    server_tokens on;
}
