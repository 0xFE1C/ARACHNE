# ARACHNE CI — the gates a reviewer cares about, in order: lint, strict types, tests
# (two interpreters), migrations on a brand-new database. Then the shipped delivery
# surfaces: the default-credentials gate, the IaC gate, the Helm chart and the compose
# smoke. The dependency audit runs advisory on a branch and blocking on a version tag.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint (ruff, whole repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # TEMPORARY DIAGNOSTIC (remove once the help-rendering difference is understood): four
      # help tests pass on a developer machine and fail on this runner. This prints what the
      # runner actually renders and with which terminal geometry.
      - name: diagnostic — how this runner renders help
        continue-on-error: true
        run: |
          echo "COLUMNS=${COLUMNS:-unset} LINES=${LINES:-unset} TERM=${TERM:-unset}"
          python -c "import importlib.metadata as m; print({n: m.version(n) for n in ('typer', 'click', 'rich')})" || echo 'version probe failed'
          echo '--- does the root help carry --version on this runner? ---'
          python -m arachne.cli.main --help > /tmp/help.txt 2>&1 || echo 'help command failed'
          grep -c -- '--version' /tmp/help.txt || echo 'no --version found'
          wc -l /tmp/help.txt
          head -30 /tmp/help.txt || true
          echo '--- does the loopback lab zone resolve on this runner? ---'
          getent hosts lab.arachne.test || echo 'getent: no entry'
          python -c "import socket; print(socket.gethostbyname('lab.arachne.test'))" || echo 'gethostbyname raised'
          cat /etc/resolv.conf || true
      # The whole repository, not `src tests`: a gate that does not cover the tree is not a
      # gate (REQ-QUAL-006). No path exclusions hide a violation.
      - run: ruff check .
      - run: ruff format --check .

  types:
    name: types (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: mypy src

  docs:
    name: documentation integrity (REQ-DOC-001, REQ-DOC-002, REQ-QUAL-014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check verifies that every commit a document cites exists
          # (`git cat-file -t`), which a shallow clone cannot answer.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Every page carries an owner and a last-verified date, and a page past its declared
      # interval warns while one past two intervals fails (REQ-DOC-004).
      - run: python -m arachne.tools.docmeta --check
      # The changelog has one source and the release notes carry a generated index of it, so
      # the two cannot drift (REQ-DOC-004).
      - run: python -m arachne.tools.changelog --check
      # The quickstart still declares the version pyproject.toml ships and still carries every
      # step of the corridor. The execution itself is the `quickstart` job below (REQ-DOC-005).
      - run: python -m arachne.tools.quickstart --check
      # Every Markdown link, backticked path and docstring path resolves, and no document
      # cites a commit that is not in the repository.
      - run: python -m arachne.tools.doccheck .
      # The badge and prose counts are the registry's and the suite's, not typed by hand.
      - run: python -m arachne.tools.counts --check
      # The committed report schema is what the generator produces.
      - run: python -m arachne.tools.report_schema --check
      # The committed coverage ledger is what the registry generates: a check added without
      # regenerating fails here, naming the check id (REQ-DET-001, G3 clause 1).
      - run: python -m arachne.tools.ledger --check
      # Every accepted skip has a reason and no quarantine entry is past its deadline
      # (REQ-QUAL-010/011).
      - run: python -m arachne.tools.skip_gate .
      # The committed clients are what the generator produces from the live schema: a stale
      # client is a diff this step fails on, not something a reviewer has to notice
      # (REQ-UIX-001, REQ-UIX-003).
      - run: python -m arachne.tools.sdkgen --check

  a11y:
    name: accessibility and UI strings (REQ-UIX-007, REQ-UIX-008)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Each gate proves it can fail before it is trusted: --self-test drives every rule over
      # planted markup/strings and non-zeroes if one of them stopped firing. A rule nobody has
      # seen fail is a rule nobody knows works.
      - run: python -m arachne.api.a11y --self-test
      - run: python -m arachne.api.a11y
      - run: python -m arachne.i18n.audit --self-test
      - run: python -m arachne.i18n.audit

  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # A backstop for the asserted budget below: if the suite somehow overruns, the job dies
    # rather than occupying a runner.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # The suite asserts its own wall clock: a run over 15 minutes fails (REQ-QUAL-007).
      ARACHNE_SUITE_BUDGET: "900"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # One process, one total count, branch coverage enforced by [tool.coverage.report]
      # fail_under (REQ-QUAL-006, REQ-QUAL-007, REQ-QUAL-011).
      - run: python -m pytest tests -m "not perf" -q --cov --cov-report=term-missing

  quickstart:
    name: quickstart executed in a clean container (REQ-DOC-005)
    runs-on: ubuntu-latest
    # A fresh container, not a warm runner: "the quickstart works" is only measurable from an
    # environment that has never seen this project. The image is the stock Python slim image.
    container: python:3.12-slim
    # A cold install plus the corridor. The ten-minute target is asserted inside the tool; this
    # is only a backstop against a step that hangs.
    timeout-minutes: 20
    steps:
      # Before the checkout, because the checkout needs git. `curl` is what the guide's health
      # step uses, and it is part of the reader's environment rather than of the product.
      - name: give the clean container the tools the guide's commands need
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates
      - uses: actions/checkout@v4
      # The guide is executed *verbatim*: the tool reads docs/getting-started.md, extracts the
      # blocks the page marks `bash quickstart`, runs them in order and fails on the first
      # non-zero exit. The measured wall clock is reported and compared with the 10-minute
      # target; PYTHONPATH is only how the runner itself is loaded before the project's own
      # virtualenv exists.
      - name: run docs/getting-started.md verbatim and report the measured time
        run: |
          # `pipefail` is load-bearing: without it the pipeline's status is `tee`'s, and a
          # corridor that failed would still exit 0 — a gate that cannot fail.
          set -o pipefail
          PYTHONPATH=src python -m arachne.tools.quickstart --target-seconds 600 \
            | tee -a "$GITHUB_STEP_SUMMARY"
      # The self-test proves the job can fail: it drives a guide whose documented command exits
      # non-zero and asserts the runner reports it. A gate nobody has seen fail is a gate
      # nobody knows works.
      - name: a failing documented command fails this job (self-test)
        run: PYTHONPATH=src python -m arachne.tools.quickstart --self-test

  migrations:
    name: "migrations: reversibility, dry run, populated upgrade (REQ-OPS-008)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: arachne db upgrade
      - run: arachne db current
      # Every migration declares whether it is reversible, and an undeclared one fails here
      # rather than during a rollout (REQ-OPS-008).
      - run: arachne db migrations --check
      # The dry run must print SQL and change nothing: the revision is compared before and
      # after, so a dry run that quietly applied would fail this step.
      - name: the dry run prints SQL and leaves the database alone
        run: |
          before=$(arachne db current --database-url "sqlite:///dryrun.db" || true)
          arachne db upgrade 0015 --database-url "sqlite:///dryrun.db"
          arachne db upgrade --dry-run --database-url "sqlite:///dryrun.db" | tee /tmp/dry-run.sql
          grep -q "ADD COLUMN" /tmp/dry-run.sql
          # `db current` exits non-zero when the database is behind head, which is exactly the
          # state this step is proving (the dry run applied nothing), so the status is read
          # for its text rather than for its exit code.
          at=$(arachne db current --database-url "sqlite:///dryrun.db" || true)
          echo "$at" | grep -q "0015"
          test -n "$before"
      # REQ-OPS-008's acceptance criterion: an upgrade from two versions back on a database
      # that already holds rows. The unit test seeds it through the ORM.
      - run: python -m pytest tests/unit/test_migrations.py -q
      # The queue-depth autoscaling manifests, against the metric the API really exposes.
      - run: python -m pytest tests/test_autoscale_manifests.py -q

  mutation:
    name: mutation testing on the safety core (REQ-QUAL-008)
    runs-on: ubuntu-latest
    # A bounded subset on a pull request; the nightly rehearsal workflow runs the full set.
    # The ceiling is a backstop against a mutant that hangs the suite, not the budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Every mutant runs the real suite in a subprocess, so the interpreter on PATH must be
      # the one that has this project installed — it is, because pip installed it above.
      - run: python -m arachne.fuzz.mutate --sample 12 --check
      - run: python -m pytest tests/unit/test_mutation_gate.py -q

  observability:
    name: SLOs and error budgets (REQ-OPS-007)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The metric contract and the generated rules: a definition that measures a metric the
      # endpoint does not expose fails here, as does a rules file out of step with the
      # definitions. The same contract is asserted from a unit test; this is the operator's
      # own command.
      - run: python -m arachne.ops.slo --check
      - run: python -m pytest tests/unit/test_slo_contract.py -q

  credentials:
    name: no default credentials (REQ-OPS-006)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The gate is shipped code, so CI runs exactly what an operator would: the console
      # script over the checkout, no test harness involved. It still has to be installed —
      # the runner starts with an empty environment, and the gate is not on the default path.
      - run: pip install .
      - run: python -m arachne.tools.credentials_gate .

  iac-gate:
    name: IaC gate (REQ-ECOS-003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The review stores its findings, so the evidence store has to exist first: without a
      # schema the command fails with "run `arachne db upgrade` first" rather than reviewing.
      - run: python -m arachne.cli.main db upgrade
      # The offline IaC/CI tree review, emitted as GitHub annotations for the PR.
      - run: python -m arachne.tools.ci_annotate --path examples --fail-on high --format all --output-dir ci-annotations
      - uses: actions/upload-artifact@v4
        with:
          name: iac-gate-annotations
          path: ci-annotations

  helm:
    name: helm lint + render smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      # The chart refuses to render without credentials (REQ-OPS-006), so the smoke
      # passes throwaway values that are generated here and never committed. All three the
      # chart demands are supplied: the API key table, the agent key and the database
      # password — it ships no default for any of them.
      - name: collect the throwaway render values
        run: |
          echo 'RENDER_VALUES=--set api.auth.apiKeys=ui:viewer:render-only-smoke --set agent.auth.apiKey=render-only-smoke --set postgres.auth.password=render-only-smoke' >> "$GITHUB_ENV"
      - run: helm lint deploy/helm/arachne $RENDER_VALUES
      - run: helm template arachne deploy/helm/arachne $RENDER_VALUES > /dev/null
      # REQ-OPS-009: with queue-depth autoscaling enabled the chart must render an
      # HorizontalPodAutoscaler on the documented metric, and lint clean with it on.
      - name: the queue-depth HPA renders against the documented metric
        run: |
          helm lint deploy/helm/arachne $RENDER_VALUES \
            --set autoscaling.enabled=true
          helm template arachne deploy/helm/arachne $RENDER_VALUES \
            --set autoscaling.enabled=true > /tmp/hpa.yaml
          grep -q "^kind: HorizontalPodAutoscaler" /tmp/hpa.yaml
          grep -q "arachne_queue_depth" /tmp/hpa.yaml
          grep -q "status: queued" /tmp/hpa.yaml
          # The ScaledObject must NOT render at the same time: both scalers own the replica
          # count, so a chart that emitted both would let two controllers fight over it.
          ! grep -q "^kind: ScaledObject" /tmp/hpa.yaml
      - name: the KEDA ScaledObject renders instead when KEDA owns the pool
        run: |
          helm template arachne deploy/helm/arachne $RENDER_VALUES \
            --set autoscaling.enabled=true \
            --set autoscaling.keda.enabled=true > /tmp/keda.yaml
          grep -q "^kind: ScaledObject" /tmp/keda.yaml
          grep -q "arachne_queue_depth" /tmp/keda.yaml
          ! grep -q "^kind: HorizontalPodAutoscaler" /tmp/keda.yaml

  docker:
    name: compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Interpolation-only smoke: validates the compose file and its required
      # variables without starting a container.
      - run: docker compose -f docker/docker-compose.yml config -q
        env:
          POSTGRES_PASSWORD: render-only-smoke
          ARACHNE_API_KEYS: "ui:viewer:render-only-smoke"

  dependencies:
    name: dependency audit (advisory on branches, blocking on tags)
    runs-on: ubuntu-latest
    continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,audit]"
      - run: python -m pip_audit
