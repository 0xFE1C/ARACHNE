# ARACHNE release workflow — the supply-chain evidence chain (REQ-TRUST-002/003/011).
#
# On a version tag: audit (release-blocking) -> SBOM (generated and schema-validated
# by the shipped tool) -> build, sign (keyless cosign), attest the SBOM as CycloneDX,
# and emit SLSA v1.2 Build L3 provenance. The L3 claim is backed by GitHub's hosted
# builder: `actions/attest-build-provenance` signs the provenance with this workflow's
# OIDC identity, and the verification step below proves the attestation round-trips.
# Every action is pinned by a major-version tag and cosign by an env pin, so a
# "release" cannot silently lose a property of the chain.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  COSIGN_VERSION: v2.4.1
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  audit:
    name: dependency audit (release-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,audit]"
      # REQ-TRUST-003: a known-vulnerable transitive dependency blocks the release.
      - run: pip-audit --strict

  sbom:
    name: SBOM (CycloneDX, shipped tool)
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The SBOM is a product artifact: generated by the shipped tool, not ad hoc.
      # Validation against the vendored CycloneDX 1.5 schema is on by default for a
      # file output; the explicit step below re-checks the written artefact.
      - run: python -m arachne.tools.sbom --output sbom.cdx.json --validate
      - run: python -m arachne.tools.sbom --check sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  image:
    name: image (build, sign, attest, provenance)
    runs-on: ubuntu-latest
    needs: sbom
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Keyless signing: the OIDC identity is this workflow, which is what the
      # verification step below re-asserts.
      - run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      # The SBOM is attested against the image digest, typed as CycloneDX.
      - run: cosign attest --yes --type cyclonedx --predicate sbom/sbom.cdx.json "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # REQ-TRUST-011: prove the SLSA v1.2 Build L3 provenance is verifiable with the
      # published tooling (cosign v2.4.1, pinned above) and bound to this workflow's
      # OIDC identity. `slsaprovenance1` is cosign's name for https://slsa.dev/provenance/v1.
      - run: |
          cosign verify-attestation --type slsaprovenance1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}
