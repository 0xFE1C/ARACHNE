# Alembic configuration for ARACHNE.
#
# The database URL is NOT set here: migrations/env.py reads it from the ARACHNE
# environment (ARACHNE_DATABASE_URL, default sqlite:///arachne.db) so that secrets and
# deployment paths stay in the environment (F-08-01) and `alembic upgrade head` works
# with the same defaults as the application.

[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
path_separator = os

# Offline mode emits SQL instead of executing it; useful for review and for DBAs.
# sqlalchemy.url is injected by env.py.

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
