{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "arachne.fullname" . }}-postgres
  labels:
    {{- include "arachne.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "arachne.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
