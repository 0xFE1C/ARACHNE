{{- /* Secrets (REQ-OPS-005): env, files, or Vault.
  * `existingSecret` — you manage the Secret, the chart only references it.
  * `secretEnv` — rendered here from your release values (never committed by you).
  * Vault injection — no chart Secret at all; the injector mounts the files.
*/ -}}
{{- include "arachne.requireSecrets" . }}
{{- $renderAgentKey := and (gt (int .Values.agent.replicas) 0) .Values.agent.auth.apiKey (not .Values.agent.auth.existingSecret) }}
{{- $renderSecret := and (not .Values.api.auth.existingSecret) (or .Values.api.auth.apiKeys (not (empty .Values.api.secretEnv)) $renderAgentKey) }}
{{- if $renderSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arachne.fullname" . }}
  labels:
    {{- include "arachne.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.api.auth.apiKeys }}
  arachne-api-keys: {{ .Values.api.auth.apiKeys | quote }}
  {{- end }}
  {{- if and (gt (int .Values.agent.replicas) 0) .Values.agent.auth.apiKey (not .Values.agent.auth.existingSecret) }}
  arachne-agent-api-key: {{ .Values.agent.auth.apiKey | quote }}
  {{- end }}
  {{- range $key, $value := .Values.api.secretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "arachne.fullname" . }}-postgres
  labels:
    {{- include "arachne.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "postgres.auth.password is required (REQ-OPS-006)" .Values.postgres.auth.password | quote }}
{{- end }}
