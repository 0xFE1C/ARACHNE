# Packaging for the worked-example plugin (docs/plugin-developer-guide.md).
#
# The only ARACHNE-specific line is the entry-point group: `arachne.modules` is the group
# `ModuleRegistry.discover()` reads (ENTRY_POINT_GROUP, F-09-01). The entry point's value
# resolves to a ModuleGroup, a single Module subclass, or a sequence of either.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arachne-example-plugin"
version = "0.1.0"
description = "Worked-example ARACHNE check plugin (m4.example-version-banner)"
requires-python = ">=3.11"
# Depend on ARACHNE (or install the plugin editable into the same environment as ARACHNE).
dependencies = ["arachne>=0.1"]

[project.entry-points."arachne.modules"]
# group name -> target object (dotted path "module:attribute"). The attribute here is a
# ModuleGroup; exporting the class ExampleVersionBanner instead would also work.
example-version-banner = "arachne_example_plugin:PLUGIN_GROUP"

[tool.hatch.build.targets.wheel]
packages = ["src/arachne_example_plugin"]
